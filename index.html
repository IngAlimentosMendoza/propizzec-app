<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PROPIZZEC · Sistema de Producción</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUFJPUElaWkVDIn0=">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F9;
  --card:#FFFFFF;
  --ink:#0F172A;
  --muted:#64748B;
  --line:#E2E8F0;
  --datos:#2563EB;
  --personal:#D97706;
  --produccion:#059669;
  --paradas:#DC2626;
  --materia:#0D9488;
  --calidad:#7C3AED;
  --traza:#4F46E5;
  --danger:#DC2626;
  --ok:#059669;
  --editable:#3B82F6;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{cursor:pointer;font-family:inherit;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;background:var(--produccion);color:#fff;letter-spacing:.1px;box-shadow:0 1px 2px rgba(15,23,42,.08);transition:filter .12s ease,transform .1s ease;}
.btn:hover{filter:brightness(1.05);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent,var(--produccion));}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.btn.ghost:hover{background:#F8FAFC;}
.btn.danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.4;}
input[type=text],input[type=password]{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;
}
/* Distinción visual: editable (borde azul al enfocar) vs. solo lectura (rayado + monoespaciado) */
input:not([type=checkbox]):not([type=radio]):not(:disabled):focus,
select:not(:disabled):focus, textarea:not(:disabled):focus{
  outline:none;border-color:var(--editable);box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
input:disabled, select:disabled, textarea:disabled{
  background:#F1F5F9;border:1.5px dashed #CBD5E1;color:#64748B;
  font-family:'IBM Plex Mono',monospace;cursor:not-allowed;
}

/* ============ LOGIN ============ */
#loginScreen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:36px 16px 60px;
}
.login-brand{text-align:center;margin-bottom:28px;}
.login-brand .mark{
  width:56px;height:56px;border-radius:14px;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--produccion),var(--datos));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;
  font-family:'Space Grotesk',sans-serif;
}
.login-brand h1{font-size:20px;margin:0 0 4px;}
.login-brand p{margin:0;color:var(--muted);font-size:12.5px;}

.icon-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
  max-width:460px;width:100%;
}
@media(min-width:520px){.icon-grid{grid-template-columns:repeat(3,1fr);}}
.area-tile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  border:none;height:154px;box-sizing:border-box;justify-content:flex-start;overflow:hidden;
}
.area-tile .ic{
  width:46px;height:46px;min-width:46px;min-height:46px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;line-height:1;background:var(--c,var(--datos));
}
.area-tile .lbl{flex:1 1 auto;min-height:0;width:100%;font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.3;letter-spacing:.1px;display:flex;align-items:center;justify-content:center;overflow:visible;white-space:normal;word-break:normal;hyphens:none;}
.area-tile:active{transform:translateY(1px);}

#loginOverlay{
  display:none;position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:400;
  align-items:center;justify-content:center;padding:20px;
}
#loginOverlay .box{background:#fff;border-radius:14px;max-width:320px;width:100%;padding:22px;text-align:center;}
#loginOverlay .ic{
  width:52px;height:52px;border-radius:12px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;background:var(--c,var(--datos));
}
#loginOverlay h3{margin:0 0 4px;font-size:16px;}
#loginOverlay .err{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;}
#loginOverlay .row{display:flex;gap:8px;margin-top:14px;}
#loginOverlay .row .btn{flex:1;}

/* ============ APP SHELL ============ */
#appShell{display:none;min-height:100vh;}
header.top{
  background:#0F172A;color:#fff;padding:12px 14px;
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.hamburger{
  width:34px;height:34px;border:none;background:rgba(255,255,255,.08);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;
  position:relative;
}
.hamburger span, .hamburger span::before, .hamburger span::after{
  content:'';position:absolute;width:16px;height:2px;background:#fff;border-radius:2px;transition:transform .22s, opacity .18s, top .22s;
}
.hamburger span{top:16px;}
.hamburger span::before{content:'';top:-5px;}
.hamburger span::after{content:'';top:5px;}
.hamburger.open span{background:transparent;}
.hamburger.open span::before{top:0;transform:rotate(45deg);}
.hamburger.open span::after{top:0;transform:rotate(-45deg);}
header.top .htitle{flex:1;}
header.top .htitle h1{font-size:15px;margin:0;letter-spacing:.2px;background:linear-gradient(90deg,#34D399,#A7F3D0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}
header.top .htitle small{display:block;color:#94A3B8;font-size:10.5px;margin-top:1px;font-weight:400;}
header.top .harea{
  font-size:11px;font-weight:700;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:20px;
  display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);
}
header.top .harea .dot{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 rgba(52,211,153,.6);animation:dotPulse 2s infinite;}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55);}70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
header.top .btn.logout{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 10px;font-size:11.5px;box-shadow:none;}

#sideOverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:90;}
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:100;
  transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 20px rgba(0,0,0,.15);
  display:flex;flex-direction:column;padding:16px 0;
}
#sidebar.open{transform:translateX(0);}
#sideOverlay.show{display:block;}
.side-head{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.side-head b{font-family:'Space Grotesk',sans-serif;font-size:15px;}
.side-head span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.side-item{
  display:flex;align-items:center;gap:12px;padding:11px 16px;margin:1px 8px;font-size:13.5px;font-weight:600;color:#475569;
  border:none;background:none;width:calc(100% - 16px);text-align:left;border-radius:10px;transition:background .12s ease,color .12s ease;
}
.side-item .ic{width:22px;text-align:center;font-size:16px;}
.side-item.active{background:#ECFDF5;color:#047857;}
.side-item:active{background:#F1F5F9;}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);}

main#app{max-width:900px;margin:0 auto;padding:18px 16px 60px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;border-left:4px solid var(--accent, var(--line));
  box-shadow:0 1px 3px rgba(15,23,42,.05);
}
.card h2{font-size:15px;margin:0 0 4px;letter-spacing:.2px;color:var(--accent,var(--ink));}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px;}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.module-grid{grid-template-columns:1fr;}}
.module-tile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  text-align:left;border:none;border-top:3px solid var(--c,var(--line));
}
.module-tile h3{margin:0 0 4px;font-size:14px;}
.module-tile p{margin:0;color:var(--muted);font-size:12px;}
.stub{padding:36px 16px;text-align:center;color:var(--muted);}
.stub b{display:block;color:var(--ink);margin-bottom:6px;font-family:'Space Grotesk';font-size:15px;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:500;opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1;bottom:26px;}

/* ============ TABS ============ */
.tabbar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.tabbtn{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:8px 16px;font-size:12.5px;font-weight:700;color:var(--muted);transition:all .15s ease;
}
.tabbtn.active{background:var(--produccion);color:#fff;border-color:var(--produccion);box-shadow:0 2px 8px rgba(5,150,105,.25);}

/* ============ LIST TOOLBAR ============ */
.list-toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:160px;position:relative;}
.search-wrap input{padding-left:32px;}
.search-wrap .sic{position:absolute;left:10px;top:20px;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.bulk-del{display:none;}
.bulk-del.show{display:inline-flex;}
.list-meta{color:var(--muted);font-size:11.5px;margin:2px 2px 10px;}

/* ============ LIST ROWS ============ */
.reg-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05);}
.reg-row{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .12s ease;
}
.reg-row:hover{background:#FAFBFC;}
.reg-row:last-child{border-bottom:none;}
.reg-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--produccion);}
.reg-row .rmain{flex:1;min-width:0;cursor:pointer;}
.reg-row .rmain .sup{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;display:block;}
.reg-row .rmain .big{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3;}
.reg-row .rval{text-align:right;flex:0 0 auto;cursor:pointer;}
.reg-row .rval .sup{font-size:10px;color:var(--muted);font-weight:600;display:block;text-align:right;}
.reg-row .rval .big{font-size:16px;font-weight:700;color:var(--ink);font-family:'IBM Plex Mono',monospace;}
.reg-row .rval .sub{font-size:10px;color:var(--muted);font-weight:600;display:block;text-align:right;}
.reg-row.inactive .rmain .big{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
.reg-row .redit{flex:0 0 auto;width:30px;height:30px;border:none;background:#F1F5F9;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);transition:background .12s ease;}
.reg-row .redit:hover{background:#E2E8F0;}
.empty-state{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px;}

/* ============ MODAL (generic) ============ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:300;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal-panel{
  background:#fff;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:20px 18px 24px;position:relative;
}
@media(min-width:640px){.modal-panel{border-radius:16px;}}
.modal-panel .mclose{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;background:#F0EFEA;
  border-radius:50%;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.modal-panel h3{margin:0 8px 2px 0;font-size:17px;padding-right:30px;}
.modal-panel .msub{color:var(--muted);font-size:12px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.2px;text-transform:uppercase;}
.field select{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);
}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:4px;}
.toggle-row span{font-size:13px;font-weight:600;}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:.2s;}
.switch .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--produccion);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.danger-link{color:var(--danger);font-size:12.5px;font-weight:600;background:none;border:none;padding:8px 0;text-align:left;}
.inline-add{display:flex;gap:6px;}
.inline-add input{flex:1;}
.inline-add .btn{flex:0 0 auto;padding:11px 14px;}
.catalog-mini{max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;}
.catalog-mini-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--line);}
.catalog-mini-row:last-child{border-bottom:none;}
.catalog-mini-row button{background:none;border:none;color:var(--danger);font-size:12px;font-weight:600;}
.link-btn{background:none;border:none;color:var(--datos);font-size:12px;font-weight:600;padding:4px 0;text-decoration:underline;}

/* ============ KARDEX HISTORY MODAL ============ */
.kx-move{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.kx-move:last-child{border-bottom:none;}
.kx-move .l{color:var(--muted);}
.kx-move .l b{color:var(--ink);display:block;font-size:13px;}
.kx-move .r{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.kx-move .r.in{color:var(--ok);}
.kx-move .r.out{color:var(--danger);}
.kx-total{display:flex;justify-content:space-between;padding:14px 0 2px;margin-top:6px;border-top:2px solid var(--ink);font-weight:700;}

/* ============ FORMULACION INGREDIENT ROWS ============ */
.ing-row{display:flex;gap:8px;align-items:flex-end;padding:10px 0;border-bottom:1px solid var(--line);}
.ing-row:last-child{border-bottom:none;}
.ing-row .ing-name{flex:1;min-width:0;}
.ing-row .ing-name .sup{font-size:10px;color:var(--muted);font-weight:600;display:block;}
.ing-row .ing-name .nm{font-size:13px;font-weight:600;}
.ing-row .ing-qty{width:78px;flex:0 0 auto;}
.ing-row .ing-qty input{padding:8px;text-align:right;font-size:13px;}
.ing-row .ing-pct{width:52px;flex:0 0 auto;text-align:right;font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.ing-row .ing-med{width:78px;flex:0 0 auto;font-size:10px;color:var(--muted);text-align:center;}
.ing-row .ing-rm{width:26px;height:26px;flex:0 0 auto;border:none;background:#F7ECEA;color:var(--danger);border-radius:7px;}
.pct-total{text-align:right;font-size:11.5px;color:var(--muted);margin-top:4px;}
.pct-total.ok{color:var(--ok);}
.search-results{border:1px solid var(--line);border-radius:8px;max-height:170px;overflow-y:auto;margin-top:6px;}
.search-results .sr-item{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;}
.search-results .sr-item:last-child{border-bottom:none;}
.search-results .sr-item b{display:block;font-size:12px;color:var(--muted);font-weight:600;}
.search-results .sr-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;}

/* ============ PLANIFICACIÓN: header de orden ============ */
.op-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;padding-right:32px;}
.op-head .field{margin-bottom:0;flex:1;}
.op-head .op-badge{text-align:right;flex:0 0 auto;}
.op-head .op-badge .sup{display:block;font-size:10px;color:var(--muted);font-weight:600;}
.op-head .op-badge .big{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;}
.pf-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;}
.pf-row .field{flex:1;margin-bottom:0;}
.pf-lote-sup{font-size:10px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}

/* ============ INGREDIENTE — captura inicio/fin ============ */
.ci-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.ci-row:last-child{border-bottom:none;}
.ci-row .ci-name{flex:1;min-width:0;}
.ci-row .ci-name .sup{font-size:10px;color:var(--muted);font-weight:600;display:block;}
.ci-row .ci-name .nm{font-size:13px;font-weight:600;}
.ci-row .ci-val{flex:0 0 auto;text-align:right;min-width:80px;}
.ci-row .ci-val .cant{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;}
.ci-row .ci-val .med{font-size:10px;color:var(--muted);display:block;}
.ci-row .ci-lote{flex:0 0 auto;}
.ci-row .ci-lote button{font-size:11px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:#F0EFEA;color:var(--ink);font-weight:600;}
.ci-row .ci-lote button.set{background:var(--produccion);color:#fff;border-color:var(--produccion);}
.ci-row .ci-val input.ci-input-cant{
  width:74px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
  border:none;border-bottom:1.5px dashed var(--line);background:transparent;padding:2px 0;border-radius:0;
}
.ci-row .ci-val input.ci-input-cant:focus{outline:none;border-bottom-color:var(--editable);border-bottom-style:solid;box-shadow:none;}
.ci-row .ci-lote select.ci-lote-select{
  font-size:11px;padding:6px 24px 6px 10px;border-radius:7px;border:1px solid var(--line);background:#F0EFEA;color:var(--ink);font-weight:600;width:auto;
}
.ci-row .ci-lote select.ci-lote-select.set{background:var(--produccion);color:#fff;border-color:var(--produccion);}
.ci-row .ing-rm{width:26px;height:26px;flex:0 0 auto;border:none;background:#F7ECEA;color:var(--danger);border-radius:7px;}

/* ============ CALCULADORA ============ */
.calc-display{background:var(--ink);color:#fff;border-radius:10px;padding:16px 14px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:26px;margin-bottom:10px;word-break:break-all;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc-grid button{padding:16px 0;border-radius:10px;border:none;background:#F0EFEA;font-size:17px;font-weight:600;color:var(--ink);}
.calc-grid button.op{background:var(--datos);color:#fff;}

.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text-primary);
  padding:8px 13px;border-radius:10px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--s1);outline-offset:2px;}
.btn-primary{background:var(--s1);border-color:transparent;color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn svg{flex:none;}
input[type="file"]{display:none;}

.databadge{
  font-size:11.5px;color:var(--text-secondary);
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:var(--radius-chip);
  background:var(--surface-2);border:1px solid var(--border);
}
.databadge .dot{width:7px;height:7px;border-radius:50%;background:var(--status-good);flex:none;}
.databadge.demo .dot{background:var(--status-warning);}

/* ---------- filter bar ---------- */
.filterbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.filter-group{display:flex;align-items:center;gap:6px;}
.filter-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-right:2px;}
.chip{
  border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text-secondary);
  padding:6px 12px;border-radius:var(--radius-chip);
  font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .12s ease;
}
.chip .swatch{width:8px;height:8px;border-radius:50%;flex:none;}
.chip:hover{border-color:var(--border-strong);background:var(--surface-2);}
.chip.active{background:var(--text-primary);border-color:var(--text-primary);color:var(--page);}
.chip.active .swatch{outline:1.5px solid var(--page);}
input[type="date"], select.select{
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text-primary);
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:8px;padding:6px 8px;
}
.activefilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0 0;min-height:0;}
.activefilters:empty{display:none;}
.pill-filter{
  display:inline-flex;align-items:center;gap:6px;
  background:color-mix(in srgb, var(--s1) 14%, var(--surface));
  border:1px solid color-mix(in srgb, var(--s1) 35%, var(--border-strong));
  color:var(--text-primary);
  padding:4px 6px 4px 10px;border-radius:var(--radius-chip);font-size:12px;font-weight:600;
}
.pill-filter button{border:none;background:none;color:inherit;cursor:pointer;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;opacity:.7;}
.pill-filter button:hover{opacity:1;background:rgba(0,0,0,.08);}
.link-btn{background:none;border:none;color:var(--s1);font-size:12px;font-weight:700;cursor:pointer;padding:4px 2px;}
.link-btn:hover{text-decoration:underline;}

/* ---------- sections ---------- */
.dash-section{margin-top:28px;}
.dash-section.hidden{display:none;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.section-head h2{font-size:16.5px;font-weight:800;letter-spacing:-0.01em;}
.section-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.section-title-wrap{display:flex;flex-direction:column;gap:2px;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
}

/* ---------- KPI row ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:920px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{padding:16px 16px 14px;position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kpi-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}
.kpi-status{width:9px;height:9px;border-radius:50%;flex:none;}
.kpi-value{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-top:6px;}
.kpi-value span{font-size:15px;font-weight:700;color:var(--muted);margin-left:2px;}
.kpi-meta{font-size:12px;color:var(--text-secondary);margin-top:4px;}

/* ---------- objetivos de producción ---------- */
.objectives-card{padding:8px 20px 18px;}
.obj-row{
  display:grid;grid-template-columns:220px 1fr 150px 82px;gap:16px;align-items:center;
  padding:14px 4px;border-bottom:1px solid var(--border);
}
.obj-row:last-child{border-bottom:none;}
.obj-label{
  font-size:13px;font-weight:700;color:var(--text-primary);
  display:flex;align-items:center;gap:8px;background:none;border:none;
  font-family:inherit;cursor:pointer;padding:0;text-align:left;
}
.obj-label:disabled{cursor:default;}
.obj-label .swatch{width:9px;height:9px;border-radius:3px;flex:none;}
.obj-label.active{color:var(--s1);}
.obj-track{position:relative;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.obj-fill{position:absolute;top:0;left:0;height:100%;border-radius:999px;transition:width .25s ease;}
.obj-meta{font-size:11.5px;color:var(--muted);margin-top:6px;}
.obj-target-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.obj-target-wrap span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.obj-input-group{display:flex;align-items:center;gap:4px;}
.obj-input{
  width:84px;font-family:inherit;font-size:12.5px;font-weight:700;
  padding:6px 8px;border-radius:8px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text-primary);text-align:right;
}
.obj-input:focus-visible{outline:2px solid var(--s1);outline-offset:1px;}
.obj-unit{font-size:11px;color:var(--muted);font-weight:600;}
.obj-pct{font-size:16px;font-weight:800;font-family:var(--font-display);text-align:right;}
@media (max-width:760px){
  .obj-row{grid-template-columns:1fr;gap:8px;}
  .obj-target-wrap{align-items:flex-start;}
  .obj-pct{text-align:left;}
}

/* ---------- chart grid ---------- */
.chart-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;}
@media (max-width:980px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{padding:16px 18px 12px;}
.chart-card h3{font-size:13.5px;font-weight:700;}
.chart-card .section-sub{margin-bottom:10px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 2px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);font-weight:600;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}
.legend-swatch.line{width:14px;height:3px;border-radius:2px;}
.chart-scroll{overflow-x:auto;}
svg text{font-family:var(--font-body);}
.axis-label{fill:var(--muted);font-size:10.5px;font-weight:600;}
.grid-line{stroke:var(--grid);stroke-width:1;}
.baseline-line{stroke:var(--baseline);stroke-width:1;}
.bar-mark{cursor:pointer;transition:opacity .12s ease;}
.bar-mark:hover{opacity:.82;}
.bar-mark.dim{opacity:.28;}
.bar-value{font-size:11px;font-weight:700;fill:var(--text-primary);}
.hm-cell{cursor:pointer;stroke:var(--surface);stroke-width:2;transition:opacity .12s ease;}
.hm-cell:hover{stroke:var(--text-primary);}
.hm-cell.dim{opacity:.25;}
.hm-label{font-size:9.5px;fill:var(--text-secondary);font-weight:600;}
.line-path{fill:none;stroke-width:2;}
.dot-mark{cursor:pointer;}
.crosshair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none;}

.tooltip{
  position:fixed;z-index:80;pointer-events:none;
  background:var(--text-primary);color:var(--page);
  font-size:12px;font-weight:600;line-height:1.45;
  padding:8px 10px;border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
  max-width:230px;opacity:0;transform:translateY(3px);
  transition:opacity .1s ease;
}
.tooltip.show{opacity:1;}
.tooltip .tt-title{font-family:var(--font-display);font-weight:800;margin-bottom:2px;}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:10px;opacity:.9;font-weight:500;}

/* ---------- status pills ---------- */
.status-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;padding:3px 9px 3px 7px;border-radius:var(--radius-chip);
  white-space:nowrap;
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.status-pill.good{background:color-mix(in srgb, var(--status-good) 16%, var(--surface));color:var(--good-text);}
.status-pill.good .dot{background:var(--status-good);}
.status-pill.warning{background:color-mix(in srgb, var(--status-warning) 22%, var(--surface));color:#8a5a00;}
.status-pill.warning .dot{background:var(--status-warning);}
:root:not([data-theme="light"]) .status-pill.warning{color:#fddb98;}
:root[data-theme="dark"] .status-pill.warning{color:#fddb98;}
.status-pill.serious{background:color-mix(in srgb, var(--status-serious) 20%, var(--surface));color:#93441f;}
:root:not([data-theme="light"]) .status-pill.serious{color:#f5b494;}
:root[data-theme="dark"] .status-pill.serious{color:#f5b494;}
.status-pill.critical{background:color-mix(in srgb, var(--status-critical) 16%, var(--surface));color:var(--status-critical);}
.status-pill.critical .dot{background:var(--status-critical);}
.status-pill.neutral{background:var(--surface-2);color:var(--muted);}
.status-pill.neutral .dot{background:var(--muted);}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius-card);}
table.datatable{border-collapse:collapse;width:100%;min-width:920px;font-size:12.5px;}
table.datatable th{
  position:sticky;top:0;background:var(--surface);
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
  color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;
}
table.datatable td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary);white-space:nowrap;}
table.datatable tbody tr:hover{background:var(--surface-2);}
table.datatable td.strong{color:var(--text-primary);font-weight:600;}
.table-scrollbox{max-height:420px;overflow-y:auto;}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.search-input{
  font-family:inherit;font-size:12.5px;padding:7px 10px;border-radius:8px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary);min-width:200px;
}
.table-note{font-size:11.5px;color:var(--muted);}
.empty-row td{text-align:center;color:var(--muted);padding:26px;}

/* ---------- conclusions ---------- */
.conclusions-card{padding:18px 20px;}
.conclusions-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
.conclusions-list li{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13.5px;line-height:1.5;color:var(--text-secondary);
}
.conclusions-list li b{color:var(--text-primary);}
.conc-icon{
  flex:none;width:22px;height:22px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}

/* ---------- customize panel ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,11,11,.35);z-index:90;opacity:0;pointer-events:none;transition:opacity .15s ease;}
.overlay.show{opacity:1;pointer-events:auto;}
.sidepanel{
  position:fixed;top:0;right:0;height:100%;width:320px;max-width:88vw;
  background:var(--surface);border-left:1px solid var(--border-strong);
  z-index:91;transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column;
}
.sidepanel.show{transform:translateX(0);}
.sidepanel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.sidepanel-head h3{font-size:15px;font-weight:800;}
.sidepanel-body{padding:8px 12px;overflow-y:auto;flex:1;}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;}
.icon-btn:hover{background:var(--surface-2);color:var(--text-primary);}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 10px;border-radius:10px;
}
.toggle-row:hover{background:var(--surface-2);}
.toggle-row span{font-size:13px;font-weight:600;color:var(--text-primary);}
.switch{position:relative;width:38px;height:22px;flex:none;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch label{
  position:absolute;inset:0;background:var(--baseline);border-radius:999px;cursor:pointer;transition:background .15s ease;
}
.switch label::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + label{background:var(--s1);}
.switch input:checked + label::after{transform:translateX(16px);}
.sidepanel-foot{padding:14px 20px;border-top:1px solid var(--border);}

footer.appfoot{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}

<script>
/* =========================================================
   PANEL DE INDICADORES — PROPIZZEC
   Todo el procesamiento ocurre en el navegador del usuario.
   No se realiza ninguna petición de red con los datos.

(function(){
"use strict";

/* ---------- constantes de campos (deben coincidir con la Matriz de Registro) ---------- */
const F = {
  fecha:"Fecha", area:"Área / Proceso", codProd:"Código de Producto", producto:"Producto",
  presentacion:"Presentación / Formato", lote:"Lote de Producción", orden:"N° Orden de Producción",
  operarios:"N° Operarios Asignados", horaInicio:"Hora Inicio", horaFin:"Hora Fin",
  hBloque:"Horas Trabajadas en el Bloque (h)", hExtra:"Horas Extra Adicionales (h)",
  hTotales:"Horas Totales Trabajadas (h)", hhTotales:"Horas-Hombre Totales (H-H)",
  unidPlan:"Unidades Planificadas", unidProd:"Unidades Producidas (Total)",
  unidBuenas:"Unidades en Buen Estado (Conformes)", unidNoConf:"Unidades No Conformes / Rechazadas",
  unidReproc:"Unidades Reprocesadas", pctCumpl:"% Cumplimiento de Plan", pctConf:"% Producto Conforme",
  productividad:"Productividad (Unid / H-H)", nParadas:"N° de Paradas", tParadas:"Tiempo Total de Paradas (min)",
  motivoParada:"Motivo Principal de Parada", pctDisp:"% Disponibilidad (Tiempo)",
  mpKg:"Materia Prima Entrante (kg)", mermaKg:"Merma de Proceso (kg)", pctMerma:"% Merma",
  motivoMerma:"Motivo Principal de Merma", rendMp:"Rendimiento de Materia Prima (kg prod. / kg MP)",
  pesoTeo:"Peso Teórico Unidad (g)", pesoReal:"Peso Real Promedio Unidad (g)",
  tempProc:"Temperatura de Proceso Registrada (°C)", tPcc:"Tiempo de Proceso Crítico / PCC (min)",
  cumplPcc:"Cumplimiento de PCC", nNoConf:"N° de No Conformidades Detectadas",
  rechazoCalidad:"Producto Rechazado por Calidad (kg o unid)", oee:"OEE Estimado (%)",
  responsable:"Responsable del Registro", obs:"Observaciones"
};

const AREA_COLOR = { "MASA":"var(--s1)", "ACONDICIONAMIENTO 1":"var(--s2)", "ACONDICIONAMIENTO 2":"var(--s3)" };
const AREA_ORDER = ["MASA","ACONDICIONAMIENTO 1","ACONDICIONAMIENTO 2"];
const CAT_SLOTS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];

/* ---------- categorías de producto (para objetivos de producción) ---------- */
let CATEGORY_LABEL = {};
let CATEGORY_COLOR = {};
let CATEGORY_ORDER = [];
function slugify(s){
  const base = (s==null?"":String(s)).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  return base || "otros";
}
function rebuildCategoryMaps(){
  const present = Array.from(new Set(RAW.map(r=>r._producto))).filter(Boolean).sort();
  CATEGORY_LABEL = {};
  CATEGORY_COLOR = {};
  CATEGORY_ORDER = [];
  present.forEach((p,i)=>{
    const id = slugify(p);
    if(CATEGORY_ORDER.indexOf(id)===-1) CATEGORY_ORDER.push(id);
    CATEGORY_LABEL[id] = p;
    CATEGORY_COLOR[id] = CAT_SLOTS[i % CAT_SLOTS.length];
  });
}
function categoryOf(producto){
  return slugify(producto);
}

function resolveVar(v){
  if(typeof v === "string" && v.startsWith("var(")){
    const name = v.slice(4,-1).trim();
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#999";
  }
  return v;
}

/* ---------- estado global ---------- */
let RAW = [];
let usingDemo = true;
let sourceLabel = "Datos de ejemplo";
const filters = { areas:new Set(), productos:new Set(), categorias:new Set(), motivosParada:new Set(), motivosMerma:new Set(), dateFrom:"", dateTo:"" };
const PREF_KEY = "propizzec_dashboard_prefs_v1";
const SECTIONS = [
  {id:"kpis", label:"Indicadores clave (KPI)"},
  {id:"objetivos", label:"Objetivos de producción"},
  {id:"chart-area", label:"Producción por área"},
  {id:"chart-trend", label:"Tendencia OEE y cumplimiento"},
  {id:"chart-parada", label:"Motivos de parada"},
  {id:"chart-merma", label:"Motivos de merma"},
  {id:"heatmap", label:"Mapa de calor (OEE)"},
  {id:"chart-horas", label:"Horas trabajadas por área y día"},
  {id:"chart-composicion", label:"Composición de calidad"},
  {id:"tabla-control", label:"Tabla de control"},
  {id:"tabla-alertas", label:"Tabla de alertas"},
  {id:"conclusiones", label:"Conclusiones automáticas"},
];
let prefs = {};
SECTIONS.forEach(s => prefs[s.id] = true);
try{
  const saved = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
  Object.assign(prefs, saved);
}catch(e){}

let tableSearchTerm = "";

/* ---------- objetivos de producción (editables, persistidos por navegador) ---------- */
const TARGET_KEY = "propizzec_dashboard_targets_v1";
let targets = { merma:5 };
try{
  const savedT = JSON.parse(localStorage.getItem(TARGET_KEY) || "{}");
  Object.assign(targets, savedT);
}catch(e){}
function saveTargets(){ try{ localStorage.setItem(TARGET_KEY, JSON.stringify(targets)); }catch(e){} }

/* ---------- utilidades numéricas ---------- */
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function pct(v, digits){ digits = digits===undefined?1:digits; return (v*100).toFixed(digits)+"%"; }
function fmt(v, digits){ digits = digits===undefined?0:digits; return Number(v).toLocaleString("es-EC",{minimumFractionDigits:digits,maximumFractionDigits:digits}); }
function excelSerialToISODate(serial){
  const ms = Math.round((serial - 25569) * 86400 * 1000);
  const d = new Date(ms);
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,"0"), day = String(d.getUTCDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function excelSerialToTime(serial){
  const totalMin = Math.round((serial % 1) * 24 * 60);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function timeToHours(t){
  if(t === undefined || t === null || t === "") return null;
  if(typeof t === "number") return (t%1)*24;
  const parts = String(t).split(":");
  if(parts.length < 2) return null;
  return parseInt(parts[0],10) + parseInt(parts[1],10)/60;
}
function isoDateLabel(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("es-EC",{day:"2-digit",month:"short"});
}

/* ---------- derivar métricas por fila (recalcula, no confía en fórmulas del archivo) ---------- */
function deriveRow(r){
  const hi = timeToHours(r[F.horaInicio]);
  const hf = timeToHours(r[F.horaFin]);
  let hBloque = (hi!==null && hf!==null && hf>hi) ? (hf-hi) : num(r[F.hBloque]) || num(r[F.hTotales]);
  const hExtra = num(r[F.hExtra]);
  const hTotales = hBloque + hExtra;
  const operarios = num(r[F.operarios]);
  const hhTotales = hTotales * operarios;
  const unidPlan = num(r[F.unidPlan]), unidProd = num(r[F.unidProd]), unidBuenas = num(r[F.unidBuenas]);
  const unidNoConf = num(r[F.unidNoConf]), unidReproc = num(r[F.unidReproc]);
  const pctCumpl = unidPlan>0 ? unidProd/unidPlan : 0;
  const pctConf = unidProd>0 ? unidBuenas/unidProd : 0;
  const productividad = hhTotales>0 ? unidProd/hhTotales : 0;
  const tParadas = num(r[F.tParadas]);
  const pctDisp = hTotales>0 ? Math.max(0,(hTotales*60 - tParadas)/(hTotales*60)) : 0;
  const mpKg = num(r[F.mpKg]), mermaKg = num(r[F.mermaKg]);
  const pctMerma = mpKg>0 ? mermaKg/mpKg : 0;
  const pesoReal = num(r[F.pesoReal]);
  const rendMp = mpKg>0 ? (unidProd*pesoReal/1000)/mpKg : 0;
  const oee = pctDisp * pctCumpl * pctConf;
  return Object.assign({}, r, {
    _fecha: r[F.fecha], _area: r[F.area], _producto: r[F.producto],
    _hBloque:hBloque, _hTotales:hTotales, _hhTotales:hhTotales,
    _pctCumpl:pctCumpl, _pctConf:pctConf, _productividad:productividad,
    _tParadas:tParadas, _pctDisp:pctDisp, _mpKg:mpKg, _mermaKg:mermaKg, _pctMerma:pctMerma,
    _rendMp:rendMp, _oee:oee, _unidPlan:unidPlan, _unidProd:unidProd, _unidBuenas:unidBuenas,
    _unidNoConf:unidNoConf, _unidReproc:unidReproc,
    _motivoParada: r[F.motivoParada] || "Sin especificar",

    _nNoConf: num(r[F.nNoConf]),
  });
}

/* ---------- lectura de archivo (xlsx / xls / csv) — 100% en el navegador ---------- */
function readHeaderRow1(ws, XLSXlib){
  const aoa = XLSXlib.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false, range:1});
  if(!aoa.length) return [];
  const headers = aoa[0].map(h => (h===undefined||h===null) ? "" : String(h).trim());
  const rows = [];
  for(let i=1;i<aoa.length;i++){
    const arr = aoa[i];
    if(!arr || arr.every(v => v===undefined || v==="" || v===null)) continue;
    const obj = {};
    headers.forEach((h,idx)=>{
      if(!h) return;
      let v = arr[idx];
      if(v===undefined) v = "";
      obj[h] = v;
    });
    // convertir fecha (serial Excel) a ISO
    if(typeof obj[F.fecha] === "number"){ obj[F.fecha] = excelSerialToISODate(obj[F.fecha]); }
    if(typeof obj[F.horaInicio] === "number"){ obj[F.horaInicio] = excelSerialToTime(obj[F.horaInicio]); }
    if(typeof obj[F.horaFin] === "number"){ obj[F.horaFin] = excelSerialToTime(obj[F.horaFin]); }
    if(obj[F.fecha] || obj[F.area]) rows.push(obj);
  }
  return rows;
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array", cellDates:false});
      let sheetName = wb.SheetNames.includes("Registro_Produccion") ? "Registro_Produccion" : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      let rows = readHeaderRow1(ws, XLSX);
      if(!rows.length){
        // fallback: puede ser un CSV exportado sin la fila de banda de grupo
        const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, blankrows:false});
        if(aoa.length && String(aoa[0][0]).trim() === "DATOS GENERALES"){
          rows = readHeaderRow1(ws, XLSX);
        } else if(aoa.length){
          const headers = aoa[0].map(h=>String(h||"").trim());
          rows = aoa.slice(1).filter(a=>a.some(v=>v!==undefined&&v!=="")).map(arr=>{
            const obj = {}; headers.forEach((h,idx)=>{ if(h) obj[h]=arr[idx]===undefined?"":arr[idx]; });
            if(typeof obj[F.fecha]==="number") obj[F.fecha]=excelSerialToISODate(obj[F.fecha]);
            if(typeof obj[F.horaInicio]==="number") obj[F.horaInicio]=excelSerialToTime(obj[F.horaInicio]);
            if(typeof obj[F.horaFin]==="number") obj[F.horaFin]=excelSerialToTime(obj[F.horaFin]);
            return obj;
          });
        }
      }
      if(!rows.length){ alert("No se encontraron filas de datos reconocibles en el archivo. Verifique que use la hoja 'Registro_Produccion' de la plantilla."); return; }
      loadFromWorkbook(rows);
      sourceLabel = file.name + " (" + RAW.length + " registros)";
      updateDataBadge();
    }catch(err){
      console.error(err);
      alert("No se pudo leer el archivo. Asegúrese de que sea el .xlsx exportado de la Matriz de Registro (hoja Registro_Produccion) o un .csv equivalente.");
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- filtros ---------- */
function toggleSetFilter(set, value){
  if(set.has(value)) set.delete(value); else set.add(value);
  renderAll();
}
function applyFilters(rows){
  return rows.filter(r=>{
    if(filters.areas.size && !filters.areas.has(r._area)) return false;
    if(filters.productos.size && !filters.productos.has(r._producto)) return false;
    if(filters.categorias.size && !filters.categorias.has(categoryOf(r._producto))) return false;
    if(filters.motivosParada.size && !filters.motivosParada.has(r._motivoParada)) return false;
    if(filters.motivosMerma.size && !filters.motivosMerma.has(r._motivoMerma)) return false;
    if(filters.dateFrom && r._fecha < filters.dateFrom) return false;
    if(filters.dateTo && r._fecha > filters.dateTo) return false;
    return true;
  });
}
function activeFilterCount(){
  return filters.areas.size + filters.productos.size + filters.categorias.size + filters.motivosParada.size + filters.motivosMerma.size + (filters.dateFrom?1:0) + (filters.dateTo?1:0);
}

const tooltipEl = document.getElementById("tooltip");

function moveTooltip(evt){
  const x = evt.clientX, y = evt.clientY;
  const w = 240, h = 90;
  let left = x + 14, top = y + 14;
  if(left + w > window.innerWidth) left = x - w - 14;
  if(top + h > window.innerHeight) top = y - h - 14;
  tooltipEl.style.left = left+"px"; tooltipEl.style.top = top+"px";
}

/* ---------- helpers de formato / texto ---------- */
function escapeHtml(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function titleCase(s){
  if(!s) return "";
  if(s === s.toUpperCase() && s.length > 3){
    return s.split(" ").map(w => w.length ? w[0]+w.slice(1).toLowerCase() : w).join(" ");
  }
  return s;
}
function statusForOee(v){
  if(v>=0.85) return "good"; if(v>=0.70) return "warning"; if(v>=0.55) return "serious"; return "critical";
}
function statusForMerma(v){
  if(v<=0.03) return "good"; if(v<=0.06) return "warning"; if(v<=0.10) return "serious"; return "critical";
}
function statusForPcc(v){
  if(v==="Sí") return "good"; if(v==="N/A") return "neutral"; return "critical";
}
function statusPill(kind, label){
  return '<span class="status-pill '+kind+'"><span class="dot"></span>'+escapeHtml(label)+'</span>';
}

function statusColorVar(status){
  return {good:"var(--status-good)",warning:"var(--status-warning)",serious:"var(--status-serious)",critical:"var(--status-critical)",neutral:"var(--baseline)"}[status];
}
function objRowHtml(catId, label, color, fillPct, status, metaText, bigText, clickable){
  const activeCls = filters.categorias.has(catId) ? " active" : "";
  const labelTag = clickable
    ? '<button type="button" class="obj-label'+activeCls+'" data-catclick="'+catId+'"><span class="swatch" style="background:'+resolveVar(color)+'"></span>'+escapeHtml(label)+'</button>'

  return '<div class="obj-row">'
    + labelTag
    + '<div><div class="obj-track"><div class="obj-fill" style="width:'+fillPct+'%;background:'+resolveVar(statusColorVar(status))+'"></div></div>'
    + '<div class="obj-meta">'+metaText+'</div></div>'
    + '<div class="obj-target-wrap"><span>'+(catId==="merma"?"Máx. aceptable (%)":"Meta (unidades)")+'</span>'
    + '<div class="obj-input-group"><input class="obj-input" type="number" min="0" step="'+(catId==="merma"?"0.1":"1")+'" data-target="'+catId+'" value="'+(targets[catId]||"")+'" placeholder="0" />'+(catId==="merma"?'<span class="obj-unit">%</span>':'')+'</div></div>'
    + '<div class="obj-pct tabular" style="color:'+resolveVar(statusColorVar(status))+'">'+bigText+'</div>'
    + '</div>';
}
function renderObjectives(rows){
  const list = document.getElementById("objectivesList");
  const totals = {};
  CATEGORY_ORDER.forEach(id=>{ totals[id] = 0; });
  let mpKgTotal = 0, mermaKgTotal = 0;
  rows.forEach(r=>{
    const catId = categoryOf(r._producto);
    if(totals[catId]==null) totals[catId] = 0;
    totals[catId] += r._unidProd;
    mpKgTotal += r._mpKg; mermaKgTotal += r._mermaKg;
  });
  const rowsHtml = [];
  CATEGORY_ORDER.forEach(catId=>{
    const actual = totals[catId];
    const target = num(targets[catId]);
    const ratio = target>0 ? actual/target : null;
    const fillPct = target>0 ? Math.min(100, ratio*100) : 0;
    const status = target<=0 ? "neutral" : ratio>=1 ? "good" : ratio>=0.85 ? "warning" : ratio>=0.6 ? "serious" : "critical";
    const meta = target>0
      ? fmt(actual)+" / "+fmt(target)+" unid. — "+(actual>=target ? "meta alcanzada" : "faltan "+fmt(target-actual)+" unid.")
      : fmt(actual)+" unid. producidas — define una meta";
    const big = target>0 ? pct(Math.min(ratio,9.99),0) : "—";
    rowsHtml.push(objRowHtml(catId, CATEGORY_LABEL[catId], CATEGORY_COLOR[catId], fillPct, status, meta, big, true));
  });
  // Merma
  const actualFrac = mpKgTotal>0 ? mermaKgTotal/mpKgTotal : 0;
  const targetPct = num(targets.merma);
  const targetFrac = targetPct/100;
  const fillPctMerma = targetFrac>0 ? Math.min(100, (actualFrac/targetFrac)*100) : Math.min(100, actualFrac*100/0.15);
  const statusMerma = targetFrac<=0 ? "neutral" : actualFrac<=targetFrac ? "good" : actualFrac<=targetFrac*1.3 ? "warning" : "critical";
  const metaMerma = targetFrac>0
    ? fmt(mermaKgTotal,1)+" kg de "+fmt(mpKgTotal,1)+" kg de MP — máximo aceptable "+fmt(targetPct,1)+"%"
    : fmt(mermaKgTotal,1)+" kg de "+fmt(mpKgTotal,1)+" kg de MP — define un máximo aceptable";
  rowsHtml.push(objRowHtml("merma", "Merma", "var(--s8)", fillPctMerma, statusMerma, metaMerma, pct(actualFrac,1), false));

  list.innerHTML = rowsHtml.join("");
  list.querySelectorAll("input[data-target]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const key = e.target.dataset.target;
      const v = parseFloat(e.target.value);
      targets[key] = isFinite(v) && v>=0 ? v : 0;
      saveTargets();
      renderObjectives(applyFilters(RAW));
    });
    inp.addEventListener("click", e=> e.stopPropagation());
  });
  list.querySelectorAll("button[data-catclick]").forEach(btn=>{
    btn.addEventListener("click", ()=> toggleSetFilter(filters.categorias, btn.dataset.catclick));
  });
}

function renderKPIs(rows){
  const grid = document.getElementById("kpiGrid");
  if(!rows.length){ grid.innerHTML = '<div class="card kpi-card" style="grid-column:1/-1;text-align:center;color:var(--muted);padding:30px;">Sin datos para los filtros seleccionados.</div>'; return; }
  const n = rows.length;
  const avg = key => rows.reduce((s,r)=>s+r[key],0)/n;
  const sum = key => rows.reduce((s,r)=>s+r[key],0);
  const cumpl = avg("_pctCumpl"), conf = avg("_pctConf"), oee = avg("_oee"), disp = avg("_pctDisp"), merma = avg("_pctMerma");
  const totalProd = sum("_unidProd"), totalPlan = sum("_unidPlan");
  const prodH = sum("_hhTotales") > 0 ? totalProd/sum("_hhTotales") : 0;
  const paradaMin = sum("_tParadas");
  const kpis = [
    {label:"Cumplimiento de plan", value:pct(cumpl), meta: fmt(totalProd)+" / "+fmt(totalPlan)+" unid.", status: cumpl>=0.95?"good":cumpl>=0.85?"warning":"critical"},
    {label:"Producto conforme", value:pct(conf), meta: fmt(sum("_unidBuenas"))+" unid. buenas", status: conf>=0.95?"good":conf>=0.90?"warning":"critical"},
    {label:"OEE estimado", value:pct(oee), meta:"Disp. × Cumpl. × Calidad", status: statusForOee(oee)},
    {label:"Disponibilidad", value:pct(disp), meta: fmt(paradaMin)+" min de paradas", status: disp>=0.92?"good":disp>=0.85?"warning":"critical"},
    {label:"% Merma", value:pct(merma), meta: fmt(sum("_mermaKg"),1)+" kg de "+fmt(sum("_mpKg"),1)+" kg MP", status: statusForMerma(merma)},
    {label:"Productividad", value:fmt(prodH,1)+'<span>u/H-H</span>', meta:"Unidades por hora-hombre", status:"neutral", raw:true},
    {label:"Unidades producidas", value:fmt(totalProd), meta:n+" registros en el periodo", status:"neutral"},
    {label:"No conformidades", value:fmt(sum("_nNoConf")), meta: fmt(sum("_unidNoConf"))+" unid. rechazadas", status: sum("_nNoConf")===0 ? "good":"warning"},
  ];
  grid.innerHTML = kpis.map(k=>{
    const color = {good:"var(--status-good)",warning:"var(--status-warning)",serious:"var(--status-serious)",critical:"var(--status-critical)",neutral:"var(--muted)"}[k.status];
    return '<div class="card kpi-card"><div class="kpi-top"><span class="kpi-label">'+escapeHtml(k.label)+'</span><span class="kpi-status" style="background:'+resolveVar(color)+'"></span></div>'
      + '<div class="kpi-value tabular">'+ (k.raw ? k.value : escapeHtml(k.value)) +'</div>'
      + '<div class="kpi-meta tabular">'+escapeHtml(k.meta)+'</div></div>';
  }).join("");
}

/* ---------- SVG helpers ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* ---------- Gráfico de barras verticales: producción por área ---------- */
function renderChartArea(rows){
  const container = document.getElementById("chartArea");
  container.innerHTML = "";
  const byArea = {};
  AREA_ORDER.forEach(a=>byArea[a]={plan:0, prod:0});
  rows.forEach(r=>{ if(!byArea[r._area]) byArea[r._area]={plan:0,prod:0}; byArea[r._area].plan+=r._unidPlan; byArea[r._area].prod+=r._unidProd; });
  const areas = AREA_ORDER.filter(a=>byArea[a].plan || byArea[a].prod || RAW.some(r=>r._area===a));
  if(!areas.length){ container.innerHTML = emptyState(); return; }

  const W = 460, H = 260, padL = 46, padR = 14, padT = 16, padB = 34;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(1, ...areas.map(a=>Math.max(byArea[a].plan, byArea[a].prod)));
  const bandW = innerW / areas.length;
  const barW = Math.min(46, bandW*0.30);

  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H, role:"img", "aria-label":"Producción por área"});
  // gridlines
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const y = padT + innerH - (innerH*i/ticks);
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:y,y2:y,class:"grid-line"}));
    const t = svgEl("text",{x:padL-8,y:y+3,class:"axis-label",'text-anchor':"end"});
    t.textContent = fmt(Math.round(maxVal*i/ticks));
    svg.appendChild(t);
  }
  svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:padT+innerH,y2:padT+innerH,class:"baseline-line"}));

  areas.forEach((a,i)=>{
    const cx = padL + bandW*i + bandW/2;
    const color = resolveVar(AREA_COLOR[a]||"var(--s1)");
    const isDim = filters.areas.size>0 && !filters.areas.has(a);
    // plan (ghost outline)
    const planH = innerH * (byArea[a].plan/maxVal);
    const rectPlan = svgEl("rect",{x:cx-barW/2-barW*0.55, y:padT+innerH-planH, width:barW*0.5, height:Math.max(0,planH), rx:3, fill:"none", stroke:"var(--baseline)", "stroke-width":1.4, class:"bar-mark"+(isDim?" dim":"")});
    // prod
    const prodH = innerH * (byArea[a].prod/maxVal);
    const rectProd = svgEl("rect",{x:cx-barW/2, y:padT+innerH-prodH, width:barW, height:Math.max(0,prodH), rx:4, fill:color, class:"bar-mark"+(isDim?" dim":"")});
    [rectPlan, rectProd].forEach(el=>{
      el.addEventListener("click", ()=> toggleSetFilter(filters.areas, a));
      el.addEventListener("mousemove", (e)=>{ showTooltip(e, titleCase(a), [["Producidas", fmt(byArea[a].prod)],["Planificadas", fmt(byArea[a].plan)],["Cumplimiento", pct(byArea[a].plan? byArea[a].prod/byArea[a].plan:0)]]); });
      el.addEventListener("mouseleave", hideTooltip);
    });
    svg.appendChild(rectPlan); svg.appendChild(rectProd);
    const label = svgEl("text",{x:cx,y:padT+innerH+20,class:"axis-label","text-anchor":"middle"});
    label.textContent = titleCase(a).length>16 ? titleCase(a).slice(0,15)+"…" : titleCase(a);
    svg.appendChild(label);
    if(prodH>16){
      const val = svgEl("text",{x:cx,y:padT+innerH-prodH-6,class:"bar-value","text-anchor":"middle"});
      val.textContent = fmt(byArea[a].prod);
      svg.appendChild(val);
    }
  });
  container.appendChild(svg);
  const legend = document.createElement("div");
  legend.className = "chart-legend";
  legend.innerHTML = '<span class="legend-item"><span class="legend-swatch" style="background:'+resolveVar("var(--s1)")+'"></span>Producidas</span>'
    + '<span class="legend-item"><span class="legend-swatch" style="background:none;border:1.4px solid var(--baseline);"></span>Planificadas</span>';
  container.appendChild(legend);
}

/* ---------- Gráfico de línea: tendencia OEE / Cumplimiento por fecha ---------- */
function renderChartTrend(rows){
  const container = document.getElementById("chartTrend");
  const legend = document.getElementById("trendLegend");
  container.innerHTML = "";
  const byDate = {};
  rows.forEach(r=>{
    if(!byDate[r._fecha]) byDate[r._fecha] = {oeeSum:0,cumplSum:0,n:0};
    byDate[r._fecha].oeeSum += r._oee; byDate[r._fecha].cumplSum += r._pctCumpl; byDate[r._fecha].n++;
  });
  const dates = Object.keys(byDate).sort();
  if(!dates.length){ container.innerHTML = emptyState(); legend.innerHTML=""; return; }
  legend.innerHTML = '<span class="legend-item"><span class="legend-swatch line" style="background:'+resolveVar("var(--s1)")+'"></span>OEE estimado</span>'
    + '<span class="legend-item"><span class="legend-swatch line" style="background:'+resolveVar("var(--s2)")+'"></span>Cumplimiento de plan</span>';

  const W = Math.max(460, dates.length*46), H = 260, padL=42, padR=16, padT=18, padB=34;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const x = i => padL + (dates.length===1 ? innerW/2 : innerW*i/(dates.length-1));
  const y = v => padT + innerH - innerH*Math.max(0,Math.min(1.15,v))/1.15;

  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:Math.max(460,W), height:H, role:"img", "aria-label":"Tendencia de OEE y cumplimiento"});
  const ticks=[0,0.25,0.5,0.75,1,1.15];
  ticks.forEach(t=>{
    const yy = y(t);
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:yy,y2:yy,class:"grid-line"}));
    const lab = svgEl("text",{x:padL-8,y:yy+3,class:"axis-label","text-anchor":"end"}); lab.textContent=Math.round(t*100)+"%";
    svg.appendChild(lab);
  });
  svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:padT+innerH,y2:padT+innerH,class:"baseline-line"}));

  function path(getVal, color){
    let d = "";
    dates.forEach((dt,i)=>{ const v=getVal(byDate[dt]); d += (i===0?"M":"L")+x(i).toFixed(1)+","+y(v).toFixed(1)+" "; });
    const p = svgEl("path",{d:d.trim(), class:"line-path", stroke:color});
    svg.appendChild(p);
  }
  path(d=>d.oeeSum/d.n, resolveVar("var(--s1)"));
  path(d=>d.cumplSum/d.n, resolveVar("var(--s2)"));

  dates.forEach((dt,i)=>{
    const d = byDate[dt];
    [["oee",d.oeeSum/d.n,"var(--s1)"],["cumpl",d.cumplSum/d.n,"var(--s2)"]].forEach(([key,val,color])=>{
      const isDim = (filters.dateFrom && dt<filters.dateFrom) || (filters.dateTo && dt>filters.dateTo);
      const c = svgEl("circle",{cx:x(i),cy:y(val),r:4.5,fill:resolveVar(color),class:"dot-mark"+(isDim?" dim":""),stroke:"var(--surface)","stroke-width":1.6});
      c.addEventListener("click", ()=>{ filters.dateFrom = dt; filters.dateTo = dt; document.getElementById("dateFrom").value=dt; document.getElementById("dateTo").value=dt; renderAll(); });
      c.addEventListener("mousemove",(e)=> showTooltip(e, isoDateLabel(dt), [["OEE", pct(d.oeeSum/d.n)],["Cumplimiento", pct(d.cumplSum/d.n)],["Registros", String(d.n)]]));
      c.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(c);
    });
    if(dates.length<=16 || i%Math.ceil(dates.length/16)===0){
      const lab = svgEl("text",{x:x(i),y:padT+innerH+20,class:"axis-label","text-anchor":"middle"});
      lab.textContent = isoDateLabel(dt);
      svg.appendChild(lab);
    }
  });
  const scroll = document.createElement("div");
  scroll.appendChild(svg);
  container.appendChild(svg);
}

/* ---------- Barras horizontales: motivos de parada / merma ---------- */
function renderRankedBars(containerId, rows, groupKey, valueFn, filterSet, unitLabel, colorOffset){
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  const totals = {};
  rows.forEach(r=>{ const k=r[groupKey]; if(k==="Sin paradas"||k==="Sin merma") return; totals[k]=(totals[k]||0)+valueFn(r); });
  let entries = Object.entries(totals).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ container.innerHTML = emptyState("Sin incidencias registradas en el periodo."); return; }
  entries = entries.slice(0,8);
  const max = Math.max(...entries.map(e=>e[1]));
  const W = 460, rowH = 34, padL = 10, padR = 54, labelW = 168;
  const H = entries.length*rowH + 14;
  const barAreaW = W - labelW - padR;
  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H, role:"img", "aria-label":"Ranking de motivos"});
  entries.forEach(([k,v],i)=>{
    const yc = 10 + i*rowH + rowH/2;
    const w = barAreaW * (v/max);
    const color = resolveVar(CAT_SLOTS[(i+colorOffset)%CAT_SLOTS.length]);
    const isDim = filterSet.size>0 && !filterSet.has(k);
    const lab = svgEl("text",{x:labelW-8,y:yc+4,class:"axis-label","text-anchor":"end"});
    lab.textContent = k.length>26 ? k.slice(0,25)+"…" : k;
    svg.appendChild(lab);
    const rect = svgEl("rect",{x:labelW, y:yc-9, width:Math.max(2,w), height:18, rx:4, fill:color, class:"bar-mark"+(isDim?" dim":"")});
    rect.addEventListener("click", ()=> toggleSetFilter(filterSet, k));
    rect.addEventListener("mousemove",(e)=> showTooltip(e, k, [[unitLabel, fmt(v,1)],["% del total", pct(v/entries.reduce((s,e)=>s+e[1],0))]]));
    rect.addEventListener("mouseleave", hideTooltip);
    svg.appendChild(rect);
    const val = svgEl("text",{x:labelW+w+8,y:yc+4,class:"bar-value"});
    val.textContent = fmt(v,1);
    svg.appendChild(val);
  });
  container.appendChild(svg);
}

/* ---------- Heatmap ---------- */
function renderHeatmap(rows){
  const container = document.getElementById("heatmapChart");
  container.innerHTML = "";
  const areas = AREA_ORDER.filter(a=>RAW.some(r=>r._area===a));
  const dateSet = Array.from(new Set(rows.map(r=>r._fecha))).sort();
  if(!areas.length || !dateSet.length){ container.innerHTML = emptyState(); return; }
  const cellW = 34, cellH = 40, labelW = 172, padT = 10, padR=10;
  const W = labelW + dateSet.length*cellW + padR;
  const H = padT + areas.length*cellH + 26;
  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:W, height:H, role:"img", "aria-label":"Mapa de calor de OEE por área y fecha"});

  const grid = {};
  rows.forEach(r=>{
    const k = r._area+"|"+r._fecha;
    if(!grid[k]) grid[k] = {sum:0,n:0};
    grid[k].sum += r._oee; grid[k].n++;
  });
  const seqSteps = ["var(--seq-100)","var(--seq-200)","var(--seq-300)","var(--seq-400)","var(--seq-500)","var(--seq-600)","var(--seq-700)"];
  function colorFor(v){
    if(v===null) return resolveVar("var(--surface-2)");
    const idx = Math.min(seqSteps.length-1, Math.max(0, Math.round(v*(seqSteps.length-1))));
    return resolveVar(seqSteps[idx]);
  }

  areas.forEach((a,ri)=>{
    const yy = padT + ri*cellH;
    const lab = svgEl("text",{x:labelW-10,y:yy+cellH/2+4,class:"axis-label","text-anchor":"end"});
    lab.textContent = titleCase(a);
    svg.appendChild(lab);
    dateSet.forEach((dt,ci)=>{
      const xx = labelW + ci*cellW;
      const g = grid[a+"|"+dt];
      const v = g ? g.sum/g.n : null;
      const isDim = (filters.areas.size && !filters.areas.has(a));
      const rect = svgEl("rect",{x:xx,y:yy,width:cellW-2,height:cellH-2,rx:5,fill:colorFor(v),class:"hm-cell"+(isDim?" dim":"")});
      rect.addEventListener("click", ()=>{
        if(filters.areas.size===1 && filters.areas.has(a) && filters.dateFrom===dt && filters.dateTo===dt){
          filters.areas.clear(); filters.dateFrom=""; filters.dateTo=""; document.getElementById("dateFrom").value=""; document.getElementById("dateTo").value="";
        } else {
          filters.areas.clear(); filters.areas.add(a);
          filters.dateFrom = dt; filters.dateTo = dt;
          document.getElementById("dateFrom").value = dt; document.getElementById("dateTo").value = dt;
        }
        renderAll();
      });
      rect.addEventListener("mousemove",(e)=> showTooltip(e, titleCase(a)+" · "+isoDateLabel(dt), v===null? [["OEE","Sin datos"]] : [["OEE promedio", pct(v)],["Registros", String(g.n)]]));
      rect.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(rect);
    });
  });
  dateSet.forEach((dt,ci)=>{
    if(dateSet.length<=20 || ci%Math.ceil(dateSet.length/20)===0){
      const t = svgEl("text",{x:labelW+ci*cellW+cellW/2-1,y:padT+areas.length*cellH+16,class:"hm-label","text-anchor":"middle"});
      t.textContent = isoDateLabel(dt);
      svg.appendChild(t);
    }
  });
  container.appendChild(svg);

  const legend = document.createElement("div");
  legend.className = "chart-legend";
  legend.style.marginTop="10px";
  legend.innerHTML = '<span class="legend-item">OEE bajo</span>'
    + seqSteps.map(s=>'<span class="legend-swatch" style="background:'+resolveVar(s)+'"></span>').join("")
    + '<span class="legend-item">OEE alto</span>';
  container.appendChild(legend);
}

/* ---------- Barras apiladas: horas trabajadas por área y día ---------- */
function renderChartHoras(rows){
  const container = document.getElementById("chartHoras");
  const legendEl = document.getElementById("horasLegend");
  container.innerHTML = "";
  const areas = AREA_ORDER.filter(a=>RAW.some(r=>r._area===a));
  legendEl.innerHTML = areas.map(a=>'<span class="legend-item"><span class="legend-swatch" style="background:'+resolveVar(AREA_COLOR[a]||"var(--s1)")+'"></span>'+titleCase(a)+'</span>').join("");

  const byDateArea = {};
  rows.forEach(r=>{
    const dt = r._fecha;
    if(!byDateArea[dt]) byDateArea[dt] = {};
    byDateArea[dt][r._area] = (byDateArea[dt][r._area]||0) + r._hTotales;
  });
  const dates = Object.keys(byDateArea).sort();
  if(!dates.length){ container.innerHTML = emptyState(); return; }
  const totals = dates.map(dt=> areas.reduce((s,a)=>s+(byDateArea[dt][a]||0),0));
  const maxTotal = Math.max(1, ...totals);

  const W = Math.max(460, dates.length*46), H = 260, padL=38, padR=16, padT=22, padB=34;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const bandW = innerW/dates.length;
  const barW = Math.min(30, bandW*0.55);
  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:Math.max(460,W), height:H, role:"img", "aria-label":"Horas trabajadas por área y día"});

  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const yy = padT + innerH - innerH*i/ticks;
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:yy,y2:yy,class:"grid-line"}));
    const lab = svgEl("text",{x:padL-8,y:yy+3,class:"axis-label","text-anchor":"end"});
    lab.textContent = fmt(maxTotal*i/ticks,0);
    svg.appendChild(lab);
  }
  svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:padT+innerH,y2:padT+innerH,class:"baseline-line"}));

  dates.forEach((dt,i)=>{
    const cx = padL + bandW*i + bandW/2;
    let cursorY = padT+innerH;
    const dayTotal = totals[i];
    areas.forEach(a=>{
      const v = byDateArea[dt][a]||0;
      if(v<=0) return;
      const h = innerH * (v/maxTotal);
      const color = resolveVar(AREA_COLOR[a]||"var(--s1)");
      const isDim = filters.areas.size>0 && !filters.areas.has(a);
      const rect = svgEl("rect",{x:cx-barW/2, y:cursorY-h, width:barW, height:Math.max(0,h), fill:color, class:"bar-mark"+(isDim?" dim":"")});
      rect.addEventListener("click", ()=> toggleSetFilter(filters.areas, a));
      rect.addEventListener("mousemove",(e)=> showTooltip(e, titleCase(a)+" · "+isoDateLabel(dt), [["Horas trabajadas", fmt(v,1)+" h"],["% del día", pct(dayTotal? v/dayTotal:0)]]));
      rect.addEventListener("mouseleave", hideTooltip);
      svg.appendChild(rect);
      cursorY -= h;
    });
    if(dayTotal>0){
      const val = svgEl("text",{x:cx,y:cursorY-6,class:"bar-value","text-anchor":"middle"});
      val.textContent = fmt(dayTotal,1);
      svg.appendChild(val);
    }
    if(dates.length<=16 || i%Math.ceil(dates.length/16)===0){
      const lab = svgEl("text",{x:cx,y:padT+innerH+20,class:"axis-label","text-anchor":"middle"});
      lab.textContent = isoDateLabel(dt);
      svg.appendChild(lab);
    }
  });
  container.appendChild(svg);
}

/* ---------- Barras apiladas: composición de calidad por producto ---------- */
function renderComposicion(rows){
  const container = document.getElementById("chartComposicion");
  const legendEl = document.getElementById("compLegend");
  container.innerHTML = "";
  legendEl.innerHTML = '<span class="legend-item"><span class="legend-swatch" style="background:'+resolveVar("var(--s3)")+'"></span>Conformes</span>'
    + '<span class="legend-item"><span class="legend-swatch" style="background:'+resolveVar("var(--s4)")+'"></span>Reprocesadas</span>'
    + '<span class="legend-item"><span class="legend-swatch" style="background:'+resolveVar("var(--s8)")+'"></span>No conformes</span>';
  const byProd = {};
  rows.forEach(r=>{
    if(!byProd[r._producto]) byProd[r._producto] = {buenas:0,reproc:0,noconf:0,total:0};
    const b = byProd[r._producto];
    b.buenas += r._unidBuenas; b.reproc += r._unidReproc; b.noconf += Math.max(0,r._unidNoConf-r._unidReproc); b.total += r._unidProd;
  });
  let entries = Object.entries(byProd).filter(([k,v])=>v.total>0).sort((a,b)=>b[1].total-a[1].total).slice(0,10);
  if(!entries.length){ container.innerHTML = emptyState(); return; }
  const W = 900, rowH = 30, labelW = 210, padR = 60;
  const H = entries.length*rowH + 14;
  const barAreaW = W-labelW-padR;
  const max = Math.max(...entries.map(([k,v])=>v.total));
  const svg = svgEl("svg", {viewBox:"0 0 "+W+" "+H, width:"100%", height:H, role:"img", "aria-label":"Composición de calidad por producto"});
  entries.forEach(([prod,v],i)=>{
    const yc = 8 + i*rowH;
    const lab = svgEl("text",{x:labelW-8,y:yc+16,class:"axis-label","text-anchor":"end"});
    lab.textContent = prod.length>30 ? prod.slice(0,29)+"…" : prod;
    svg.appendChild(lab);
    let cursor = labelW;
    const isDim = filters.productos.size>0 && !filters.productos.has(prod);
    [[v.buenas,"var(--s3)","Conformes"],[v.reproc,"var(--s4)","Reprocesadas"],[v.noconf,"var(--s8)","No conformes"]].forEach(([val,color,name])=>{
      const w = barAreaW * (val/max);
      if(w>0.4){
        const rect = svgEl("rect",{x:cursor,y:yc,width:Math.max(0,w-1.5),height:20,fill:resolveVar(color),class:"bar-mark"+(isDim?" dim":"")});
        rect.addEventListener("click", ()=> toggleSetFilter(filters.productos, prod));
        rect.addEventListener("mousemove",(e)=> showTooltip(e, prod, [["Conformes",fmt(v.buenas)],["Reprocesadas",fmt(v.reproc)],["No conformes",fmt(v.noconf)],[name+" (seg.)",fmt(val)]]));
        rect.addEventListener("mouseleave", hideTooltip);
        svg.appendChild(rect);
      }
      cursor += w;
    });
    const val = svgEl("text",{x:cursor+8,y:yc+16,class:"bar-value"});
    val.textContent = fmt(v.total);
    svg.appendChild(val);
  });
  container.appendChild(svg);
}

function emptyState(msg){
  return '<div style="padding:34px 10px;text-align:center;color:var(--muted);font-size:13px;">'+escapeHtml(msg||"Sin datos para los filtros seleccionados.")+'</div>';
}

/* ---------- Tabla de control ---------- */
function renderControlTable(rows){
  const table = document.getElementById("controlTable");
  const cols = ["Fecha","Área","Producto","Lote","Operarios","Producidas","% Cumpl.","% Conf.","OEE","% Merma","PCC","Responsable"];
  table.querySelector("thead").innerHTML = "<tr>"+cols.map(c=>"<th>"+c+"</th>").join("")+"</tr>";
  let filtered = rows;
  if(tableSearchTerm){
    const q = tableSearchTerm.toLowerCase();
    filtered = rows.filter(r => [r._producto, r[F.lote], r[F.orden], r[F.responsable]].join(" ").toLowerCase().includes(q));
  }
  const sorted = filtered.slice().sort((a,b)=> a._fecha < b._fecha ? 1 : a._fecha > b._fecha ? -1 : 0);
  const shown = sorted.slice(0,200);
  const tbody = table.querySelector("tbody");
  if(!shown.length){

        + "<td class='tabular'>"+escapeHtml(r[F.operarios]||"—")+"</td>"
        + "<td class='tabular strong'>"+fmt(r._unidProd)+"</td>"
        + "<td class='tabular'>"+pct(r._pctCumpl)+"</td>"
        + "<td class='tabular'>"+pct(r._pctConf)+"</td>"
        + "<td>"+statusPill(oeeSt, pct(r._oee))+"</td>"
        + "<td>"+statusPill(mermaSt, pct(r._pctMerma))+"</td>"
        + "<td>"+statusPill(pccSt, r._cumplPcc)+"</td>"
        + "<td>"+escapeHtml(r[F.responsable]||"—")+"</td>"
        + "</tr>";
    }).join("");
  }
  document.getElementById("tableCount").textContent = filtered.length+" registros"+(filtered.length>200?" (mostrando 200)":"");
}

/* ---------- Tabla de alertas ---------- */
function renderAlertTable(rows){
  const table = document.getElementById("alertTable");
  const cols = ["Fecha","Área","Producto","Alerta","Valor","Motivo / Detalle"];
  table.querySelector("thead").innerHTML = "<tr>"+cols.map(c=>"<th>"+c+"</th>").join("")+"</tr>";
  const alerts = [];
  rows.forEach(r=>{
    if(r._oee < 0.70) alerts.push({r, kind:"OEE bajo", val:pct(r._oee), status:"critical", detail:"Meta ≥ 70%"});
    if(r._pctMerma > 0.06) alerts.push({r, kind:"Merma alta", val:pct(r._pctMerma), status:"serious", detail:r._motivoMerma});
    if(r._cumplPcc === "No") alerts.push({r, kind:"PCC no cumplido", val:"No", status:"critical", detail:"Verificar temperatura/tiempo crítico"});
  });
  alerts.sort((a,b)=> a.r._fecha < b.r._fecha ? 1 : -1);
  const tbody = table.querySelector("tbody");
  if(!alerts.length){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="'+cols.length+'">Sin alertas para los filtros seleccionados. Buen desempeño general.</td></tr>';
  } else {
    tbody.innerHTML = alerts.slice(0,150).map(a=> "<tr>"
      +"<td>"+escapeHtml(a.r._fecha)+"</td>"
      +"<td>"+escapeHtml(titleCase(a.r._area))+"</td>"
      +"<td class='strong'>"+escapeHtml(a.r._producto)+"</td>"
      +"<td>"+statusPill(a.status,a.kind)+"</td>"
      +"<td class='tabular strong'>"+escapeHtml(a.val)+"</td>"
      +"<td>"+escapeHtml(a.detail)+"</td>"
      +"</tr>").join("");
  }
}

/* ---------- Conclusiones automáticas ---------- */
function renderConclusions(rows){
  const list = document.getElementById("conclusionsList");
  if(!rows.length){ list.innerHTML = "<li>No hay datos suficientes con los filtros actuales para generar conclusiones.</li>"; return; }
  const items = [];
  const iconFor = (status) => '<span class="conc-icon" style="background:'+resolveVar({good:"var(--status-good)",warning:"var(--status-warning)",serious:"var(--status-serious)",critical:"var(--status-critical)",neutral:"var(--muted)"}[status])+'22"></span>';

  // OEE por área
  const byArea = {};
  rows.forEach(r=>{ if(!byArea[r._area]) byArea[r._area]={sum:0,n:0}; byArea[r._area].sum+=r._oee; byArea[r._area].n++; });
  const areaOee = Object.entries(byArea).map(([a,v])=>[a,v.sum/v.n]).sort((a,b)=>b[1]-a[1]);
  if(areaOee.length>1){
    items.push(["good", "<b>"+titleCase(areaOee[0][0])+"</b> presenta el mejor OEE promedio del periodo ("+pct(areaOee[0][1])+"), mientras que <b>"+titleCase(areaOee[areaOee.length-1][0])+"</b> registra el más bajo ("+pct(areaOee[areaOee.length-1][1])+")."]);
  } else if(areaOee.length===1){
    items.push([statusForOee(areaOee[0][1]), "El área <b>"+titleCase(areaOee[0][0])+"</b> tiene un OEE promedio de "+pct(areaOee[0][1])+" en el periodo seleccionado."]);
  }

  // Motivo de parada principal
  const paradaTotals = {};
  rows.forEach(r=>{ if(r._motivoParada && r._motivoParada!=="Sin paradas") paradaTotals[r._motivoParada]=(paradaTotals[r._motivoParada]||0)+r._tParadas; });
  const paradaEntries = Object.entries(paradaTotals).sort((a,b)=>b[1]-a[1]);
  const totalParadaMin = paradaEntries.reduce((s,e)=>s+e[1],0);
  if(paradaEntries.length){
    const [motivo, min] = paradaEntries[0];
    items.push(["warning", "La principal causa de paradas es <b>"+motivo.toLowerCase()+"</b>, con "+fmt(min)+" min ("+pct(totalParadaMin?min/totalParadaMin:0)+" del tiempo total de paradas registrado)."]);
  } else {
    items.push(["good","No se registraron paradas de producción en el periodo seleccionado."]);
  }

  // Motivo de merma principal
  const mermaTotals = {};
  rows.forEach(r=>{ if(r._motivoMerma && r._motivoMerma!=="Sin merma") mermaTotals[r._motivoMerma]=(mermaTotals[r._motivoMerma]||0)+r._mermaKg; });
  const mermaEntries = Object.entries(mermaTotals).sort((a,b)=>b[1]-a[1]);
  const totalMermaKg = mermaEntries.reduce((s,e)=>s+e[1],0);
  if(mermaEntries.length){
    const [motivo, kg] = mermaEntries[0];
    items.push(["warning", "La mayor fuente de merma es <b>"+motivo.toLowerCase()+"</b>, con "+fmt(kg,1)+" kg ("+pct(totalMermaKg?kg/totalMermaKg:0)+" de la merma total)."]);
  }

  // PCC
  const pccRows = rows.filter(r=>r._cumplPcc==="Sí" || r._cumplPcc==="No");
  if(pccRows.length){
    const ok = pccRows.filter(r=>r._cumplPcc==="Sí").length;
    const rate = ok/pccRows.length;
    items.push([rate>=0.98?"good":rate>=0.9?"warning":"critical", "El cumplimiento de Puntos Críticos de Control (PCC) fue de "+pct(rate)+" ("+ok+" de "+pccRows.length+" registros con verificación aplicable)."]);
  }

  // Tendencia OEE primera vs segunda mitad
  const dates = Array.from(new Set(rows.map(r=>r._fecha))).sort();
  if(dates.length>=4){
    const mid = Math.floor(dates.length/2);
    const firstDates = new Set(dates.slice(0,mid)), lastDates = new Set(dates.slice(mid));
    const a1 = rows.filter(r=>firstDates.has(r._fecha)); const a2 = rows.filter(r=>lastDates.has(r._fecha));
    const avgOee1 = a1.reduce((s,r)=>s+r._oee,0)/(a1.length||1); const avgOee2 = a2.reduce((s,r)=>s+r._oee,0)/(a2.length||1);
    const delta = avgOee2 - avgOee1;
    if(Math.abs(delta) >= 0.01){
      items.push([delta>0?"good":"serious", "El OEE promedio "+(delta>0?"mejoró":"empeoró")+" "+pct(Math.abs(delta))+" entre la primera y la segunda mitad del periodo analizado ("+pct(avgOee1)+" → "+pct(avgOee2)+")."]);
    } else {
      items.push(["neutral","El OEE se mantuvo estable a lo largo del periodo analizado (variación menor a 1 punto porcentual)."]);
    }
  }

  // Cumplimiento de plan global
  const totalProd = rows.reduce((s,r)=>s+r._unidProd,0), totalPlan = rows.reduce((s,r)=>s+r._unidPlan,0);
  const cumpl = totalPlan? totalProd/totalPlan:0;
  items.push([cumpl>=1?"good":cumpl>=0.9?"warning":"critical", "El cumplimiento global del plan de producción es de "+pct(cumpl)+" ("+fmt(totalProd)+" de "+fmt(totalPlan)+" unidades planificadas)."]);

  list.innerHTML = items.map(([status,html])=>"<li>"+iconFor(status)+"<span>"+html+"</span></li>").join("");
}

async function loadUsuariosArea(){
  if(!sb) return null;
  try{
    const { data, error } = await sb.from('usuarios_area').select('area,clave,activo');
    if(error) throw error;
    usuariosAreaCache = data;
    lastSyncOk = true;
    return data;

    lastSyncOk = false;
    return null;
  }
