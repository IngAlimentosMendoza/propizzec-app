      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" style="--accent:var(--paradas)" onclick="despConfirmCantidad('${escHtml(codigo)}')">Elegir lotes</button>
    </div>
  `);
}
let despLoteConsumo = { codigo:null, total:0, seleccion:{}, disponibles:[] };
async function despConfirmCantidad(codigo){
  const cant = parseFloat((document.getElementById('despCantNueva').value||'0').replace(',','.')) || 0;
  if(cant<=0){ toast('Ingresa una cantidad válida'); return; }
  const item = (cacheStock||[]).find(i=>i.codigo===codigo);
  const itemMaestro = (cacheItems||[]).find(i=>i.codigo===codigo);
  if(itemMaestro && itemMaestro.requiere_lote===false){
    // Ítem sin manejo de lotes: se agrega directo con lote fijo "N/A", sin pedir elegir lote.
    const nuevo = {
      id: 'di_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      item_codigo: codigo, item_nombre: item?item.nombre:codigo, medida: item?item.medida:'',
      cantidad: cant, lotes: [{ lote:'N/A', cantidad: cant }], temperatura: null
    };
    DespState.draft.items = (DespState.draft.items||[]).concat([nuevo]);
    closeModalAll();
    const s = document.getElementById('despItemSearch'); if(s) s.value='';
    const r = document.getElementById('despItemResults'); if(r) r.innerHTML='';
    despRenderItemList();
    toast('Producto agregado (sin lote)');
    despOpenItemDetalle(nuevo.id);
    return;
  }
  openModal(`
    <h3>${escHtml(item.nombre)}</h3>
    <div class="msub">Elige los lotes hasta completar ${fmtNum(cant)} ${escHtml(item.medida)}</div>
    <div id="despLoteList"><div class="empty-state">Cargando…</div></div>
    <div class="lote-remain" id="despLoteRemain"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" style="--accent:var(--paradas)" onclick="despConfirmLotes('${escHtml(codigo)}')">Agregar</button>
    </div>
  `);
  const { data, error } = await sb.from('v_kardex_lotes_disponibles').select('*').eq('item_codigo', codigo).order('fecha_ingreso');
  const listEl = document.getElementById('despLoteList');
  despLoteConsumo = { codigo, total: cant, seleccion:{}, disponibles: data||[] };
  if(error || !data || !data.length){ listEl.innerHTML = '<div class="empty-state">Sin lotes disponibles registrados en Kardex</div>'; return; }
  listEl.innerHTML = data.map(l=>`
    <div class="lote-row">
      <input type="checkbox" onchange="despToggleLote('${escHtml(l.lote)}', ${l.cantidad_disponible}, this.checked)">
      <div class="lm"><b>Lote ${escHtml(l.lote)}</b><span>Ingreso ${l.fecha_ingreso?l.fecha_ingreso.split('-').reverse().join('/'):'—'}${l.fecha_caducidad?(' · Caduca '+l.fecha_caducidad.split('-').reverse().join('/')):''}</span></div>
      <div class="lq">${fmtNum(l.cantidad_disponible)}</div>
    </div>
  `).join('');
  despLoteRecalc();
}
function despToggleLote(lote, disponible, checked){
  if(checked){
    const yaAsignado = Object.values(despLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
    const falta = Math.max(0, despLoteConsumo.total - yaAsignado);
    despLoteConsumo.seleccion[lote] = Math.min(disponible, falta);
  } else {
    delete despLoteConsumo.seleccion[lote];
  }
  despLoteRecalc();
}
function despLoteRecalc(){
  const asignado = Object.values(despLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
  const falta = Math.round((despLoteConsumo.total - asignado)*10000)/10000;
  const el = document.getElementById('despLoteRemain');
  if(el){
    el.className = 'lote-remain ' + (falta<=0.001 ? 'ok' : 'warn');
    el.innerHTML = `<span>A despachar: ${fmtNum(despLoteConsumo.total)}</span><span>${falta>0.001 ? ('Falta '+fmtNum(falta)) : 'Completo'}</span>`;
  }
}
function despConfirmLotes(codigo){
  const seleccionados = Object.entries(despLoteConsumo.seleccion).filter(([,v])=>v>0).map(([lote,cantidad])=>({lote, cantidad}));
  if(!seleccionados.length){ toast('Selecciona al menos un lote'); return; }
  const item = (cacheStock||[]).find(i=>i.codigo===codigo);
  const nuevo = {
    id: 'di_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    item_codigo: codigo, item_nombre: item?item.nombre:codigo, medida: item?item.medida:'',
    cantidad: despLoteConsumo.total, lotes: seleccionados, temperatura: null
  };
  DespState.draft.items = (DespState.draft.items||[]).concat([nuevo]);
  closeModalAll(); // se abrirá el detalle del ítem con datos frescos; evita dejar el modal de cantidad/lotes en la pila
  const s = document.getElementById('despItemSearch'); if(s) s.value='';
  const r = document.getElementById('despItemResults'); if(r) r.innerHTML='';
  despRenderItemList();
  toast('Producto agregado');
  despOpenItemDetalle(nuevo.id);
}
function despRenderItemList(){
  const wrap = document.getElementById('despItemList');
  if(!wrap) return;
  const items = DespState.draft.items||[];
  if(!items.length){ wrap.innerHTML = '<div class="empty-state">Sin productos agregados todavía.</div>'; return; }
  wrap.innerHTML = items.map(it=>`
    <div class="reg-row" onclick="despOpenItemDetalle('${it.id}')">
      <div class="rmain">
        <span class="sup">${escHtml(it.item_codigo)} · Lote(s): ${escHtml((it.lotes||[]).map(l=>l.lote).join(', '))}</span>
        <span class="big">${escHtml(it.item_nombre)}</span>
      </div>
      <div class="rval">
        <span class="sup">CANTIDAD</span>
        <span class="big">${fmtNum(it.cantidad)}</span>
        <span class="sub">${escHtml(it.medida)}${it.temperatura!=null?(' · '+it.temperatura+'°C'):''}</span>
      </div>
      <button class="redit" title="Eliminar" onclick="event.stopPropagation();despDeleteItem('${it.id}')">✕</button>
    </div>
  `).join('');
}
function despDeleteItem(id){
  DespState.draft.items = (DespState.draft.items||[]).filter(i=>i.id!==id);
  despRenderItemList();
}
function despOpenItemDetalle(itemId){
  const it = (DespState.draft.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  openModal(`
    <span class="sup" style="font-size:11px;color:var(--muted);font-weight:600;">${escHtml(it.item_codigo)}</span>
    <h3 style="margin-top:2px;">${escHtml(it.item_nombre)}</h3>
    <div class="msub">Lote(s): ${escHtml((it.lotes||[]).map(l=>l.lote+' ('+fmtNum(l.cantidad)+')').join(', '))} · ${fmtNum(it.cantidad)} ${escHtml(it.medida)}</div>
    <div class="field"><label>Temperatura del producto (°C)</label><input type="text" inputmode="decimal" id="diTemp" value="${it.temperatura!=null?fmtRaw(it.temperatura):''}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn primary" style="--accent:var(--paradas)" onclick="despGuardarItemDetalle('${itemId}')">Guardar</button>
    </div>
  `);
}
function despGuardarItemDetalle(itemId){
  const it = (DespState.draft.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  const tempVal = document.getElementById('diTemp').value;
  it.temperatura = tempVal!=='' ? parseFloat(tempVal.replace(',','.')) : null;
  closeModal();
  despRenderItemList();
  toast('Producto actualizado');
}

/* ---------------- Guardar / Cancelar ---------------- */
function despCancelarDraft(){
  if(!confirm('¿Cancelar este despacho? Se perderá lo ingresado.')) return;
  DespState.draft = null;
  despRenderLiberacion();
}
async function despGuardarRegistro(){
  const d = DespState.draft;
  if(!d.destino){ toast('Ingresa el destino'); return; }
  if(!d.items || !d.items.length){ toast('Agrega al menos un producto'); return; }
  if(!d.hora_salida) d.hora_salida = nowHM();
  const payload = { ...d, estado:'cerrado', updated_at: new Date().toISOString() };
  const isEdit = !!payload.id;
  let saved, error;
  if(isEdit){
    const id = payload.id; delete payload.id;
    ({ data: saved, error } = await sb.from('despacho_registros').update(payload).eq('id', id).select().single());
  } else {
    ({ data: saved, error } = await sb.from('despacho_registros').insert(payload).select().single());
  }
  if(error){ toast('Error al guardar: ' + error.message); return; }
  const comprobante = 'DESPACHO N°' + d.numero_despacho + ': FACTURA ' + (d.factura||'—');
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  const movimientos = [];
  (d.items||[]).forEach(it=>{
    (it.lotes||[]).forEach(l=>{
      if(Number(l.cantidad)>0){
        movimientos.push({ item_codigo: it.item_codigo, fecha: d.fecha, lote: l.lote, comprobante, entra:0, sale: Number(l.cantidad) });
      }
    });
  });
  if(movimientos.length){
    const { error: errK } = await sb.from('kardex_movimientos').insert(movimientos);
    if(errK){ toast('Registro guardado, pero hubo un error al descontar del Kardex: ' + errK.message); }
  }
  await invLoad(true);
  DespState.draft = null;
  toast('Despacho guardado en Registros y descontado del Kardex');
  DespState.tab = 'registros';
  setActiveTab('registros');
  renderDespRegistrosTab();
}

/* ---------------- Registros ---------------- */
const DespRegState = { q:'', desde:'', hasta:'', rows:null };
async function despRegLoad(){
  let query = sb.from('despacho_registros').select('*').order('numero_despacho',{ascending:false});
  if(DespRegState.desde) query = query.gte('fecha', DespRegState.desde);
  if(DespRegState.hasta) query = query.lte('fecha', DespRegState.hasta);
  const { data, error } = await query.limit(1000);
  DespRegState.rows = error ? [] : (data||[]);
}
function despRegFiltered(){
  let rows = (DespRegState.rows||[]).slice();
  const q = (DespRegState.q||'').trim().toUpperCase();
  if(q){
    rows = rows.filter(r=>
      String(r.numero_despacho).includes(q) ||
      (r.factura||'').toUpperCase().includes(q) ||
      (r.cliente||'').toUpperCase().includes(q) ||
      (r.items||[]).some(it=>(it.item_codigo||'').toUpperCase().includes(q) || (it.item_nombre||'').toUpperCase().includes(q))
    );
  }
  return rows;
}
async function renderDespRegistrosTab(){
  const root = document.getElementById('despRoot');
  if(!root) return;
  root.innerHTML = `
    <div class="list-toolbar">
      <div class="search-wrap"><span class="sic">🔎</span>
        <input type="text" id="drSearch" placeholder="Buscar por producto, código, N° despacho, factura o cliente…" value="${escHtml(DespRegState.q)}">
      </div>
      <button class="btn primary" style="--accent:var(--paradas)" onclick="despNuevoDespacho()">+ Nuevo</button>
    </div>
    <div class="field-row" style="margin-bottom:6px;">
      <div class="field"><label>Desde</label><input type="date" id="drDesde" value="${escHtml(DespRegState.desde)}"></div>
      <div class="field"><label>Hasta</label><input type="date" id="drHasta" value="${escHtml(DespRegState.hasta)}"></div>
    </div>
    <div class="field-row" style="margin-bottom:6px;">
      <button class="btn" style="width:100%;" onclick="despExportExcel()">⬇ Descargar Excel</button>
    </div>
    <div class="list-meta" id="drMeta">Cargando…</div>
    <div class="reg-list" id="drList"><div class="empty-state">Cargando…</div></div>
  `;
  document.getElementById('drSearch').addEventListener('input', e=>{ DespRegState.q=e.target.value; despRenderRegistrosList(); });
  document.getElementById('drDesde').addEventListener('change', e=>{ DespRegState.desde=e.target.value; despRegReload(); });
  document.getElementById('drHasta').addEventListener('change', e=>{ DespRegState.hasta=e.target.value; despRegReload(); });
  await despRegReload();
}
async function despRegReload(){ await despRegLoad(); despRenderRegistrosList(); }
function despRenderRegistrosList(){
  const list = document.getElementById('drList');
  const meta = document.getElementById('drMeta');
  if(!list) return;
  const rows = despRegFiltered();
  meta.textContent = rows.length + ' despacho(s) encontrado(s)';
  if(!rows.length){ list.innerHTML = '<div class="empty-state">Sin resultados</div>'; return; }
  list.innerHTML = rows.map(r=>{
    const primerItem = (r.items||[])[0];
    return `<div class="reg-row">
      <div class="rmain" onclick="despVerDetalle('${r.id}')">
        <span class="sup">Factura ${escHtml(r.factura||'—')} · ${escHtml(r.cliente||'')}</span>
        <span class="big">DESPACHO N° ${r.numero_despacho}${primerItem?(' · '+escHtml(primerItem.item_codigo)+' — '+escHtml(primerItem.item_nombre)+(primerItem.lotes&&primerItem.lotes.length?(' ('+escHtml(primerItem.lotes.map(l=>l.lote).join(', '))+')'):'')):''}</span>
      </div>
      <div class="rval" onclick="despVerDetalle('${r.id}')">
        <span class="sup">${ddMMyy(r.fecha)}</span>
        <span class="sub">${(r.items||[]).length} producto(s)</span>
      </div>
      <button class="redit" title="Imprimir / PDF" onclick="event.stopPropagation();despImprimir('${r.id}')">🖨️</button>
      <button class="redit" title="Editar" onclick="event.stopPropagation();despEditar('${r.id}')">✎</button>
      <button class="redit" title="Eliminar" onclick="event.stopPropagation();despEliminar('${r.id}')">✕</button>
    </div>`;
  }).join('');
}
function despVerDetalle(id){ despEditar(id); }
function despEditar(id){
  const row = (DespRegState.rows||[]).find(r=>r.id===id);
  if(!row) return;
  DespState.draft = JSON.parse(JSON.stringify(row));
  DespState.tab = 'liberacion';
  setActiveTab('liberacion');
  despRenderLiberacion();
}
function despNuevoDespacho(){
  DespState.draft = null;
  DespState.tab = 'liberacion';
  setActiveTab('liberacion');
  despRenderLiberacion();
}
async function despEliminar(id){
  if(!confirm('¿Eliminar este despacho? Esto también revertirá (devolverá) las cantidades descontadas del Kardex.')) return;
  const row = (DespRegState.rows||[]).find(r=>r.id===id);
  if(row){
    const comprobante = 'DESPACHO N°' + row.numero_despacho + ': FACTURA ' + (row.factura||'—');
    await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  }
  const { error } = await sb.from('despacho_registros').delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  await Promise.all([despRegReload(), invLoad(true)]);
  toast('Despacho eliminado y Kardex revertido');
}
function despFlattenItemsPorLote(items){
  const flat = [];
  (items||[]).forEach(it=>{
    const lotes = (it.lotes&&it.lotes.length) ? it.lotes : [{lote:'', cantidad:it.cantidad}];
    lotes.forEach(l=>{
      flat.push({ item_codigo: it.item_codigo, item_nombre: it.item_nombre, medida: it.medida, lote: l.lote, cantidad: l.cantidad, temperatura: it.temperatura });
    });
  });
  return flat;
}
function despImprimir(id){
  const row = (DespRegState.rows||[]).find(r=>r.id===id);
  if(!row) return;
  const win = window.open('', '_blank');
  const fechaFmt = row.fecha ? row.fecha.split('-').reverse().join('/') : '';
  const filasItems = despFlattenItemsPorLote(row.items);
  const itemsHtml = filasItems.map(f=>`
    <tr>
      <td>${escHtml(f.item_codigo)}</td><td>${escHtml(f.item_nombre)}</td>
      <td>${escHtml(f.lote||'')}</td><td>${fmtNum(f.cantidad)} ${escHtml(f.medida)}</td>
      <td>${f.temperatura!=null?f.temperatura+' °C':''}</td>
    </tr>`).join('');
  const libHtml = LIBERACION_PRODUCTO_ITEMS.map(p=>`<tr><td>${escHtml(p)}</td><td style="text-align:center;">${escHtml((row.liberacion_producto||{})[p]||'')}</td></tr>`).join('');
  const genHtml = GENERALIDADES_VEHICULO_ITEMS.map(p=>`<tr><td>${escHtml(p)}</td><td style="text-align:center;">${escHtml((row.generalidades_vehiculo||{})[p]||'')}</td></tr>`).join('');
  const ctrlHtml = CONTROLES_DESPACHO_ITEMS.map(p=>`<tr><td>${escHtml(p)}</td><td style="text-align:center;">${escHtml((row.controles||{})[p]||'')}</td></tr>`).join('');
  win.document.write(`
    <html><head><title>Despacho N° ${row.numero_despacho}</title>
    <style>
      body{font-family:Arial,sans-serif;font-size:12px;padding:20px;color:#111;}
      h1{font-size:15px;margin:4px 0;} h3{margin:14px 0 4px;}
      table{width:100%;border-collapse:collapse;margin:6px 0;}
      td,th{border:1px solid #999;padding:5px;font-size:10.5px;} th{background:#eee;}
      .row{display:flex;justify-content:space-between;gap:16px;margin:5px 0;padding-bottom:5px;border-bottom:1px solid #ddd;}
      .row span{flex:1;}
      img.firma{height:55px;border:1px solid #999;}
      .header{display:flex;align-items:center;gap:14px;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:10px;}
      .header img{height:70px;}
      .header .info{font-size:11px;line-height:1.4;font-weight:bold;}
      .compra-title{font-size:13px;font-weight:bold;margin:6px 0;}
      .evid-page{page-break-before:always;page-break-inside:avoid;width:100%;height:96vh;box-sizing:border-box;display:flex;flex-direction:column;padding:14px 0;}
      .evid-label{font-size:13px;font-weight:bold;margin-bottom:10px;text-align:center;}
      .evid-img{width:100%;flex:1;max-height:88vh;object-fit:contain;border:1px solid #999;}
      .evid-pdf{width:100%;flex:1;border:1px solid #999;}
    </style></head><body>
    <div class="header">
      <img src="${PROPIZZEC_LOGO_B64}" alt="Logo">
      <div class="info">
        PROPIZZEC SA<br>
        RUC: 0993141062001<br>
        AV.MIGUEL YUNEZ VIA SAMBORONDON KM 14,5<br>
        ALMAX 3 DIAGONAL GASOLINERA PRIMAX<br>
        SAMBORONDON – ECUADOR
      </div>
    </div>
    <h1>DESPACHO E INSPECCIÓN TRANSPORTE Y LIBERACIÓN DE PRODUCTO TERMINADO</h1>
    <div class="compra-title">DESPACHO N° ${row.numero_despacho}</div>
    <div class="row"><span>Fecha: ${fechaFmt}</span></div>
    <div class="row"><span>Cliente: ${escHtml(row.cliente||'')}</span><span>Destino: ${escHtml(row.destino||'')}</span></div>
    <div class="row"><span>Factura: ${escHtml(row.factura||'')}</span><span>Placa: ${escHtml(row.placa||'')}</span></div>
    <div class="row"><span>Hora de llegada: ${escHtml(row.hora_llegada||'')}</span><span>Hora de salida: ${escHtml(row.hora_salida||'')}</span></div>
    <h3>Productos</h3>
    <table><tr><th>Código</th><th>Nombre</th><th>Lote</th><th>Cantidad</th><th>Temperatura</th></tr>${itemsHtml}</table>
    <h3>Liberación del producto</h3>
    <table><tr><th>Ítem</th><th>Resultado</th></tr>${libHtml}</table>
    <h3>Generalidades del vehículo</h3>
    <table><tr><th>Ítem</th><th>Resultado</th></tr>${genHtml}</table>
    <h3>Controles</h3>
    <table><tr><th>Ítem</th><th>Resultado</th></tr>${ctrlHtml}</table>
    <p><b>Observaciones:</b> ${escHtml(row.observaciones||'—')}</p>
    <div class="row" style="margin-top:30px;border-bottom:none;">
      <div>${row.firma_elaborado?`<img class="firma" src="${row.firma_elaborado}">`:''}<div>Elaborado por: ${escHtml(row.elaborado_por||'')}</div></div>
      <div>${row.firma_verificado?`<img class="firma" src="${row.firma_verificado}">`:''}<div>Verificado por: ${escHtml(row.verificado_por||'')}</div></div>
    </div>
    ${despEvidenciasHtml(row)}
    <script>window.onload = () => window.print();<\/script>
    </body></html>
  `);
  win.document.close();
}
function despEvidenciasHtml(row){
  if(!row.factura_archivo) return '';
  return `
    <div class="evid-page">
      <div class="evid-label">Evidencia — Factura</div>
      ${row.factura_archivo.startsWith('data:application/pdf') ? `<embed src="${row.factura_archivo}" type="application/pdf" class="evid-pdf">` : `<img src="${row.factura_archivo}" class="evid-img">`}
    </div>
  `;
}
function despExportExcel(){
  const rows = despRegFiltered();
  const FIELDS = ['N° Despacho','Fecha','Destino','Cliente','Factura','Placa','Hora Llegada','Hora Salida','Código Producto','Producto','Lote','Cantidad','Medida','Temperatura', ...LIBERACION_PRODUCTO_ITEMS, 'Observaciones'];
  const aoa = [FIELDS];
  rows.forEach(r=>{
    const filas = despFlattenItemsPorLote(r.items);
    (filas.length?filas:[{}]).forEach(f=>{
      aoa.push([
        r.numero_despacho, r.fecha, r.destino||'', r.cliente||'', r.factura||'', r.placa||'', r.hora_llegada||'', r.hora_salida||'',
        f.item_codigo||'', f.item_nombre||'', f.lote||'', f.cantidad||'', f.medida||'', f.temperatura!=null?f.temperatura:'',
        ...LIBERACION_PRODUCTO_ITEMS.map(p=>(r.liberacion_producto||{})[p]||''),
        r.observaciones||''
      ]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = FIELDS.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Despacho');
  XLSX.writeFile(wb, 'Despacho_PROPIZZEC_' + todayISO() + '.xlsx');
  toast('Excel exportado');
}

  updateDbStat('Conectando…');
  await loadUsuariosArea();
  updateDbStat();
}

(async function boot(){
  renderAreaGrid(); // pintura rápida con las áreas fijas
  const saved = sessionStorage.getItem('propizzec_area');
  if(saved){ enterApp(saved); }
  else{
    await loadUsuariosArea(); // precarga claves para validar más rápido al elegir área
    renderAreaGrid(); // repinta agregando las áreas personalizadas que existan
  }
})();
