async function guardarMonParadaEdit(paradaId, cronogramaId){
  const hi = document.getElementById('mpeInicio').value;
  const hf = document.getElementById('mpeFin').value;
  const motivo = document.getElementById('mpeMotivo').value || null;
  const inicioISO = hi ? hmToISOToday(hi) : null;
  const finISO = hf ? hmToISOToday(hf) : null;
  let minutos = null;
  if(inicioISO && finISO) minutos = Math.max(0, Math.round(((new Date(finISO).getTime()-new Date(inicioISO).getTime())/60000)*100)/100);
  const { error } = await sb.from('paradas').update({ inicio: inicioISO, fin: finISO, minutos, motivo }).eq('id', paradaId);
  if(error){ toast('Error: '+error.message); return; }
  closeModal();
  await monLoadParadasInfo(cronogramaId, true);
  await monLoadParadasList(cronogramaId, true);
  toast('Parada actualizada');
  monRenderBody();
}
function monMotivoSelect(id, tipo, current, cronoId, field){

async function monAddCatalogo(tipo, inputId, selectId){
  const nombre = document.getElementById(inputId).value.trim();
  if(!nombre){ toast('Escribe un valor'); return; }
  const { error } = await sb.from('catalogos').insert({ tipo, nombre });
  if(error){ toast('Error: '+error.message); return; }
  // No recargamos toda la pantalla (perdería lo ya ingresado en el formulario).
  // Solo refrescamos el catálogo y actualizamos el select afectado en el lugar.
  const { data } = await sb.from('catalogos').select('*').eq('activo', true);
  if(data) cacheCatalogosPlan = data;
  const sel = document.getElementById(selectId);
  if(sel){
    const opts = (cacheCatalogosPlan||[]).filter(c=>c.tipo===tipo);
    sel.innerHTML = '<option value="">Selecciona…</option>' + opts.map(o=>`<option value="${escHtml(o.nombre)}" ${o.nombre===nombre?'selected':''}>${escHtml(o.nombre)}</option>`).join('');
    sel.value = nombre;
    sel.dispatchEvent(new Event('change'));
  }
  document.getElementById(inputId).value = '';
  toast('Agregado');
}
function monSetField(id, field, value, syncCrono){
  const reg = monEnsureRegistro(id);
  if(['operarios','horas_extra','unid_planificadas','unid_producidas','unid_no_conformes','unid_reprocesadas',
      'mp_entrante','merma_proceso','peso_real','temperatura','tiempo_pcc','no_conformidades','producto_rechazado'].includes(field)){
    reg[field] = value===''? null : parseFloat(String(value).replace(',','.'));
  } else {
    reg[field] = value;
  }
  if(syncCrono){
    const cr = monGetCronograma(id);
    if(cr){
      const map = { unid_planificadas:'cantidad_programada', unid_producidas:'cantidad_real',
        unid_no_conformes:'unid_rechazadas_calidad', unid_reprocesadas:'unid_reprocesadas',
        merma_proceso:'merma_proceso', hora_inicio:null, hora_fin:null, operarios:null, horas_extra:null };
      const crField = map[field];
      if(crField !== undefined && crField !== null){
        cr[crField] = reg[field];
        sb.from('cronograma').update({ [crField]: reg[field] }).eq('id', id);
      }
    }
    // no_conformidades y unid_no_conformes viajan siempre sincronizados entre sí
    if(field==='unid_no_conformes') reg.no_conformidades = reg.unid_no_conformes;
    if(field==='no_conformidades') reg.unid_no_conformes = reg.no_conformidades;
  }
}
// Suma SOLO los ingredientes medidos en peso (kg/g), convertidos a la misma unidad,
// para comparar el consumo teórico (según fórmula) contra el real registrado.
function monCalcularRendimientoMP(id, reg){
  const cr = monGetCronograma(id);
  let teoricaKg = 0, realKg = 0, hayDatos = false;
  ((cr && cr.cronograma_ingredientes) || []).forEach(ci=>{
    const item = (cacheItems||[]).find(i=>i.codigo===ci.item_codigo);
    const info = item ? UNIT_GROUPS[item.medida] : null;
    if(!info || info.group !== 'peso') return; // se ignoran ingredientes en unidades, litros, etc.
    const teorico = pfCantidadTeorica(cr, ci.item_codigo);
    if(teorico!=null) teoricaKg += (teorico*info.factor)/1000;
    if(ci.cantidad_consumida!=null){ realKg += (Number(ci.cantidad_consumida)*info.factor)/1000; hayDatos = true; }
  });
  reg.mp_teorica_kg = hayDatos ? Math.round(teoricaKg*10000)/10000 : null;
  reg.mp_real_kg = hayDatos ? Math.round(realKg*10000)/10000 : null;
}
async function monVerificar(id){
  const reg = monEnsureRegistro(id);
  const cr = monGetCronograma(id);
  if(!cr){ toast('No se encontró la orden'); return; }
  monCalcularRendimientoMP(id, reg);
  const c = monCalc(reg);
  reg.unid_buen_estado = c.buenEstado;
  reg.locked = true;
  const payload = { ...reg };
  delete payload._isNew;
  delete payload.id; // deja que Supabase mantenga/asigne el id real
  const { error } = await sb.from('registro_produccion').upsert(payload, { onConflict:'cronograma_id' });
  if(error){ toast('Error al guardar: ' + error.message); return; }
  const { error: errK } = await kardexEscribirProduccion(cr);
  if(errK){ toast('Se guardó la verificación, pero hubo un error al escribir en Kardex: ' + errK.message); return; }
  const comprobanteRechazo = 'RECHAZO PRODUCCION N°' + (cr.orden_produccion||cr.id);
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobanteRechazo);
  const cantidadRechazo = Number(c.noConformesTotal||0);
  if(cantidadRechazo > 0 && reg.codigo_producto){
    const { error: errR } = await sb.from('kardex_movimientos').insert({
      item_codigo: reg.codigo_producto, fecha: reg.fecha || cr.fecha, lote: reg.lote || cr.lote || null,
      comprobante: comprobanteRechazo, entra: 0, sale: cantidadRechazo
    });
    if(errR){ toast('Verificado, pero no se pudo descontar el rechazo del Kardex: ' + errR.message); }
  }
  await sb.from('cronograma').update({ estado_verificacion:'aprobado' }).eq('id', id);
  await sb.from('registro_produccion').update({ estado_verificacion:'aprobado' }).eq('cronograma_id', id);
  cr.estado_verificacion = 'aprobado';
  cacheRegistroTodo = null; // invalidar caché de Indicadores
  MonState.selId = null;
  await Promise.all([monLoad(true), invLoad(true)]);
  toast('Verificado — se registró en Kardex');
  monRenderBody();
}
async function monVolverAVerificar(id){
  const reg = monEnsureRegistro(id);
  const cr = monGetCronograma(id);
  if(!cr) return;
  if(!confirm('¿Enviar esta orden de vuelta a Cronograma para corregirla? Se revertirá lo que se haya registrado en Kardex por esta orden.')) return;
  await kardexRevertirProduccion(cr);
  if(!reg._isNew){
    await sb.from('registro_produccion').update({ locked:false }).eq('cronograma_id', id);
  }
  reg.locked = false;
  await sb.from('cronograma').update({ finalizado:false, estado_verificacion:'revisar' }).eq('id', id);
  await sb.from('registro_produccion').update({ estado_verificacion:'revisar' }).eq('cronograma_id', id);
  cr.finalizado = false; cr.estado_verificacion = 'revisar';
  cacheRegistroTodo = null;
  MonState.selId = null;
  await Promise.all([monLoad(true), invLoad(true)]);
  toast('Enviado de vuelta a Cronograma — marcado como REVISAR');
  monRenderBody();
}
async function monGuardar(id){
  const reg = monEnsureRegistro(id);
  monCalcularRendimientoMP(id, reg);
  const c = monCalc(reg);
  reg.unid_buen_estado = c.buenEstado;
  const payload = { ...reg };
  delete payload._isNew;
  delete payload.id; // deja que Supabase mantenga/asigne el id real
  const { error } = await sb.from('registro_produccion').upsert(payload, { onConflict:'cronograma_id' });
  if(error){ toast('Error al guardar: ' + error.message); return; }
  await monLoad(true);
  toast('Verificación guardada');
  monRenderBody();
}
async function monToggleLocked(id){
  const reg = monEnsureRegistro(id);
  if(reg._isNew){ toast('Guarda la verificación primero'); return; }
  const nuevoValor = !reg.locked;
  if(nuevoValor && !confirm('¿Cerrar este registro? Dejará de aparecer como opción en Producción/Calidad Operativa. Podrás reabrirlo desde la pestaña Registros si necesitas corregirlo.')) return;
  const { error } = await sb.from('registro_produccion').update({ locked: nuevoValor }).eq('cronograma_id', id);
  if(error){ toast('Error: '+error.message); return; }
  reg.locked = nuevoValor;
  toast(nuevoValor ? 'Registro cerrado' : 'Registro reabierto');
  if(nuevoValor){ MonState.selId = null; }
  monRenderBody();
}

function mrFilteredRows(){
  let rows = (MonRegState.rows||[]).slice();
  const q = (MonRegState.q||'').trim().toUpperCase();
  if(q){
    rows = rows.filter(r=>
      (r.codigo_producto||'').toUpperCase().includes(q) ||
      (r.orden_produccion||'').toUpperCase().includes(q) ||
      (r.producto||'').toUpperCase().includes(q)
    );
  }
  return rows;
}
function renderMonRegistrosList(){
  const list = document.getElementById('mregList');
  const meta = document.getElementById('mregMeta');
  if(!list) return;
  const rows = mrFilteredRows();
  meta.textContent = rows.length + ' registro(s) encontrado(s)';
  if(!rows.length){ list.innerHTML = '<div class="empty-state">Sin resultados</div>'; return; }

    const cant = r.unid_producidas!=null ? r.unid_producidas : r.unid_planificadas;

      <button class="redit" title="Eliminar" onclick="monRegDeleteFromList('${r.id}')">✕</button>

async function monToggleCandado(id){
  const reg = (MonRegState.rows||[]).find(r=>r.id===id);
  if(!reg) return;
  if(reg.locked){
    // Abrir: vuelve a dejarlo disponible para editar en Producción Operativa (no toca Kardex todavía).
    if(!confirm('¿Abrir este registro para editarlo en Producción Operativa?')) return;
    const { error } = await sb.from('registro_produccion').update({ locked:false }).eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    reg.locked = false;
  }
  abrirMonRegistroDesdeCandado(id);
}
function abrirMonRegistroDesdeCandado(id){
  const reg = (MonRegState.rows||[]).find(r=>r.id===id);
  if(!reg || !reg.cronograma_id) return;
  MonState.tab = 'produccion';
  MonState.selId = reg.cronograma_id;
  setActiveTab('produccion');
  monRenderBody();
}
async function monRegDeleteFromList(id){
  const reg = (MonRegState.rows||[]).find(r=>r.id===id);
  if(!reg) return;
  if(!confirm('¿Eliminar este registro permanentemente? También se eliminará de Cronograma/Registros de Planificación y se revertirá su Kardex. Esta acción no se puede deshacer.')) return;
  const cr = reg.cronograma_id ? { id: reg.cronograma_id, orden_produccion: reg.orden_produccion } : null;
  if(cr) await kardexRevertirProduccion(cr);
  await sb.from('registro_produccion').delete().eq('id', id);
  if(reg.cronograma_id) await sb.from('cronograma').delete().eq('id', reg.cronograma_id); // arrastra en cascada ingredientes/personal/paradas
  cacheRegistroTodo = null;
  await Promise.all([monLoad(true), invLoad(true)]);
  toast('Registro eliminado de todas las páginas relacionadas');
  monRenderBody();
}

  if(!nombre){ toast('Escribe un valor'); return; }
  const { error } = await sb.from('catalogos').insert({ tipo, nombre });
  if(error){ toast('Error: '+error.message); return; }
  const { data } = await sb.from('catalogos').select('*').eq('activo', true);
  if(data) cacheCatalogosPlan = data;
  const sel = document.getElementById(selectId);
  if(sel){
    const opts = (cacheCatalogosPlan||[]).filter(c=>c.tipo===tipo);
    sel.innerHTML = '<option value="">Selecciona…</option>' + opts.map(o=>`<option value="${escHtml(o.nombre)}" ${o.nombre===nombre?'selected':''}>${escHtml(o.nombre)}</option>`).join('');
    sel.value = nombre;
    sel.dispatchEvent(new Event('change'));
  }
  document.getElementById(inputId).value = '';
  toast('Agregado');

async function monRegGuardar(){
  const reg = MonRegState.editing;
  if(!reg) return;
  const c = monCalc(reg);
  reg.unid_buen_estado = c.buenEstado;
  const payload = { ...reg };
  const id = payload.id;
  delete payload.id;
  const { error } = await sb.from('registro_produccion').update(payload).eq('id', id);
  if(error){ toast('Error al guardar: '+error.message); return; }
  toast('Cambios guardados');
  cacheRegistroTodo = null; // invalidar caché de Indicadores para que refleje la corrección
  await monRegReload();
  MonRegState.editing = (MonRegState.rows||[]).find(r=>r.id===id) || null;
  if(MonRegState.editing) renderMonRegistroEditor(); else monRegBack();
}
async function monRegToggleLocked(){
  const reg = MonRegState.editing;
  if(!reg) return;
  const nuevoValor = !reg.locked;
  if(nuevoValor && !confirm('¿Cerrar este registro?')) return;
  const { error } = await sb.from('registro_produccion').update({ locked: nuevoValor }).eq('id', reg.id);
  if(error){ toast('Error: '+error.message); return; }
  reg.locked = nuevoValor;
  if(cacheRegistro){
    const r = cacheRegistro.find(x=>x.cronograma_id===reg.cronograma_id);
    if(r) r.locked = nuevoValor;
  }
  cacheRegistroTodo = null; // invalidar caché de Indicadores: cambió qué registros están "cerrados"
  // Al cerrar, la cantidad rechazada/no conforme se descuenta del Kardex de ese lote
  // específico (el producto rechazado ya no está disponible como buen producto).
  // Al reabrir, se revierte ese movimiento para poder corregir sin duplicar.
  const comprobanteRechazo = 'RECHAZO PRODUCCION N°' + (reg.orden_produccion||reg.id);
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobanteRechazo);
  if(nuevoValor){
    const cantidadRechazo = Number(monCalc(reg).noConformesTotal||0);
    if(cantidadRechazo > 0 && reg.codigo_producto){
      const { error: errK } = await sb.from('kardex_movimientos').insert({
        item_codigo: reg.codigo_producto, fecha: reg.fecha || todayISO(), lote: reg.lote || null,
        comprobante: comprobanteRechazo, entra: 0, sale: cantidadRechazo
      });
      if(errK){ toast('Registro cerrado, pero no se pudo descontar del Kardex: ' + errK.message); }
      await invLoad(true);
    }
  } else {
    await invLoad(true);
  }
  toast(nuevoValor ? 'Registro cerrado' : 'Registro reabierto');
  renderMonRegistroEditor();
}
async function monRegDelete(){
  const reg = MonRegState.editing;
  if(!reg) return;
  if(!confirm('¿Eliminar este registro permanentemente? Esta acción no se puede deshacer.')) return;
  const { error } = await sb.from('registro_produccion').delete().eq('id', reg.id);
  if(error){ toast('Error: '+error.message); return; }
  await sb.from('kardex_movimientos').delete().eq('comprobante', 'RECHAZO PRODUCCION N°' + (reg.orden_produccion||reg.id));
  await invLoad(true);
  toast('Registro eliminado');
  cacheRegistroTodo = null;
  MonRegState.editing = null;
  await monRegReload();
  monRenderBody();
}

function exportarExcelRegistroRows(rows, sufijo){
  const HEADERS = [
    ['DATOS GENERALES',7],['PERSONAL Y HORAS',7],['PRODUCCIÓN',8],['PARADAS',4],
    ['MATERIA PRIMA Y MERMAS',5],['PESO Y OEE',2],['TRAZABILIDAD',3]
  ];
  const FIELDS = [
    'Fecha','Área / Proceso','Código de Producto','Producto','Presentación / Formato','Lote de Producción','N° Orden de Producción',
    'N° Operarios Asignados','Hora Inicio','Hora Fin','Horas Trabajadas en el Bloque (h)','Horas Extra Adicionales (h)','Horas Totales Trabajadas (h)','Horas-Hombre Totales (H-H)',
    'Unidades Planificadas','Unidades Producidas (Total)','Unidades en Buen Estado (Conformes)','Unidades No Conformes / Rechazadas','Unidades Reprocesadas','% Cumplimiento de Plan','% Producto Conforme','Productividad (Unid / H-H)',
    'N° de Paradas','Tiempo Total de Paradas (min)','Motivo(s) de Parada','% Disponibilidad (Tiempo)',
    'Materia Prima Entrante (kg)','Merma de Proceso (kg)','% Merma','Motivo Principal de Merma','Rendimiento de Materia Prima (kg prod. / kg MP)',
    'Peso de Presentación Unidad (g)','OEE Estimado (%)',
    'Responsable de la Producción','Responsable de la Verificación','Observaciones'
  ];
  const groupRow = [];
  HEADERS.forEach(([name,span])=>{ groupRow.push(name); for(let i=1;i<span;i++) groupRow.push(''); });
  const aoa = [groupRow, FIELDS];
  // Si no se ingresó nada, estos campos deben quedar en su valor por defecto (0,
  // o "Sin Paradas"), no en blanco — por eso no se usa "||''" con estos, ya que
  // eso convierte un 0 legítimo en blanco.
  const v0 = x => (x!=null ? x : 0);
  (rows||[]).forEach(r=>{
    const c = monCalc(r);
    const obs = r.observaciones_mp || '';
    const pct = x => x!=null ? Number((x*100).toFixed(2)) : ''; // decimal → porcentaje (×100)
    aoa.push([
      r.fecha, r.area, r.codigo_producto, r.producto, r.presentacion, r.lote, r.orden_produccion,
      r.operarios||'', r.hora_inicio||'', r.hora_fin||'', c.horasBloque!=null?Number(c.horasBloque.toFixed(2)):'',
      r.horas_extra||0, c.horasTotales!=null?Number(c.horasTotales.toFixed(2)):'', c.hhTotales!=null?Number(c.hhTotales.toFixed(2)):'',
      r.unid_planificadas||'', r.unid_producidas||'', c.buenEstado!=null?c.buenEstado:'', v0(r.unid_no_conformes), v0(r.unid_reprocesadas),
      pct(c.pctCumplPlan), pct(c.pctConforme), c.productividad!=null?Number(c.productividad.toFixed(2)):'',
      v0(r.num_paradas), v0(r.tiempo_paradas), (r.motivo_parada && r.motivo_parada.trim()) ? r.motivo_parada : 'Sin Paradas', pct(c.pctDisponibilidad),
      r.mp_entrante||'', v0(r.merma_proceso), pct(c.pctMerma), r.motivo_merma, c.rendimientoMP!=null?Number(c.rendimientoMP.toFixed(3)):'',
      r.peso_teorico||'', pct(c.oee),
      r.responsable_mp||'', r.responsable_verificacion||'', obs
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = [];
  let col=0;
  HEADERS.forEach(([name,span])=>{ if(span>1) ws['!merges'].push({s:{r:0,c:col},e:{r:0,c:col+span-1}}); col+=span; });
  ws['!cols'] = FIELDS.map(()=>({wch:20}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registro_Produccion');
  XLSX.writeFile(wb, 'Registro_Produccion_PROPIZZEC_' + (sufijo?sufijo+'_':'') + todayISO() + '.xlsx');
  toast('Excel exportado');
}

  document.getElementById('ipProducto').addEventListener('input', e=>{ IndProdState.producto=e.target.value; indProdRender(); });
  document.getElementById('ipArea').addEventListener('input', e=>{ IndProdState.area=e.target.value; indProdRender(); });
  await loadIndicadoresRows(false);
  indProdRender();
}
function indProdFiltered(){
  let rows = (cacheRegistroTodo||[]).slice();
  if(IndProdState.desde) rows = rows.filter(r=>r.fecha >= IndProdState.desde);
  if(IndProdState.hasta) rows = rows.filter(r=>r.fecha <= IndProdState.hasta);
  const q = (IndProdState.producto||'').trim().toUpperCase();
  if(q) rows = rows.filter(r=>(r.codigo_producto||'').toUpperCase().includes(q) || (r.producto||'').toUpperCase().includes(q));
  const a = (IndProdState.area||'').trim().toUpperCase();
  if(a) rows = rows.filter(r=>(r.area||'').toUpperCase().includes(a));
  return rows;
}
function indProdRender(){
  const wrap = document.getElementById('ipBody');
  if(!wrap) return;
  const rows = indProdFiltered();
  if(!rows.length){ wrap.innerHTML = '<div class="empty-state">Sin registros cerrados en este rango. Cierra un registro en Monitoreo → Registros para verlo aquí.</div>'; return; }
  const calcs = rows.map(r=>({ r, c: monCalc(r) }));
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const oees = calcs.map(x=>x.c.oee).filter(v=>v!=null);
  const cumplPlan = calcs.map(x=>x.c.pctCumplPlan).filter(v=>v!=null);
  const conforme = calcs.map(x=>x.c.pctConforme).filter(v=>v!=null);
  const disponib = calcs.map(x=>x.c.pctDisponibilidad).filter(v=>v!=null);
  const merma = calcs.map(x=>x.c.pctMerma).filter(v=>v!=null);
  const rendMP = calcs.map(x=>x.c.rendimientoMP).filter(v=>v!=null);
  const prod = calcs.map(x=>x.c.productividad).filter(v=>v!=null);

  const porDia = {};
  calcs.forEach(({r,c})=>{
    if(c.oee==null) return;
    if(!porDia[r.fecha]) porDia[r.fecha] = [];
    porDia[r.fecha].push(c.oee);
  });
  const dias = Object.keys(porDia).sort();
  const oeePorDia = dias.map(d=>({ fecha:d, oee: avg(porDia[d]) }));
  const maxOeeDia = Math.max(0.01, ...oeePorDia.map(x=>x.oee));

  const porProducto = {};
  calcs.forEach(({r,c})=>{
    const key = r.codigo_producto || '—';
    if(!porProducto[key]) porProducto[key] = { nombre:r.producto, cumpl:[], conf:[], oee:[] };
    if(c.pctCumplPlan!=null) porProducto[key].cumpl.push(c.pctCumplPlan);
    if(c.pctConforme!=null) porProducto[key].conf.push(c.pctConforme);
    if(c.oee!=null) porProducto[key].oee.push(c.oee);
  });
  const productosArr = Object.keys(porProducto).map(k=>{
    const p = porProducto[k];
    return { codigo:k, nombre:p.nombre, cumpl: avg(p.cumpl), conf: avg(p.conf), oee: avg(p.oee) };
  }).sort((a,b)=>(b.oee||0)-(a.oee||0));

  const motivoMinSimple = {};
  calcs.forEach(({r})=>{
    const motivos = (r.motivo_parada||'').split(';').map(s=>s.trim()).filter(Boolean);
    const principal = motivos[0] || 'Sin especificar';
    motivoMinSimple[principal] = (motivoMinSimple[principal]||0) + Number(r.tiempo_paradas||0);
  });
  const paradasArr = Object.keys(motivoMinSimple).map(k=>({motivo:k, minutos:motivoMinSimple[k]})).filter(p=>p.minutos>0).sort((a,b)=>b.minutos-a.minutos);
  const maxParadaMin = Math.max(1, ...paradasArr.map(p=>p.minutos));

  const motivoMermaKg = {};
  calcs.forEach(({r})=>{
    const m = r.motivo_merma || 'Sin especificar';
    motivoMermaKg[m] = (motivoMermaKg[m]||0) + Number(r.merma_proceso||0);
  });
  const mermaArr = Object.keys(motivoMermaKg).map(k=>({motivo:k, kg:motivoMermaKg[k]})).filter(m=>m.kg>0).sort((a,b)=>b.kg-a.kg);
  const maxMermaKg = Math.max(1, ...mermaArr.map(m=>m.kg));

  const fmtPct = v => v!=null ? (v*100).toFixed(0)+'%' : '—';

  wrap.innerHTML = `
    <div class="sub" style="margin-bottom:10px;">${rows.length} registro(s) cerrado(s) en este rango</div>
    <div class="parada-count" style="flex-wrap:wrap;">
      <div class="pc"><div class="n">${fmtPct(avg(oees))}</div><div class="l">OEE promedio</div></div>
      <div class="pc"><div class="n">${fmtPct(avg(cumplPlan))}</div><div class="l">Cumplimiento de plan</div></div>
      <div class="pc"><div class="n">${fmtPct(avg(conforme))}</div><div class="l">% Conforme</div></div>
      <div class="pc"><div class="n">${fmtPct(avg(disponib))}</div><div class="l">Disponibilidad</div></div>
      <div class="pc"><div class="n">${fmtPct(avg(merma))}</div><div class="l">% Merma</div></div>
      <div class="pc"><div class="n">${avg(rendMP)!=null?avg(rendMP).toFixed(2):'—'}</div><div class="l">Rendimiento MP (kg/kg)</div></div>
      <div class="pc"><div class="n">${avg(prod)!=null?fmtNum(avg(prod)):'—'}</div><div class="l">Productividad (u/HH)</div></div>
    </div>

    <div class="section-title">Tendencia de OEE por día</div>
    ${oeePorDia.length ? oeePorDia.map(d=>`
      <div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${ddMMyy(d.fecha)}</span><span>${fmtPct(d.oee)}</span></div>
        <div style="background:var(--line);border-radius:6px;height:9px;overflow:hidden;"><div style="width:${(d.oee/maxOeeDia)*100}%;height:100%;background:var(--datos);"></div></div>
      </div>
    `).join('') : '<div class="empty-state">Sin datos suficientes</div>'}

    <div class="section-title">OEE por producto</div>
    ${productosArr.length ? productosArr.map(p=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span><b>${escHtml(p.codigo)}</b> ${escHtml(p.nombre||'')}</span>
          <span>OEE ${fmtPct(p.oee)} · Plan ${fmtPct(p.cumpl)} · Conforme ${fmtPct(p.conf)}</span>
        </div>
        <div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;">
          <div style="width:${Math.min(100,(p.oee||0)*100)}%;height:100%;background:var(--produccion);"></div>
        </div>
      </div>
    `).join('') : ''}

    <div class="section-title">Principales causas de paradas (minutos)</div>
    ${paradasArr.length ? paradasArr.map(p=>`
      <div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>${escHtml(p.motivo)}</span><span>${fmtNum(p.minutos)} min</span></div>
        <div style="background:var(--line);border-radius:6px;height:9px;overflow:hidden;"><div style="width:${(p.minutos/maxParadaMin)*100}%;height:100%;background:var(--paradas);"></div></div>
      </div>
    `).join('') : '<div class="empty-state">Sin paradas registradas</div>'}

    <div class="section-title">Principales causas de merma (kg)</div>
    ${mermaArr.length ? mermaArr.map(m=>`
      <div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>${escHtml(m.motivo)}</span><span>${fmtNum(m.kg)} kg</span></div>
        <div style="background:var(--line);border-radius:6px;height:9px;overflow:hidden;"><div style="width:${(m.kg/maxMermaKg)*100}%;height:100%;background:var(--materia);"></div></div>
      </div>
    `).join('') : '<div class="empty-state">Sin mermas registradas</div>'}

    <div class="modal-actions" style="margin-top:10px;">
      <button class="btn ghost" style="width:100%;" onclick="indProdExportExcel()">⬇ Exportar Excel de este análisis</button>
    </div>
  `;
}

  exportarExcelRegistroRows(indProdFiltered(), 'kpi');
}

async function indSelReload(){

function indSelFlatten(){

    (row.items||[]).forEach(it=>{

    });

}
function indSelRenderBody(){

  const selladoRows = rows.filter(r=>r.unidades_hora!=null);
  const totalMin = rows.reduce((s,r)=>s+Number(r.minutos_realizado||0),0);
  const avgPct = selladoRows.length ? selladoRows.reduce((s,r)=>s+Number(r.pct_cumplimiento||0),0)/selladoRows.length : null;

  const porProducto = {};
  selladoRows.forEach(r=>{
    const key = r.item_codigo || '—';
    if(!porProducto[key]) porProducto[key] = { nombre:r.item_nombre, uh:[], meta:r.meta_selladora, pct:[] };

    const avgPctP = p.pct.reduce((a,b)=>a+b,0)/p.pct.length;
    return { codigo:k, nombre:p.nombre, avgUh, meta:p.meta, avgPct: avgPctP };

  const maxPct = Math.max(1, ...productosArr.map(p=>p.avgPct));

  const porActividad = {};

  });
  const actividadArr = Object.keys(porActividad).map(k=>{

  const maxMin = Math.max(1, ...actividadArr.map(a=>a.minutos));

  const porDia = {};

  });
  const dias = Object.keys(porDia).sort();
  const pctPorDia = dias.map(d=>({ fecha:d, pct: porDia[d].reduce((a,b)=>a+b,0)/porDia[d].length }));
  const maxPctDia = Math.max(0.01, ...pctPorDia.map(x=>x.pct));

  wrap.innerHTML = `
    <div class="parada-count" style="margin-bottom:14px;">
      <div class="pc"><div class="n">${rows.length}</div><div class="l">Ítem(s) registrados</div></div>
      <div class="pc"><div class="n">${fmtNum(totalMin)}</div><div class="l">Min. totales</div></div>
      <div class="pc"><div class="n">${avgPct!=null?(avgPct*100).toFixed(0)+'%':'—'}</div><div class="l">% Cumplimiento prom.</div></div>
    </div>

    <div class="section-title">Tendencia de % cumplimiento por día (sellado)</div>
    ${pctPorDia.length ? pctPorDia.map(d=>`
      <div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span>${ddMMyy(d.fecha)}</span><span>${(d.pct*100).toFixed(0)}%</span></div>
        <div style="background:var(--line);border-radius:6px;height:9px;overflow:hidden;"><div style="width:${(d.pct/maxPctDia)*100}%;height:100%;background:var(--datos);"></div></div>
      </div>
    `).join('') : '<div class="empty-state">Sin datos suficientes</div>'}

    <div class="section-title">% Cumplimiento promedio por producto (sellado)</div>
    ${productosArr.length ? productosArr.map(p=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span><b>${escHtml(p.codigo)}</b> ${escHtml(p.nombre||'')}</span>
          <span>${(p.avgPct*100).toFixed(0)}% · U/H ${fmtNum(p.avgUh)} / meta ${fmtNum(p.meta||0)}</span>
        </div>
        <div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;">
          <div style="width:${Math.min(100,(p.avgPct/maxPct)*100)}%;height:100%;background:var(--materia);"></div>
        </div>
      </div>
    `).join('') : '<div class="empty-state">Sin datos de sellado en este rango</div>'}

    <div class="section-title">Minutos totales por actividad</div>
    ${actividadArr.map(a=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span>${escHtml(a.label)}</span><span>${fmtNum(a.minutos)} min</span>
        </div>
        <div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;">
          <div style="width:${(a.minutos/maxMin)*100}%;height:100%;background:var(--paradas);"></div>
        </div>
      </div>
    `).join('')}
  `;
}

  if(m) m.meta_uh = v;
  toast('Meta actualizada');
}
async function cfgRemoveMetaSellado(codigo){
  if(!confirm('¿Eliminar la meta de este producto?')) return;

  if(error){ toast('Error: '+error.message); return; }
  cacheMetasSellado = (cacheMetasSellado||[]).filter(m=>m.item_codigo!==codigo);

}
function cfgLegendaSiNoNA(){

}
function cfgSimpleCard(title, tipo, colorVar){

      ${items.length ? items.map(it=>`

          <span>${escHtml(it.nombre)}</span>

function cfgTwoFieldCard(opts){

function cfgUsuariosCard(){
  const rows = cacheUsuariosArea || [];
  return `<div class="card" style="--accent:var(--datos)">
    <h2>Usuarios por área</h2>
    <div class="sub">Las áreas ya están definidas desde el inicio; aquí solo se corrige la clave de acceso de cada una, se activa/desactiva, o se elimina.</div>
    <div class="catalog-mini">
      ${rows.length ? rows.map(u=>`
        <div class="cfg-row" style="display:flex;align-items:center;gap:8px;">
          <span style="flex:1;"><b>${escHtml(u.area)}</b> ${u.activo?'':'<span class="sub">(inactivo)</span>'}</span>
          <input type="text" value="${escHtml(u.clave)}" style="width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;" onchange="cfgSetClaveUsuario('${u.id}', this.value)">
          <button onclick="cfgToggleUsuario('${u.id}', ${!u.activo})">${u.activo?'Desactivar':'Activar'}</button>
          <button onclick="cfgEliminarUsuarioArea('${u.id}','${escHtml(u.area)}')" style="color:var(--danger);">Eliminar</button>
        </div>`).join('') : '<div class="empty-state">Sin usuarios</div>'}
    </div>
    <div class="msub" style="margin-top:14px;">¿Falta una área nueva? Agrégala aquí — aparecerá de inmediato como ícono en la pantalla de inicio de sesión.</div>
    <div class="field-row" style="margin-top:6px;">
      <input type="text" id="cfgUsrArea" placeholder="Área nueva (ej: EMPAQUE)" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;">
      <input type="text" id="cfgUsrClave" placeholder="Clave" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;">
      <button class="btn" onclick="cfgAddUsuario()">+ Añadir</button>
    </div>
  </div>`;
}
async function cfgAddUsuario(){
  const area = document.getElementById('cfgUsrArea').value.trim().toUpperCase();
  const clave = document.getElementById('cfgUsrClave').value.trim();
  if(!area || !clave){ toast('Escribe el área y la clave'); return; }
  const { error } = await sb.from('usuarios_area').insert({ area, clave });
  if(error){ toast('Error: '+error.message); return; }
  const { data } = await sb.from('usuarios_area').select('*').order('area');
  cacheUsuariosArea = data || [];
  usuariosAreaCache = data || []; // mismo dato que usa la pantalla de inicio de sesión
  cfgRenderBody();
  toast('Usuario agregado — ya aparece en la pantalla de inicio de sesión');
}
async function cfgSetClaveUsuario(id, clave){
  clave = clave.trim();
  if(!clave){ toast('La clave no puede quedar vacía'); cfgRenderBody(); return; }
  const { error } = await sb.from('usuarios_area').update({ clave }).eq('id', id);
  if(error){ toast('Error: '+error.message); cfgRenderBody(); return; }
  const u = (cacheUsuariosArea||[]).find(x=>x.id===id);
  if(u) u.clave = clave;
  const u2 = (usuariosAreaCache||[]).find(x=>x.id===id);
  if(u2) u2.clave = clave;
  toast('Clave actualizada');
}
async function cfgToggleUsuario(id, nuevoValor){
  const { error } = await sb.from('usuarios_area').update({ activo: nuevoValor }).eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  const { data } = await sb.from('usuarios_area').select('*').order('area');
  cacheUsuariosArea = data || [];
  usuariosAreaCache = data || [];
  cfgRenderBody();
}
async function cfgEliminarUsuarioArea(id, area){
  if(!confirm('¿Eliminar el área "' + area + '"? Desaparecerá de la pantalla de inicio de sesión.')) return;
  const { error } = await sb.from('usuarios_area').delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  cacheUsuariosArea = (cacheUsuariosArea||[]).filter(u=>u.id!==id);
  usuariosAreaCache = (usuariosAreaCache||[]).filter(u=>u.id!==id);
  cfgRenderBody();
  toast('Área eliminada');
}
function cfgHorariosCard(){
  const areas = ['MASA','ACONDICIONAMIENTO 1','ACONDICIONAMIENTO 2','ACONDICIONAMIENTO 3','SELLADO','BODEGA'];
  return `<div class="card" style="--accent:var(--datos)">

    <div class="sub">Hora de inicio sugerida por área al verificar producción en Monitoreo.</div>
    ${areas.map(a=>{
      const h = (cacheConfigHorarios||[]).find(c=>c.area===a);
      return `<div class="field-row" style="align-items:center;">
        <div style="flex:1;font-size:13px;font-weight:600;">${escHtml(a)}</div>
        <div class="field" style="max-width:120px;margin-bottom:0;">
          <input type="time" value="${h?h.hora_inicio_defecto:''}" onchange="cfgSetHorario('${a}',this.value)">
        </div>
      </div>`;
    }).join('')}

}
function cfgTiposMedidasCard(){

    <h2>Tipos de ítem y medidas</h2>

async function cfgRenderBody(){
  await invLoad(false);
  const app = document.getElementById('app');
  const permiso = permisoActual();
  const esAdmin = !permiso; // PRODUCCION / CALIDAD: ven todo, sin restricción
  const puede = (mod) => esAdmin || permiso.modulos.includes(mod);
  let html = '';
  if(puede('bodega') || puede('despacho')){
    html += `
    <div class="card" style="--accent:var(--muted)">
      <h2>Leyenda de checklists (SI / NO / N/A)</h2>
      <div class="sub">Usada en Bodega (parámetros de calidad del transporte) y Despacho (liberación del producto, generalidades del vehículo, controles).</div>
      <div class="reg-row"><div class="rmain"><span class="big">SI</span></div><div class="rval"><span class="sub">Cumple</span></div></div>
      <div class="reg-row"><div class="rmain"><span class="big">NO</span></div><div class="rval"><span class="sub">No cumple</span></div></div>
      <div class="reg-row"><div class="rmain"><span class="big">N/A</span></div><div class="rval"><span class="sub">No aplica</span></div></div>
    </div>`;
  }
  html += cfgTiposMedidasCard(); // Inventario: siempre visible, todas las áreas lo tienen
  if(puede('sellado')) html += cfgMetasSelladoCard();
  if(puede('planificacion')){
    html += cfgPersonalCard();
    html += cfgSimpleCard('Motivos de Parada','motivo_parada','--paradas');
    html += cfgSimpleCard('Motivos de Merma','motivo_merma','--materia');
    html += cfgSimpleCard('Responsables — Producción / Materia Prima','responsable_mp','--produccion');
  }
  if(esAdmin){
    html += cfgSimpleCard('Responsables — Calidad / PCC / OEE','responsable_calidad','--calidad');
    html += cfgSimpleCard('Responsables — Verificación (Monitoreo)','responsable_verificacion','--datos');
  }
  if(puede('despacho')) html += cfgSimpleCard('Responsables — Despacho','responsable_despacho','--paradas');
  if(puede('bodega')){
    html += cfgTwoFieldCard({title:'Proveedores (Bodega)', colorVar:'--traza', table:'bodega_proveedores', rows:cacheBodProveedores||[], campo1:{key:'nombre',label:'Nombre',placeholder:'Nombre del proveedor'}, campo2:{key:'ruc',label:'RUC',placeholder:'RUC / Razón social'}});
  }
  if(puede('bodega') || puede('despacho')){
    html += cfgTwoFieldCard({title:'Conductores (Bodega/Despacho)', colorVar:'--traza', table:'bodega_conductores', rows:cacheBodConductores||[], campo1:{key:'nombre',label:'Nombre',placeholder:'Nombre del conductor'}, campo2:{key:'cedula',label:'Cédula',placeholder:'Cédula'}});
    html += cfgSimpleCard('Placas de transporte','placa_transporte','--traza');
  }
  if(puede('despacho')){
    html += cfgTwoFieldCard({title:'Destinos y clientes (Despacho)', colorVar:'--paradas', table:'despacho_destinos', rows:cacheDespDestinos||[], campo1:{key:'direccion',label:'Destino',placeholder:'Dirección de destino'}, campo2:{key:'cliente',label:'Cliente',placeholder:'Cliente asociado'}});
  }
  if(esAdmin){
    html += cfgHorariosCard();
    html += cfgUsuariosCard();
  }
  app.innerHTML = html;
}
async function cfgAddCatalogo(tipo){
  const input = document.getElementById('cfg_new_'+tipo);
  const nombre = input.value.trim();
  if(!nombre){ toast('Escribe un valor'); return; }
  const { error } = await sb.from('catalogos').insert({ tipo, nombre });
  if(error){ toast('Error: '+error.message); return; }
  await monLoad(true);
  cfgRenderBody();
  toast('Agregado');
}
async function cfgRemoveCatalogo(id){
  if(!confirm('¿Eliminar este valor del catálogo?')) return;
  const { error } = await sb.from('catalogos').delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  await monLoad(true);
  cfgRenderBody();
}
async function cfgAddTwoField(table, key1, key2){
  const v1 = document.getElementById('cfg2_'+table+'_c1').value.trim();
  const v2 = document.getElementById('cfg2_'+table+'_c2').value.trim();
  if(!v1){ toast('Escribe el ' + key1); return; }
  const payload = {}; payload[key1] = v1; if(v2) payload[key2] = v2;
  const { error } = await sb.from(table).insert(payload);
  if(error){ toast('Error: '+error.message); return; }
  await bodLoad(true);
  await despLoad(true);
  cfgRenderBody();
  toast('Agregado');
}
async function cfgRemoveTwoField(table, id){
  if(!confirm('¿Eliminar este registro?')) return;
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  await bodLoad(true);
  await despLoad(true);
  cfgRenderBody();
}
async function cfgSetHorario(area, value){
  if(!value) return;
  const { error } = await sb.from('config_horarios').upsert({ area, hora_inicio_defecto: value }, { onConflict:'area' });
  if(error){ toast('Error: '+error.message); return; }
  await monLoad(true);
  toast('Horario actualizado');
}

// Identificación de material de empaque por NOMBRE EXACTO del ítem (sin
// columna aparte en la tabla items) — listas indicadas directamente.
function normalizaNombre(s){
  return (s||'').trim().toUpperCase().replace(/\s+/g,' '); // colapsa espacios dobles o raros para que coincida aunque haya diferencias de formato
}
function nombreEnLista(item, lista){
  if(!item) return false;
  const n = normalizaNombre(item.nombre);
  return lista.includes(n);
}

async function selLoad(force){
  if(!sb) return;
  const tasks = [];
  if(force || !cacheItems) tasks.push(invLoad(true));
  if(force || !cacheCatalogosSellado) tasks.push(sb.from('catalogos').select('*').eq('tipo','responsable_sellado').eq('activo',true).then(r=>cacheCatalogosSellado=r.data||[]));
  if(force || !cacheMetasSellado) tasks.push(sb.from('metas_sellado').select('*').then(r=>cacheMetasSellado=r.data||[]));
  tasks.push(sb.from('catalogos').select('id,nombre').eq('tipo','sellado_tipo_parada').eq('activo',true).order('nombre').then(r=>{
    SEL_TIPOS_PARADA = r.data||[];
  }));
  tasks.push(sb.from('sellado_config_actividades').select('*').eq('activo',true).order('orden').then(r=>{
    cacheSelladoConfigAct = r.data||[];
    SELLADO_ACTIVIDADES = cacheSelladoConfigAct.map(selMapActividadRow);
  }));
  tasks.push(sb.from('sellado_registros').select('*').eq('fecha', SelladoState.fecha).then(r=>{
    const rows = r.data||[];
    SelladoState.sesiones = {};
    rows.forEach(row=>{ SelladoState.sesiones[row.tipo_actividad] = row; });
    if(force || SelladoState.abiertas==null){
      SelladoState.abiertas = rows.filter(x=>x.estado==='abierto').map(x=>x.tipo_actividad);
    } else {
      SelladoState.abiertas = SelladoState.abiertas.filter(t=>SelladoState.sesiones[t] && SelladoState.sesiones[t].estado==='abierto');
    }
    if(!SelladoState.activa && SelladoState.abiertas.length) SelladoState.activa = SelladoState.abiertas[0];
    if(SelladoState.activa && !SelladoState.abiertas.includes(SelladoState.activa)) SelladoState.activa = SelladoState.abiertas[0] || null;
  }));
  tasks.push(selCargarPendientesSellado());
  await Promise.all(tasks);
}
// Productos terminados ya aprobados en Monitoreo, con la cantidad que aún falta
// sellar (producido menos lo ya sellado hasta ahora, para ese mismo lote).
let cacheSelladoPendientes = [];
async function selCargarPendientesSellado(){
  // Ahora se toma directo de Cronograma (en cuanto se agrega la orden), sin
  // esperar a que esté producida ni aprobada en Monitoreo — usa la cantidad
  // real si ya se produjo, y si no, la cantidad programada como referencia.
  const { data: ordenes } = await sb.from('cronograma')
    .select('item_codigo, lote, cantidad_real, cantidad_programada, fecha')
    .order('fecha', {ascending:false})
    .limit(500);
  if(!ordenes || !ordenes.length){ cacheSelladoPendientes = []; return; }
  const { data: sellados } = await sb.from('sellado_registros').select('items').limit(3000);
  const selladoPorClave = {};
  (sellados||[]).forEach(row=>{
    (row.items||[]).forEach(it=>{
      if(it.es_parada || !it.item_codigo || it.item_codigo==='N/A' || !it.cantidad) return;
      const clave = it.item_codigo+'|'+(it.lote||'');
      selladoPorClave[clave] = (selladoPorClave[clave]||0) + Number(it.cantidad||0);
    });
  });
  const porClave = {};
  ordenes.forEach(p=>{
    const cantidadReal = p.cantidad_real!=null ? Number(p.cantidad_real) : (p.cantidad_programada!=null ? Number(p.cantidad_programada) : 0);
    if(cantidadReal<=0) return;
    const clave = p.item_codigo+'|'+(p.lote||'');
    if(!porClave[clave]) porClave[clave] = { item_codigo:p.item_codigo, lote:p.lote, producido:0 };
    porClave[clave].producido += cantidadReal;
  });
  const pendientes = [];
  Object.values(porClave).forEach(p=>{
    const yaSellado = selladoPorClave[p.item_codigo+'|'+(p.lote||'')] || 0;
    const pendiente = Math.round((p.producido - yaSellado)*10000)/10000;
    if(pendiente > 0.001){
      const item = (cacheItems||[]).find(i=>i.codigo===p.item_codigo);
      pendientes.push({ item_codigo:p.item_codigo, item_nombre: item?item.nombre:p.item_codigo, lote:p.lote, pendiente, producido:p.producido, medida: item?item.medida:'' });
    }
  });
  cacheSelladoPendientes = pendientes;
}

async function nextSelladoCode(prefijo){
  let maxN = 0;
  try{
    const { data, error } = await sb.from('sellado_registros').select('codigo_actividad').ilike('codigo_actividad', prefijo+'%').order('codigo_actividad',{ascending:false}).limit(1);
    if(!error && data && data.length){
      const m = new RegExp('^'+prefijo+'(\\d+)$').exec(data[0].codigo_actividad||'');
      if(m) maxN = parseInt(m[1],10);
    }
  }catch(e){ console.error('No se pudo consultar la secuencia de sellado', e); }
  return prefijo + String(maxN+1).padStart(5,'0');
}

function selRegistrarParadasCerradas(tipo, it){

      item_codigo: 'N/A', item_nombre: 'N/A', es_parada:true, actividad_parada: p.motivo,
      lote:'N/A', n_personas:it.n_personas||2, n_selladoras:'N/A',
      estado_timer:'detenido', hora_inicio: p.inicio, hora_fin: p.fin, pausas:[],

    if(!pendientes.length){ results.innerHTML = '<div class="sr-empty">Sin productos pendientes por sellar. Verifica que la producción esté aprobada en Monitoreo.</div>'; return; }

async function selAddItem(tipo, esLimpieza, item, extra){
  const row = SelladoState.sesiones[tipo];
  if(!row) return;
  const meta = SELLADO_ACTIVIDADES.find(a=>a.key===tipo);
  const codigoItem = esLimpieza ? 'N/A' : item.codigo;
  const previos = (row.items||[]).filter(it=>it.item_codigo===codigoItem);
  const ultimoResp = previos.length ? previos[previos.length-1].responsable : '';
  const metaGuardada = (!esLimpieza && meta.esSellado) ? ((cacheMetasSellado||[]).find(m=>m.item_codigo===codigoItem)||{}).meta_uh || 0 : null;
  const ahoraIso = new Date().toISOString();
  const nuevo = {
    id: 'it_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    item_codigo: codigoItem,
    item_nombre: esLimpieza ? 'N/A' : item.nombre,
    lote: esLimpieza ? 'N/A' : ((extra && extra.lote) ? extra.lote : ddMMyy(todayISO())),
    pendiente_al_iniciar: (extra && extra.pendienteAlIniciar!=null) ? extra.pendienteAlIniciar : null,
    n_personas: 2,
    n_selladoras: meta.esSellado ? '1' : 'N/A',
    estado_timer: 'corriendo',
    hora_inicio: ahoraIso, hora_fin: null, pausas: [],
    minutos_realizado: null,
    cantidad: null,
    unidades_hora: null,
    meta_selladora: metaGuardada,
    pct_cumplimiento: null,
    clasificacion_kpi: null,
    observaciones: '',
    responsable: ultimoResp || ''
  };
  const items = (row.items||[]).concat([nuevo]);
  const { error } = await sb.from('sellado_registros').update({ items, updated_at: new Date().toISOString() }).eq('id', row.id);
  if(error){ toast('Error: '+error.message); return; }
  row.items = items;
  selRenderItemList(tipo);
  selManageLiveTimers();
  toast(esLimpieza ? 'Actividad iniciada' : 'Iniciado: ' + item.nombre);
}
function selFindItem(tipo, itemId){
  const row = SelladoState.sesiones[tipo];
  return row ? (row.items||[]).find(i=>i.id===itemId) : null;

async function selPersistItems(tipo){

async function selReetRegistrar(tipo){
  const row = SelladoState.sesiones[tipo];
  if(!row) return;
  const motivoExtra = (document.getElementById('reetMotivo').value||'').trim();
  const subtipo = ReetState.subtipo;
  let resumen = '';
  let comprobantes = [];
  if(subtipo === 'REETIQUETADO'){
    const o = ReetState.origen;
    if(!o || !o.codigo || !o.lote){ toast('Selecciona el producto y el lote actual'); return; }
    const cantOrigenEl = document.getElementById('reet_origen_cantidad');
    const cantOrigen = parseFloat((cantOrigenEl.value||'0').replace(',','.'));
    if(!cantOrigen || cantOrigen<=0){ toast('Ingresa la cantidad a transformar'); return; }
    let destinoLote = ReetState.loteDestino;
    let fechaElab = null, fechaCad = null;
    if(ReetState.loteDestinoNuevo){
      destinoLote = (document.getElementById('reet_destino_nuevolote').value||'').trim();
      if(!destinoLote){ toast('Escribe el nuevo lote de destino'); return; }
      fechaElab = document.getElementById('reet_destino_fechaelab').value || null;
      fechaCad = document.getElementById('reet_destino_fechacad').value || null;
    }
    if(!destinoLote){ toast('Selecciona o crea el lote de destino'); return; }
    if(destinoLote === o.lote){ toast('El lote destino debe ser distinto al lote actual'); return; }
    // El destino es el MISMO producto (solo cambia de lote), y recibe exactamente
    // la misma cantidad que se transformó en el origen.
    const cantDestino = cantOrigen;

    const nOrigen = await nextAjusteNumero(o.codigo);
    const comprobanteOrigen = 'Ajuste N° ' + nOrigen + ': Reetiquetado' + (motivoExtra?(' - '+motivoExtra):'');
    const { error: e1 } = await sb.from('kardex_movimientos').insert({
      item_codigo: o.codigo, fecha: todayISO(), lote: o.lote,
      comprobante: comprobanteOrigen,
      entra:0, sale: cantOrigen
    });
    if(e1){ toast('Error: '+e1.message); return; }
    const nDestino = await nextAjusteNumero(o.codigo);
    const comprobanteDestino = 'Ajuste N° ' + nDestino + ': Reetiquetado' + (motivoExtra?(' - '+motivoExtra):'');
    const { error: e2 } = await sb.from('kardex_movimientos').insert({
      item_codigo: o.codigo, fecha: todayISO(), lote: destinoLote,
      fecha_elaboracion: fechaElab, fecha_caducidad: fechaCad,
      comprobante: comprobanteDestino,
      entra: cantDestino, sale:0
    });
    if(e2){ toast('Error: '+e2.message); return; }
    comprobantes = [comprobanteOrigen, comprobanteDestino];
    resumen = 'Reetiquetado: ' + o.codigo + ' — lote ' + o.lote + ' (-' + fmtNum(cantOrigen) + ') → lote ' + destinoLote + ' (+' + fmtNum(cantDestino) + ')';
  } else if(subtipo === 'RECONTEO'){
    const u = ReetState.unico;
    if(!u || !u.codigo || !u.lote){ toast('Selecciona el producto y lote'); return; }
    const cant = parseFloat((document.getElementById('reet_unico_cantidad').value||'0').replace(',','.'));
    if(!cant || cant<=0){ toast('Ingresa la cantidad'); return; }
    const signo = ReetState.signo==='menos' ? -1 : 1;
    const n = await nextAjusteNumero(u.codigo);
    const comprobante = 'Ajuste N° ' + n + ': Reconteo' + (motivoExtra?(' - '+motivoExtra):'');
    const { error } = await sb.from('kardex_movimientos').insert({
      item_codigo: u.codigo, fecha: todayISO(), lote: u.lote,
      comprobante: comprobante,
      entra: signo>0?cant:0, sale: signo<0?cant:0
    });
    if(error){ toast('Error: '+error.message); return; }
    comprobantes = [comprobante];
    resumen = 'Reconteo: ' + u.codigo + ' (lote ' + u.lote + ') ' + (signo>0?'+':'-') + fmtNum(cant);
  } else {
    const u = ReetState.unico;
    if(!u || !u.codigo || !u.lote){ toast('Selecciona el producto y lote'); return; }
    const cant = parseFloat((document.getElementById('reet_unico_cantidad').value||'0').replace(',','.'));
    if(!cant || cant<=0){ toast('Ingresa la cantidad a dar de baja'); return; }
    const n = await nextAjusteNumero(u.codigo);
    const comprobante = 'Ajuste N° ' + n + ': Bajas' + (motivoExtra?(' - '+motivoExtra):'');
    const { error } = await sb.from('kardex_movimientos').insert({
      item_codigo: u.codigo, fecha: todayISO(), lote: u.lote,
      comprobante: comprobante,
      entra:0, sale: cant
    });
    if(error){ toast('Error: '+error.message); return; }
    comprobantes = [comprobante];
    resumen = 'Baja: ' + u.codigo + ' (lote ' + u.lote + ') -' + fmtNum(cant);
  }
  const nuevo = { id:'rt_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), subtipo, resumen, hora: nowHM(), comprobantes };
  const items = (row.items||[]).concat([nuevo]);
  await sb.from('sellado_registros').update({ items, updated_at: new Date().toISOString() }).eq('id', row.id);
  row.items = items;
  await invLoad(true);
  ReetState = { subtipo, signo:'mas', origen:null, destino:null, unico:null };
  toast('Registrado y aplicado al Kardex');
  selRenderReetrabajo(tipo, row);
}

function selFmtTiempo(min){
  if(min==null) return '—';
  const h = Math.floor(min/60), m = Math.round(min%60);
  return (h>0?h+'h ':'') + m + 'min';
}
function selClasificacion(pct){
  if(pct==null) return null;
  if(pct < 0.85) return {k:'bajo', label:'BAJO RENDIMIENTO'};
  if(pct < 0.95) return {k:'moderado', label:'RENDIMIENTO MODERADO'};
  if(pct < 1.00) return {k:'bueno', label:'BUEN RENDIMIENTO'};
  return {k:'excelente', label:'EXCELENTE RENDIMIENTO'};
}
function selCalcMinutos(it){
  if(!it.hora_inicio) return 0;
  const fin = it.hora_fin ? new Date(it.hora_fin).getTime() : Date.now();
  let totalMs = fin - new Date(it.hora_inicio).getTime();
  let pausadoMs = 0;
  (it.pausas||[]).forEach(p=>{
    const pi = p.inicio ? new Date(p.inicio).getTime() : null;
    const pf = p.fin ? new Date(p.fin).getTime() : (it.estado_timer==='pausado' ? Date.now() : null);
    if(pi && pf) pausadoMs += Math.max(0, pf-pi);
  });
  return Math.max(0, (totalMs - pausadoMs) / 60000);
}
function selRecalcKpi(it){
  if(it.minutos_realizado && it.cantidad!=null){
    it.unidades_hora = Math.round((it.cantidad / (it.minutos_realizado/60)) * 100) / 100;
  } else {
    it.unidades_hora = null;
  }
  if(it.unidades_hora!=null && it.meta_selladora){
    it.pct_cumplimiento = Math.round((it.unidades_hora / it.meta_selladora) * 10000) / 10000;
  } else {
    it.pct_cumplimiento = null;
  }
  const cls = selClasificacion(it.pct_cumplimiento);
  it.clasificacion_kpi = cls ? cls.label : null;
}
async function selTimerAction(tipo, itemId, accion){
  const it = selFindItem(tipo, itemId);
  if(!it) return;
  const nowIso = new Date().toISOString();
  if(accion==='iniciar'){
    it.hora_inicio = nowIso; it.estado_timer = 'corriendo'; it.pausas = [];
  } else if(accion==='pausar'){
    it.pausas = (it.pausas||[]).concat([{inicio:nowIso, fin:null}]);
    it.estado_timer = 'pausado';
  } else if(accion==='reanudar'){
    const pausas = it.pausas||[];
    if(pausas.length && !pausas[pausas.length-1].fin) pausas[pausas.length-1].fin = nowIso;
    it.pausas = pausas;
    it.estado_timer = 'corriendo';
  } else if(accion==='detener'){
    const pausas = it.pausas||[];
    if(pausas.length && !pausas[pausas.length-1].fin) pausas[pausas.length-1].fin = nowIso;
    it.pausas = pausas;
    it.hora_fin = nowIso;
    it.minutos_realizado = Math.round(selCalcMinutos(it)*100)/100;
    it.estado_timer = 'detenido';
    selRecalcKpi(it);
  }
  await selPersistItems(tipo);
  selRenderItemList(tipo);
}

function selManageLiveTimers(){
  const hayActivos = Object.values(SelladoState.sesiones||{}).some(row=>row && (row.items||[]).some(i=>i.estado_timer==='corriendo'||i.estado_timer==='pausado'));
  if(hayActivos && !selTimerInterval){
    selTimerInterval = setInterval(()=>{
      Object.keys(SelladoState.sesiones||{}).forEach(tipo=>{
        const row = SelladoState.sesiones[tipo];
        if(row && (row.items||[]).some(i=>i.estado_timer==='corriendo'||i.estado_timer==='pausado')) selRenderItemList(tipo);
      });
    }, 5000);
  } else if(!hayActivos && selTimerInterval){
    clearInterval(selTimerInterval); selTimerInterval = null;
  }
}
function selRenderItemList(tipo){
  const wrap = document.getElementById('selCardItems_'+tipo);
  if(!wrap) return;
  const row = SelladoState.sesiones[tipo];
  const meta = SELLADO_ACTIVIDADES.find(a=>a.key===tipo);
  const items = row ? (row.items||[]) : [];
  const activos = items.filter(i=>i.estado_timer==='corriendo'||i.estado_timer==='pausado');
  const card = document.querySelector(`.machine-card[data-tipo="${tipo}"]`);
  // Solo se puede sellar un producto a la vez por selladora: mientras haya uno
  // en curso o en pausa (que no sea una parada suelta), se oculta la lista de
  // pendientes de ESA selladora — las demás siguen viéndola con normalidad.
  const ocupadaConProducto = activos.some(i=>!i.es_parada);
  const searchWrap = document.getElementById('selCardSearchWrap_'+tipo);
  if(searchWrap) searchWrap.style.display = ocupadaConProducto ? 'none' : '';
  if(card){
    card.classList.toggle('active-sellado', activos.length>0);
    const statusEl = card.querySelector('.machine-status');
    if(statusEl){
      statusEl.textContent = activos.length ? (activos.length===1?'En curso':'En curso ('+activos.length+')') : 'Libre';
      statusEl.classList.toggle('st-sellado', activos.length>0);
    }
  }
  if(!items.length){ wrap.innerHTML = '<div class="empty-state">Sin ítems agregados todavía.</div>'; selManageLiveTimers(); return; }
  const activosParaMostrar = activos;
  if(!activosParaMostrar.length){ wrap.innerHTML = ''; selManageLiveTimers(); return; }
  wrap.innerHTML = activosParaMostrar.map(it=>{
    const tiempoDisplay = selFmtTiempo(selCalcMinutos(it));
    let botones, nombreHtml, rowClass='', pausaLiveHtml='';
    if(it.es_parada){
      rowClass = 'sel-row-parada';
      nombreHtml = `<span class="sup">⏸ PARADA</span><span class="nm">${escHtml(it.actividad_parada||'')}</span>`;
      botones = `<button class="stop" title="Terminar parada" onclick="selDetenerParadaIndependiente('${tipo}','${it.id}')">■</button>`;
    } else if(it.estado_timer==='pausado'){
      rowClass = 'sel-row-pausado';
      const ultimaPausa = (it.pausas||[])[((it.pausas||[]).length-1)];
      const minPausa = ultimaPausa ? selFmtTiempo(Math.max(0,(Date.now()-new Date(ultimaPausa.inicio).getTime())/60000)) : '00:00:00';
      nombreHtml = `<span class="sup">${escHtml(it.item_codigo)}${it.lote&&it.lote!=='N/A'?(' · Lote '+escHtml(it.lote)):''}</span><span class="nm">${escHtml(it.item_nombre)}</span>`;
      pausaLiveHtml = `<div class="sel-pausa-tag">⏸ En pausa — ${escHtml(it.motivo_pausa_actual||'')} <b class="mono">${minPausa}</b></div>`;
      botones = `<button class="go" title="Reanudar sellado" onclick="selReanudarSellado('${tipo}','${it.id}')">▶</button>
                 <button class="stop" title="Finalizar" onclick="openSelItemModal('${tipo}','${it.id}', true)">■</button>`;
    } else {
      rowClass = 'sel-row-corriendo';
      nombreHtml = `<span class="sup">${escHtml(it.item_codigo)}${it.lote&&it.lote!=='N/A'?(' · Lote '+escHtml(it.lote)):''}</span><span class="nm">${escHtml(it.item_nombre)}</span>`;
      botones = `<button class="pause" title="Pausar (registrar parada)" onclick="selAbrirSelectorParada('${tipo}','${it.id}')">❚❚</button>
                 <button class="stop" title="Finalizar" onclick="openSelItemModal('${tipo}','${it.id}', true)">■</button>`;
    }
    return `<div class="sel-item-row ${rowClass}">
      <div class="sel-item-top">
        <div class="sel-item-name" ${it.es_parada?'':`onclick="openSelItemModal('${tipo}','${it.id}')"`}>
          ${nombreHtml}
        </div>
        <div class="sel-item-actions">${botones}
          <button class="del" title="Eliminar" onclick="selDeleteItem('${tipo}','${it.id}')">✕</button>
        </div>
      </div>
      <div class="sel-timer-big">${tiempoDisplay}</div>
      ${pausaLiveHtml}
      ${it.responsable ? `<div style="font-size:11px;color:var(--muted);text-align:center;">${escHtml(it.responsable)}</div>` : ''}
    </div>`;
  }).join('');
  selManageLiveTimers();
}

// Cajas/cartones que la fórmula del producto indica para esa cantidad a sellar
// (mismo criterio que Etiquetado usa para las fundas, pero con la lista de cajas).
function cajasDeFormula(itemCodigoProducto, cantidadReferencia){
  const filaFicticia = { item_codigo: itemCodigoProducto, cantidad_real: cantidadReferencia, cantidad_programada: cantidadReferencia };
  return (cacheFormulacion||[]).filter(f=>f.cod_producto_principal===itemCodigoProducto).map(f=>{
    const compItem = (cacheItems||[]).find(i=>i.codigo===f.cod_componente);
    if(!compItem || compItem.tipo!=='MATERIAL_EMPAQUE' || !nombreEnLista(compItem, SEL_CAJAS_PERMITIDAS)) return null;
    const teorica = pfCantidadTeorica(filaFicticia, f.cod_componente);
    return { item_codigo:f.cod_componente, item_nombre:compItem.nombre, medida:compItem.medida, teorica, cantidad:null, lotes_consumidos:[] };
  }).filter(Boolean);
}

  (c.lotes_consumidos||[]).forEach(l=>{ selCartonLoteConsumo.seleccion[l.lote] = l.cantidad; });

  else{
    listEl.innerHTML = data.map(l=>`
      <div class="lote-row">
        <input type="checkbox" ${previamente.has(l.lote)?'checked':''} onchange="selToggleLoteCarton('${escHtml(l.lote)}', ${l.cantidad_disponible}, this.checked)">
        <div class="lm"><b>Lote ${escHtml(l.lote)}</b><span>Ingreso ${l.fecha_ingreso?l.fecha_ingreso.split('-').reverse().join('/'):'—'}${l.fecha_caducidad?(' · Caduca '+l.fecha_caducidad.split('-').reverse().join('/')):''}</span></div>
        <div class="lq">${fmtNum(l.cantidad_disponible)} ${escHtml(c.medida)}</div>
      </div>
    `).join('');
  }
  selCartonLoteRecalc();
}
function selToggleLoteCarton(lote, disponible, checked){
  if(checked){
    const yaAsignado = Object.values(selCartonLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
    const falta = Math.max(0, selCartonLoteConsumo.total - yaAsignado);
    selCartonLoteConsumo.seleccion[lote] = Math.min(disponible, falta);
  } else {
    delete selCartonLoteConsumo.seleccion[lote];
  }
  selCartonLoteRecalc();
}
function selCartonLoteRecalc(){
  const asignado = Object.values(selCartonLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
  const falta = Math.round((selCartonLoteConsumo.total - asignado)*10000)/10000;
  const remainEl = document.getElementById('selCartonLoteRemain');
  if(remainEl){
    remainEl.className = 'lote-remain ' + (falta<=0.001 ? 'ok' : 'warn');
    remainEl.innerHTML = `<span>A consumir: ${fmtNum(selCartonLoteConsumo.total)}</span><span>${falta>0.001 ? ('Falta '+fmtNum(falta)) : 'Completo'}</span>`;
  }
}
function selConfirmarLotesCarton(idx){
  const c = SelCartonState.cartones[idx];
  if(!c) return;
  const seleccionados = Object.entries(selCartonLoteConsumo.seleccion).filter(([,v])=>v>0).map(([lote,cantidad])=>({lote, cantidad}));
  if(!seleccionados.length){ toast('Selecciona al menos un lote'); return; }
  const asignado = seleccionados.reduce((s,l)=>s+l.cantidad,0);
  const falta = Math.round((selCartonLoteConsumo.total - asignado)*10000)/10000;
  if(falta > 0.001){
    toast('Los lotes elegidos no completan la cantidad a consumir. Falta ' + fmtNum(falta) + '. Elige otro lote o ajusta la cantidad.');
    return;
  }
  c.lotes_consumidos = seleccionados;
  closeModal();
  selRenderCartonList();
}
// Escribe en Kardex los cartones/cajas usados en un ítem de sellado (reconciliable:
// borra lo anterior con el mismo comprobante y vuelve a insertar lo actual).
async function selGuardarCartonesKardex(it){
  const comprobante = 'SELLADO-CARTON ' + it.id;
  const { error: errDel } = await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  if(errDel) return { error: errDel };
  const movimientos = [];
  (it.cartones||[]).forEach(c=>{
    (c.lotes_consumidos||[]).forEach(l=>{
      if(Number(l.cantidad)>0){
        movimientos.push({ item_codigo: c.item_codigo, fecha: todayISO(), lote: l.lote||null, comprobante, entra:0, sale: Number(l.cantidad) });
      }
    });
  });
  if(movimientos.length){
    const { error } = await sb.from('kardex_movimientos').insert(movimientos);
    if(error) return { error };
  }
  return { error: null };
}
async function selAddResponsable(){
  const input = document.getElementById('selRespNuevo');
  const nombre = input.value.trim();
  if(!nombre){ toast('Escribe un nombre'); return; }
  const { error } = await sb.from('catalogos').insert({ tipo:'responsable_sellado', nombre });
  if(error){ toast('Error: '+error.message); return; }
  const { data } = await sb.from('catalogos').select('*').eq('tipo','responsable_sellado').eq('activo',true);

    sel.value = nombre;
  }

}
async function saveSelItemModal(tipo, itemId){
  const it = selFindItem(tipo, itemId);
  if(!it) return;
  it.lote = document.getElementById('selLote').value.trim();
  it.n_personas = parseFloat((document.getElementById('selPersonas').value||'0').replace(',','.')) || 0;
  const meta = SELLADO_ACTIVIDADES.find(a=>a.key===tipo);
  it.n_selladoras = meta.esSellado ? (document.getElementById('selSelladoras').value.trim() || '1') : 'N/A';
  it.observaciones = document.getElementById('selObs').value;
  it.responsable = document.getElementById('selResp').value;
  // Hora de inicio/fin manual (por si se olvidó presionar Iniciar/Detener en el momento)
  const hiManual = document.getElementById('selHoraInicioManual').value;
  const hfManual = document.getElementById('selHoraFinManual').value;
  if(hiManual){
    it.hora_inicio = hmToISOToday(hiManual);
    if(hfManual){
      it.hora_fin = hmToISOToday(hfManual);
      // Si quedó una pausa abierta (se finaliza directo desde "en pausa"), se cierra
      // con la misma hora de fin para que el cálculo de tiempo sea correcto.
      const pausasAbiertas = it.pausas||[];
      if(pausasAbiertas.length && !pausasAbiertas[pausasAbiertas.length-1].fin) pausasAbiertas[pausasAbiertas.length-1].fin = it.hora_fin;
      it.pausas = pausasAbiertas;
      selRegistrarParadasCerradas(tipo, it);
      it.minutos_realizado = Math.max(0, Math.round(selCalcMinutos(it)*100)/100);
      it.estado_timer = 'detenido';
    } else {
      it.hora_fin = null;
      it.minutos_realizado = null;
      it.estado_timer = 'corriendo';
    }
  }
  const cantidadInput = document.getElementById('selCantidad');
  if(cantidadInput){
    const cantVal = cantidadInput.value!=='' ? parseFloat(cantidadInput.value.replace(',','.')) : null;
    it.cantidad = isNaN(cantVal) ? null : cantVal;
    const metaActual = (cacheMetasSellado||[]).find(m=>m.item_codigo===it.item_codigo);
    it.meta_selladora = metaActual ? metaActual.meta_uh : 0;
    selRecalcKpi(it);
    if(it.pendiente_al_iniciar!=null && cantVal!=null && cantVal > it.pendiente_al_iniciar + 0.001){
      toast('Sellaste más de lo que estaba pendiente (' + fmtNum(it.pendiente_al_iniciar) + '). Se guardó igual; si la producción real fue mayor, corrígela en Ajuste → Reconteo.');
    }
  } else if(hiManual && hfManual){
    selRecalcKpi(it);
  }
  if(meta.esSellado && it.item_codigo!=='N/A' && it.estado_timer==='detenido'){
    // Solo se puede registrar el cierre (y solo entonces desaparece el conteo)
    // cuando ya están todos los datos obligatorios.
    const faltan = [];
    if(it.cantidad==null || it.cantidad<=0) faltan.push('Cantidad sellada');
    if(!it.lote) faltan.push('Lote');
    if(!it.responsable) faltan.push('Responsable');
    if(faltan.length){
      toast('Faltan datos para finalizar: ' + faltan.join(', '));
      return;
    }
  }
  if(SelCartonState.itemId === itemId){
    it.cartones = SelCartonState.cartones;
    const { error: errCarton } = await selGuardarCartonesKardex(it);
    if(errCarton){ toast('Se guardó, pero hubo un error al descontar los cartones del Kardex: ' + errCarton.message); }
    await invLoad(true);
  }
  await selPersistItems(tipo);
  await selCargarPendientesSellado(); // recalcular pendientes ya que se selló algo nuevo
  closeModal();
  selRenderItemList(tipo);
  selRefrescarPendientesEnTodasLasSelladoras();
  toast('Guardado');
}

          responsable: '', observaciones: 'Hora: ' + (it.hora||'')
        });
      });

    }

        fecha: row.fecha, tipo_actividad: row.tipo_actividad, nombre_actividad: row.nombre_actividad,

async function selRegGuardarVerificacion(rowId, itemId){
  const row = (SelRegState.rows||[]).find(r=>r.id===rowId);
  if(!row) return;
  const it = (row.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  it.lote = document.getElementById('srLote').value.trim();
  const personasEl = document.getElementById('srPersonas');
  if(personasEl) it.n_personas = parseFloat((personasEl.value||'0').replace(',','.')) || 0;
  const selladorasEl = document.getElementById('srSelladoras');
  if(selladorasEl && !selladorasEl.disabled) it.n_selladoras = selladorasEl.value.trim();
  it.observaciones = document.getElementById('srObs').value;
  it.responsable = document.getElementById('srResp').value;
  const hi = document.getElementById('srHoraInicio').value;
  const hf = document.getElementById('srHoraFin').value;
  it.hora_inicio = hi ? hmToISOToday(hi) : null;
  it.hora_fin = hf ? hmToISOToday(hf) : null;
  if(hi && hf) it.minutos_realizado = Math.max(0, Math.round(((new Date(it.hora_fin)-new Date(it.hora_inicio))/60000)*100)/100);
  const cantEl = document.getElementById('srCantidad');
  if(cantEl){
    it.cantidad = cantEl.value!=='' ? parseFloat(cantEl.value.replace(',','.')) : null;
    const metaActual = (cacheMetasSellado||[]).find(m=>m.item_codigo===it.item_codigo);
    it.meta_selladora = metaActual ? metaActual.meta_uh : 0;
    selRecalcKpi(it);
  }
  const { error } = await sb.from('sellado_registros').update({ items: row.items, updated_at: new Date().toISOString() }).eq('id', row.id);
  if(error){ toast('Error: '+error.message); return; }
  closeModal();
  toast('Registro corregido');
  selRenderRegistrosList();
}
async function selRegEliminar(rowId, itemId){
  const row = (SelRegState.rows||[]).find(r=>r.id===rowId);
  if(!row) return;
  const it = (row.items||[]).find(i=>i.id===itemId);
  if(!it) return;
  const esReetrabajo = row.tipo_actividad === 'REETRABAJO';
  const msg = esReetrabajo
    ? '¿Eliminar este ajuste? Esto también revertirá los movimientos que generó en el Kardex.'
    : '¿Eliminar este registro?';
  if(!confirm(msg)) return;
  if(esReetrabajo && it.comprobantes && it.comprobantes.length){
    for(const c of it.comprobantes){
      await sb.from('kardex_movimientos').delete().eq('comprobante', c);
    }
    await invLoad(true);
  }
  if(!esReetrabajo && it.cartones && it.cartones.length){
    await sb.from('kardex_movimientos').delete().eq('comprobante', 'SELLADO-CARTON ' + it.id);
    await invLoad(true);
  }
  const items = (row.items||[]).filter(i=>i.id!==itemId);
  const { error } = await sb.from('sellado_registros').update({ items, updated_at: new Date().toISOString() }).eq('id', row.id);
  if(error){ toast('Error: '+error.message); return; }
  row.items = items;
  await selCargarPendientesSellado();
  toast(esReetrabajo ? 'Ajuste eliminado y Kardex revertido' : 'Registro eliminado');
  selRenderRegistrosList();
}

/* Firma: pad de dibujo simple sobre <canvas> */
let firmaPadTarget = null;
let firmaPadModule = null;
let firmaPadDrawing = false;
function openFirmaPad(field, modulo){
  firmaPadTarget = field;
  firmaPadModule = modulo || 'bodega';
  openModal(`
    <h3>Firma</h3>
    <div class="msub">Dibuja el garabato con el dedo o el mouse</div>
    <canvas id="firmaCanvas" width="320" height="160" style="width:100%;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;"></canvas>
    <div class="modal-actions">
      <button class="btn ghost" type="button" onclick="firmaPadClear()">Borrar</button>
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" style="--accent:var(--traza)" onclick="firmaPadGuardar()">Guardar firma</button>
    </div>
  `);
  const canvas = document.getElementById('firmaCanvas');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1b1b1b';
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx*scaleX, y: cy*scaleY };
  }
  function start(e){ firmaPadDrawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!firmaPadDrawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ firmaPadDrawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
}
function firmaPadClear(){
  const canvas = document.getElementById('firmaCanvas');
  if(canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}
function firmaPadGuardar(){
  const canvas = document.getElementById('firmaCanvas');
  if(!canvas || !firmaPadTarget) return;
  const dataUrl = canvas.toDataURL('image/png');
  if(firmaPadModule === 'despacho' && typeof DespState !== 'undefined' && DespState.draft){
    DespState.draft[firmaPadTarget] = dataUrl;
    closeModal();
    toast('Firma guardada');
    if(typeof despRenderLiberacion === 'function') despRenderLiberacion();
    return;
  }
  if(BodState.draft) BodState.draft[firmaPadTarget] = dataUrl;
  closeModal();
  toast('Firma guardada');

  if(!elab || !exp) return null;
  const d1 = new Date(elab), d2 = new Date(exp);

  return isNaN(dias) ? null : dias;
}

async function bodGuardarRegistro(){
  const d = BodState.draft;
  if(!d.proveedor){ toast('Ingresa el proveedor'); return; }
  if(!d.items || !d.items.length){ toast('Agrega al menos un ítem'); return; }
  await bodAddPlacaSiNueva();
  if(!d.hora_salida) d.hora_salida = nowHM();
  const payload = { ...d, estado:'cerrado', updated_at: new Date().toISOString() };
  const isEdit = !!payload.id;
  let saved, error;
  if(isEdit){
    const id = payload.id; delete payload.id;
    ({ data: saved, error } = await sb.from('bodega_registros').update(payload).eq('id', id).select().single());
  } else {
    ({ data: saved, error } = await sb.from('bodega_registros').insert(payload).select().single());
  }
  if(error){ toast('Error al guardar: ' + error.message); return; }
  // Kardex: si es edición, primero limpiar los movimientos previos de esta compra
  const comprobante = 'COMPRA N°' + d.numero_compra + ': FACTURA ' + (d.factura||'—');
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  const itemsValidos = (d.items||[]).filter(it=>it.item_codigo && !isNaN(Number(it.cantidad)) && Number(it.cantidad)>0);
  const movimientos = itemsValidos.map(it=>({
    item_codigo: it.item_codigo, fecha: d.fecha, fecha_elaboracion: it.fecha_elaboracion || null, fecha_caducidad: it.fecha_expiracion || null,
    lote: it.lote || null, comprobante, entra: Number(it.cantidad), sale: 0
  }));
  if(movimientos.length){
    const { error: errK } = await sb.from('kardex_movimientos').insert(movimientos);
    if(errK){ toast('Registro guardado, pero hubo un error al escribir en Kardex: ' + errK.message); }
  }
  if(itemsValidos.length < (d.items||[]).length){
    toast('Atención: ' + ((d.items||[]).length - itemsValidos.length) + ' ítem(s) con cantidad 0 no se enviaron al Kardex.');
  }
  await invLoad(true);
  BodState.draft = null;
  toast('Recepción guardada en Registros y en Kardex');
  BodState.tab = 'registros';
  setActiveTab('registros');
  renderBodRegistrosTab();
}

/* ---------------- Registros ---------------- */
const BodRegState = { q:'', desde:'', hasta:'', proveedor:'', tipo:'', rows:null };
async function bodRegLoad(){
  let query = sb.from('bodega_registros').select('*').order('numero_compra',{ascending:false});
  if(BodRegState.desde) query = query.gte('fecha', BodRegState.desde);
  if(BodRegState.hasta) query = query.lte('fecha', BodRegState.hasta);
  const { data, error } = await query.limit(1000);
  BodRegState.rows = error ? [] : (data||[]);
}
function bodRegFiltered(){
  let rows = (BodRegState.rows||[]).slice();
  const q = (BodRegState.q||'').trim().toUpperCase();
  if(q){
    rows = rows.filter(r=>
      (r.factura||'').toUpperCase().includes(q) ||
      (r.guia_remision||'').toUpperCase().includes(q) ||
      (r.items||[]).some(it=>(it.item_codigo||'').toUpperCase().includes(q) || (it.item_nombre||'').toUpperCase().includes(q))
    );
  }
  if(BodRegState.proveedor) rows = rows.filter(r=>(r.proveedor||'')===BodRegState.proveedor);
  if(BodRegState.tipo) rows = rows.filter(r=>(r.tipo_recepcion||'')===BodRegState.tipo);
  return rows;
}

function bodExportExcel(){

  rows.forEach(r=>{

async function despLoad(force){

async function nextDespachoN(){
  let maxN = 0;
  try{

    if(!error && data && data.length) maxN = Number(data[0].numero_despacho||0);

async function despPickDestino(direccion){

  if(!DespState.draft.hora_llegada) DespState.draft.hora_llegada = nowHM();
  if(dest && dest.cliente) DespState.draft.cliente = dest.cliente;

    const ex = cacheDespDestinos.find(x=>x.direccion===direccion);

async function despPickResponsable(field, nombre){

}

function despSearchItem(q){
  q = (q||'').trim().toUpperCase();
  const results = document.getElementById('despItemResults');
  if(!results) return;
  if(!q){ results.innerHTML=''; return; }
  const yaAgregados = new Set((DespState.draft.items||[]).map(i=>i.item_codigo));
  const matches = (cacheStock||[]).filter(i=>i.activo!==false && Number(i.stockfin||0)>0 && !yaAgregados.has(i.codigo) && (i.codigo.toUpperCase().includes(q)||i.nombre.toUpperCase().includes(q))).slice(0,20);
  results.innerHTML = matches.length ? matches.map(m=>`<div class="sr-item" onclick="despPickItem('${escHtml(m.codigo)}')"><b>${escHtml(m.codigo)}</b>${escHtml(m.nombre)} <span class="sub">(stock ${fmtNum(m.stockfin)})</span></div>`).join('') : '<div class="sr-empty">Sin resultados en stock</div>';
}
function despPickItem(codigo){
  const item = (cacheStock||[]).find(i=>i.codigo===codigo);
  if(!item) return;
  openModal(`
    <h3>${escHtml(item.nombre)}</h3>
