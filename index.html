async function tryLogin(){
  const pass = document.getElementById('loginPass').value.trim();
  if(!pass){ document.getElementById('loginErr').textContent = 'Ingresa la clave'; return; }
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  let list = usuariosAreaCache;
  if(!list) list = await loadUsuariosArea();
  btn.disabled = false;
  if(!list){
    document.getElementById('loginErr').textContent = 'Sin conexión al servidor. Intenta de nuevo.';
    return;
  }
  const match = list.find(u=>u.area===pendingLoginArea && u.clave===pass);
  if(!match){
    document.getElementById('loginErr').textContent = 'Clave incorrecta';
    return;
  }
  sessionStorage.setItem('propizzec_area', pendingLoginArea);
  closeLogin();
  enterApp(pendingLoginArea);
}

  document.getElementById('appShell').style.display = 'none';

/* ============================================================

   abrió sobre otra, se vuelve a mostrar la anterior en vez de cerrar todo)
   ============================================================ */
let modalStack = [];
let currentModalHook = null; // función a ejecutar en vez de restaurar la ventana anterior tal cual
function openModal(html, onClose){
  const bg = document.getElementById('modalBg');
  if(bg.classList.contains('show')){
    modalStack.push({ html: document.getElementById('modalPanel').innerHTML, hook: currentModalHook });
  }
  currentModalHook = onClose || null;
  document.getElementById('modalPanel').innerHTML = `<button class="mclose" onclick="closeModal()">✕</button>${html}`;
  bg.classList.add('show');
}
function closeModal(){
  // Si esta ventana tenía registrada una forma propia de "volver" (por ejemplo,
  // regenerar la ventana anterior con datos frescos en vez de una foto vieja),
  // se usa esa, sin importar si se cerró con el botón "Cerrar", con la "✕" de
  // la esquina, o tocando fuera de la ventana — así nunca se ve como "borrado".
  if(currentModalHook){
    const hook = currentModalHook;
    currentModalHook = null;
    hook();
    return;
  }
  if(modalStack.length){
    const prev = modalStack.pop();
    currentModalHook = prev.hook;
    document.getElementById('modalPanel').innerHTML = prev.html;
    return;
  }
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('modalPanel').innerHTML = '';
}
function closeModalAll(){
  modalStack = [];
  currentModalHook = null;
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('modalPanel').innerHTML = '';
}
document.getElementById('modalBg').addEventListener('click', e=>{
  if(e.target.id === 'modalBg') closeModal();
});

  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtNum(n){
  n = Number(n||0);
  return n.toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ============================================================
   CONVERSIONES BÁSICAS DE UNIDADES (KG↔G, L↔ML, GAL↔L, etc.)
   Solo convierte entre medidas de la misma familia; si la medida
   no está en la tabla o son de familias distintas, no convierte.
   ============================================================ */
const UNIT_GROUPS = {
  'GRAMOS':      {group:'peso', factor:1},
  'GRAMO':       {group:'peso', factor:1},
  'KILOGRAMOS':  {group:'peso', factor:1000},
  'KILOGRAMO':   {group:'peso', factor:1000},
  'KG':          {group:'peso', factor:1000},
  'LIBRAS':      {group:'peso', factor:453.592},
  'LIBRA':       {group:'peso', factor:453.592},
  'MILILITROS':  {group:'volumen', factor:1},
  'MILILITRO':   {group:'volumen', factor:1},
  'ML':          {group:'volumen', factor:1},
  'LITROS':      {group:'volumen', factor:1000},
  'LITRO':       {group:'volumen', factor:1000},
  'GALONES':     {group:'volumen', factor:3785.411},
  'GALON':       {group:'volumen', factor:3785.411},
  'UNIDAD':      {group:'unidad', factor:1},
  'UNIDADES':    {group:'unidad', factor:1},
};
function convertQty(val, fromU, toU){
  val = Number(val||0);
  fromU = String(fromU||'').trim().toUpperCase();
  toU = String(toU||'').trim().toUpperCase();
  if(!fromU || !toU || fromU===toU) return val;
  const f = UNIT_GROUPS[fromU], t = UNIT_GROUPS[toU];
  if(!f || !t || f.group !== t.group) return val; // no se puede convertir, se deja igual
  return val * f.factor / t.factor;
}

  if(force || !cacheMedidas)     tasks.push(sb.from('medidas').select('*').eq('activo',true).order('nombre').then(r=>cacheMedidas=r.data||[]));
  if(force || !cacheFormulacion) tasks.push(sb.from('formulacion').select('*').order('cod_producto_principal').then(r=>cacheFormulacion=r.data||[]));

async function openKardexHistory(codigo){
  const item = (cacheStock||[]).find(r=>r.codigo===codigo);
  const soloLectura = !!(permisoActual() && permisoActual().soloKardex);
  openModal(`
    <span class="sup" style="font-size:11px;color:var(--muted);font-weight:600;">${escHtml(codigo)}</span>
    <h3 style="margin-top:2px;">${escHtml(item ? item.nombre : codigo)}</h3>
    ${soloLectura ? '' : `
    <div style="display:flex;flex-direction:column;gap:8px;margin:10px 0 14px;">
      <button class="btn" onclick="exportKardexExcelItem('${escHtml(codigo)}')">⬇ Descargar Excel de este ítem</button>
      <button class="btn primary" style="--accent:var(--personal)" onclick="openAjusteModal('${escHtml(codigo)}')">⚙️ Ajuste</button>
    </div>
    `}
    <div class="msub">Historial de movimientos (Kardex)</div>
    <div id="kxHist"><div class="empty-state">Cargando…</div></div>
  `);
  const { data, error } = await sb.from('kardex_movimientos').select('*').eq('item_codigo', codigo).order('fecha', {ascending:true}).order('created_at', {ascending:true});
  const hist = document.getElementById('kxHist');
  if(error || !data){ hist.innerHTML = '<div class="empty-state">No se pudo cargar el historial</div>'; return; }
  if(!data.length){ hist.innerHTML = '<div class="empty-state">Sin movimientos registrados</div>'; return; }
  let running = 0;
  const rowsHtml = data.map(m=>{
    running += Number(m.entra||0) - Number(m.sale||0);
    const fecha = m.fecha ? m.fecha.split('-').reverse().join('/') : '—';
    const detalle = [m.comprobante, m.lote?('Lote '+m.lote):null].filter(Boolean).join(' · ');
    const entra = Number(m.entra||0), sale = Number(m.sale||0);
    const val = entra>0 ? '+'+fmtNum(entra) : (sale>0 ? '-'+fmtNum(sale) : fmtNum(0));
    const cls = entra>0 ? 'in' : (sale>0 ? 'out' : '');
    return `<div class="kx-move">
      <div class="l"><b>${fecha}</b>${escHtml(detalle||'—')}</div>
      <div class="r ${cls}">${val}</div>
    </div>`;
  }).join('');
  hist.innerHTML = rowsHtml + `<div class="kx-total"><span>StockFin</span><span>${fmtNum(running)} ${escHtml(item?item.medida:'')}</span></div>`;
}

    </div>

      <div class="field" style="flex:1;"><label>Fecha de elaboración</label><input type="date" id="ajFechaElab"></div>

function ajLoteChanged(){
  const sel = document.getElementById('ajLote');
  const opt = sel.selectedOptions[0];
  const wrap = document.getElementById('ajNuevoLoteWrap');
  const elab = document.getElementById('ajFechaElab');
  const cad = document.getElementById('ajFechaCad');
  const esNuevo = opt && opt.value === '__NUEVO__';
  if(wrap) wrap.style.display = esNuevo ? 'block' : 'none';
  if(esNuevo){
    if(elab) elab.value = '';
    if(cad) cad.value = '';
    const nl = document.getElementById('ajNuevoLote');
    if(nl) nl.focus();
    return;
  }
  if(!opt || !opt.value) return;
  if(elab) elab.value = opt.dataset.felab || '';
  if(cad) cad.value = opt.dataset.fcad || '';
}
async function guardarAjuste(codigo, nAjuste){
  const sel = document.getElementById('ajLote');
  let lote = sel.value;
  if(!lote){ toast('Selecciona un lote'); return; }
  const opt = sel.selectedOptions[0];
  const esNuevo = lote === '__NUEVO__';
  if(esNuevo){
    const nl = document.getElementById('ajNuevoLote');
    lote = (nl ? nl.value : '').trim();
    if(!lote){ toast('Escribe el código del lote nuevo'); return; }
  }
  const disponible = esNuevo ? 0 : Number(opt.dataset.disp||0);
  const motivoTxt = document.getElementById('ajMotivo').value.trim();
  if(!motivoTxt){ toast('Escribe el motivo del ajuste'); return; }
  const cantidadFisica = Number(document.getElementById('ajCantidad').value);
  if(isNaN(cantidadFisica)){ toast('Ingresa la cantidad física actual'); return; }
  const nuevaFechaElab = document.getElementById('ajFechaElab') ? (document.getElementById('ajFechaElab').value || null) : null;
  const nuevaFechaCad = document.getElementById('ajFechaCad') ? (document.getElementById('ajFechaCad').value || null) : null;
  const delta = cantidadFisica - disponible;
  if(delta === 0 && !nuevaFechaElab && !nuevaFechaCad){ toast('No hay diferencia que ajustar ni fechas que corregir'); return; }
  const comprobante = 'Ajuste N° ' + nAjuste + ': ' + motivoTxt;
  if(delta !== 0){
    const mov = {
      item_codigo: codigo,
      fecha: todayISO(),
      // En un lote nuevo las fechas pertenecen a este primer movimiento del lote;
      // en un lote existente se corrigen abajo en todos sus movimientos.
      fecha_elaboracion: esNuevo ? nuevaFechaElab : null,
      fecha_caducidad: esNuevo ? nuevaFechaCad : null,
      lote: lote,
      comprobante: comprobante,
      entra: delta>0 ? delta : 0,
      sale: delta<0 ? -delta : 0
    };
    const { error } = await sb.from('kardex_movimientos').insert(mov);
    if(error){ toast('Error al guardar ajuste: ' + error.message); return; }
  }
  // Las fechas de elaboración/caducidad son del LOTE, no de este movimiento puntual:
  // se corrigen en todos los movimientos de ese lote para ese ítem.
  if(!esNuevo && (nuevaFechaElab || nuevaFechaCad)){
    const patch = {};
    if(nuevaFechaElab) patch.fecha_elaboracion = nuevaFechaElab;
    if(nuevaFechaCad) patch.fecha_caducidad = nuevaFechaCad;
    const { error: errFechas } = await sb.from('kardex_movimientos').update(patch).eq('item_codigo', codigo).eq('lote', lote);
    if(errFechas){ toast('Ajuste guardado, pero no se pudieron corregir las fechas del lote: ' + errFechas.message); }
  }
  toast(esNuevo ? ('Lote ' + lote + ' agregado al Kardex') : 'Ajuste guardado');
  await invLoad(true);
  closeModalAll();
  openKardexHistory(codigo);
}

function nextItemCode(prefix, tipoNombre){
  const existentes = (cacheItems||[]).filter(it => (it.codigo||'').toUpperCase().startsWith(prefix.toUpperCase()));
  let width = 4;
  let maxNum = 0;
  existentes.forEach(it=>{
    const numPart = it.codigo.slice(prefix.length);
    const n = parseInt(numPart, 10);
    if(!isNaN(n)){
      if(numPart.length) width = numPart.length;
      if(n > maxNum) maxNum = n;
    }
  });
  const next = maxNum + 1;
  return prefix + String(next).padStart(width, '0');
}

  `);

}

async function saveItemForm(codigoEdit){
  const nombre = document.getElementById('fNombre').value.trim();
  const medida = document.getElementById('fMedida').value;
  const presCant = parseFloat((document.getElementById('fPresCant').value||'1').replace(',','.')) || 1;
  const presMedida = document.getElementById('fPresMedida').value;
  const requiereLote = document.getElementById('fRequiereLote').checked;
  if(!nombre){ toast('Ingresa el nombre del ítem'); return; }

  if(codigoEdit){
    const activo = document.getElementById('fActivo').checked;
    const { error } = await sb.from('items').update({
      nombre, medida, presentacion_cantidad: presCant, presentacion_medida: presMedida,
      activo, requiere_lote: requiereLote, updated_at: new Date().toISOString()
    }).eq('codigo', codigoEdit);
    if(error){ toast('Error: ' + error.message); return; }
    toast('Ítem actualizado');
  } else {
    const tipo = document.getElementById('fTipo').value;
    const codigo = nextItemCode(tipo);
    const { error } = await sb.from('items').insert({
      codigo, nombre, medida, tipo, presentacion_cantidad: presCant, presentacion_medida: presMedida, requiere_lote: requiereLote
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Ítem agregado: ' + codigo);
  }
  closeModal();
  await invLoad(true);
  renderItemsTab();
}
async function deleteOneItem(codigo){
  if(!confirm('¿Eliminar el ítem ' + codigo + ' de forma permanente?')) return;
  const { error } = await sb.from('items').delete().eq('codigo', codigo);
  if(error){ toast('Error al eliminar: ' + error.message); return; }
  closeModal();
  await invLoad(true);
  toast('Ítem eliminado');
  renderItemsTab();
}

let formEditing = null;   // código del producto principal que se está editando (null = nuevo)
let formIngredientes = []; // [{codigo, nombre, medida, cantidad}]
let formProducto = null;   // {codigo, nombre, presentacion_cantidad, presentacion_medida}

function groupedFormulacion(){
  const map = new Map();
  (cacheFormulacion||[]).forEach(r=>{
    if(!map.has(r.cod_producto_principal)){
      const item = (cacheItems||[]).find(i=>i.codigo===r.cod_producto_principal);
      map.set(r.cod_producto_principal, { codigo:r.cod_producto_principal, nombre: item?item.nombre:r.cod_producto_principal, count:0 });
    }
    map.get(r.cod_producto_principal).count++;
  });
  return Array.from(map.values());
}
let formSelected = new Set();

function renderFormulacionTab(){
  const body = document.getElementById('invBody');
  const q = InvState.searchForm.trim().toUpperCase();
  let rows = groupedFormulacion();
  if(q) rows = rows.filter(r=> r.codigo.toUpperCase().includes(q) || r.nombre.toUpperCase().includes(q));
  rows.sort((a,b)=>a.nombre.localeCompare(b.nombre));

  body.innerHTML = `
    <div class="list-toolbar">
      <div class="search-wrap"><span class="sic">🔎</span>
        <input type="text" id="fmSearch" placeholder="Buscar por código o nombre…" value="${escHtml(InvState.searchForm)}">
      </div>
      <button class="btn danger bulk-del ${formSelected.size?'show':''}" onclick="deleteSelectedFormulaciones()">Eliminar (${formSelected.size})</button>
      <button class="btn primary" style="--accent:var(--calidad)" onclick="openFormulacionForm(null)">+ Añadir</button>
    </div>
    <div class="list-meta">${rows.length} producto(s) con formulación</div>
    <div class="reg-list" id="fmList"></div>
  `;
  document.getElementById('fmSearch').addEventListener('input', e=>{ InvState.searchForm = e.target.value; renderFormulacionTab(); });
  const focusEl = document.getElementById('fmSearch'); focusEl.focus(); focusEl.selectionStart = focusEl.value.length;

  const list = document.getElementById('fmList');
  if(!rows.length){ list.innerHTML = '<div class="empty-state">Sin formulaciones registradas</div>'; return; }
  list.innerHTML = rows.map(r=>`
    <div class="reg-row">
      <input type="checkbox" ${formSelected.has(r.codigo)?'checked':''} onchange="toggleFormSelect('${escHtml(r.codigo)}', this.checked)">
      <div class="rmain" onclick="openFormulacionForm('${escHtml(r.codigo)}')">
        <span class="sup">${escHtml(r.codigo)} · ${r.count} ingrediente(s)</span>
        <span class="big">${escHtml(r.nombre)}</span>
      </div>
      <button class="redit" onclick="openFormulacionForm('${escHtml(r.codigo)}')">✎</button>
    </div>
  `).join('');
}
function toggleFormSelect(codigo, checked){
  if(checked) formSelected.add(codigo); else formSelected.delete(codigo);
  renderFormulacionTab();
}
async function deleteSelectedFormulaciones(){
  if(!formSelected.size) return;
  if(!confirm('¿Eliminar la formulación de ' + formSelected.size + ' producto(s)?')) return;
  const codes = Array.from(formSelected);
  const { error } = await sb.from('formulacion').delete().in('cod_producto_principal', codes);
  if(error){ toast('Error al eliminar: ' + error.message); return; }
  formSelected.clear();
  await invLoad(true);
  toast('Formulación eliminada');
  renderFormulacionTab();
}

let fmPresPrevMedida = 'KILOGRAMOS';
function openFormulacionForm(codigoProducto){
  formEditing = codigoProducto;
  if(codigoProducto){
    const item = (cacheItems||[]).find(i=>i.codigo===codigoProducto);
    const filas = (cacheFormulacion||[]).filter(r=>r.cod_producto_principal===codigoProducto);
    // La presentación (100%) de la formulación es independiente de Items: se usa la
    // guardada en formulacion (pres_cantidad/pres_medida) si existe; si es la primera
    // vez, se toma como referencia inicial la de Items, pero SIN modificar Items nunca.
    const primera = filas[0];
    const presCant = (primera && primera.pres_cantidad!=null) ? primera.pres_cantidad : (item?item.presentacion_cantidad:1);
    const presMed  = (primera && primera.pres_medida) ? primera.pres_medida : (item?item.presentacion_medida:'KILOGRAMOS');
    formProducto = item ? {codigo:item.codigo, nombre:item.nombre, presentacion_cantidad:presCant, presentacion_medida:presMed} : {codigo:codigoProducto, nombre:codigoProducto, presentacion_cantidad:1, presentacion_medida:'KILOGRAMOS'};
    fmPresPrevMedida = formProducto.presentacion_medida;
    formIngredientes = filas.map(r=>{
      const it = (cacheItems||[]).find(i=>i.codigo===r.cod_componente);
      return { codigo:r.cod_componente, nombre: it?it.nombre:r.cod_componente, medida:r.medida, cantidad:Number(r.cantidad||0) };
    });
  } else {
    formProducto = null;
    formIngredientes = [];
    fmPresPrevMedida = 'KILOGRAMOS';
  }
  renderFormulacionModal();
}
function fmPresMedidaChanged(newMedida){
  const cantInput = document.getElementById('fmPresCant');
  if(cantInput){
    const val = parseFloat((cantInput.value||'0').replace(',','.')) || 0;
    const converted = convertQty(val, fmPresPrevMedida, newMedida);
    cantInput.value = fmtRaw(Math.round(converted*10000)/10000);
  }
  fmPresPrevMedida = newMedida;
  fmRenderIngList();
}
function renderFormulacionModal(){
  const medidas = cacheMedidas||[];
  const medidaOptionsFor = (sel)=>medidas.map(m=>`<option value="${escHtml(m.nombre)}" ${sel===m.nombre?'selected':''}>${escHtml(m.nombre)}</option>`).join('');
  const totalPres = formProducto ? Number(formProducto.presentacion_cantidad||1) : 1;
  const totalIng = formIngredientes.reduce((s,i)=>s+Number(i.cantidad||0), 0);
  const pctClass = Math.abs(totalIng-totalPres) < 0.001 ? 'ok' : '';

  openModal(`
    <h3>${formProducto ? escHtml(formProducto.nombre) : 'Agregar / Editar Formulación'}</h3>
    <div class="msub">${formProducto ? escHtml(formProducto.codigo) : 'Primero busca y selecciona el producto principal'}</div>

    <div id="fmProductPicker" style="${formProducto?'display:none':''}">
      <div class="field">
        <label>Buscar producto (código o nombre)</label>
        <input type="text" id="fmProdSearch" placeholder="Ej: PT0018 o PIZZA" oninput="fmSearchProducts(this.value)">
        <div class="search-results" id="fmProdResults"></div>
      </div>
    </div>

    <div id="fmProductBody" style="${formProducto?'':'display:none'}">
      <div class="field-row">
        <div class="field">
          <label>Presentación (cantidad total = 100%)</label>
          <input type="text" inputmode="decimal" id="fmPresCant" value="${formProducto?fmtRaw(totalPres):'1'}" oninput="fmRecalcPct()">
        </div>
        <div class="field">
          <label>Presentación (medida)</label>
          <select id="fmPresMedida" onchange="fmPresMedidaChanged(this.value)">${medidaOptionsFor(formProducto?formProducto.presentacion_medida:'KILOGRAMOS')}</select>
        </div>
      </div>

      <div class="field">
        <label>Buscar ingrediente para añadir</label>
        <input type="text" id="fmIngSearch" placeholder="Buscar por código o nombre…" oninput="fmSearchIngredients(this.value)">
        <div class="search-results" id="fmIngResults"></div>
      </div>

      <div class="field">
        <label>Ingredientes (${formIngredientes.length})</label>
        <div id="fmIngList"></div>
        <div class="pct-total ${pctClass}" id="fmPctTotal">Total: ${fmtNum(totalIng)} / ${fmtNum(totalPres)} (${totalPres?fmtNum(totalIng/totalPres*100):'0,00'}%)</div>
      </div>

      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" style="--accent:var(--calidad)" onclick="saveFormulacion()">Guardar</button>
      </div>
    </div>
  `);
  if(formProducto) fmRenderIngList();
}
function fmtRaw(n){ return String(Number(n||0)); }

function fmSearchProducts(q){
  q = q.trim().toUpperCase();
  const results = document.getElementById('fmProdResults');
  if(!q){ results.innerHTML=''; return; }
  const matches = (cacheItems||[]).filter(i=>i.activo && (i.codigo.toUpperCase().includes(q) || i.nombre.toUpperCase().includes(q))).slice(0,20);
  if(!matches.length){ results.innerHTML = '<div class="sr-empty">Sin resultados</div>'; return; }
  results.innerHTML = matches.map(m=>`
    <div class="sr-item" onclick="fmPickProduct('${escHtml(m.codigo)}')"><b>${escHtml(m.codigo)}</b>${escHtml(m.nombre)}</div>
  `).join('');
}
function fmPickProduct(codigo){
  const item = (cacheItems||[]).find(i=>i.codigo===codigo);
  formProducto = { codigo:item.codigo, nombre:item.nombre, presentacion_cantidad:item.presentacion_cantidad||1, presentacion_medida:item.presentacion_medida||'KILOGRAMOS' };
  formIngredientes = [];
  renderFormulacionModal();
}
function fmSearchIngredients(q){
  q = q.trim().toUpperCase();
  const results = document.getElementById('fmIngResults');
  if(!q){ results.innerHTML=''; return; }
  const already = new Set(formIngredientes.map(i=>i.codigo));
  const matches = (cacheItems||[]).filter(i=>i.activo && i.codigo!==(formProducto?formProducto.codigo:'') && !already.has(i.codigo) && (i.codigo.toUpperCase().includes(q) || i.nombre.toUpperCase().includes(q))).slice(0,20);
  if(!matches.length){ results.innerHTML = '<div class="sr-empty">Sin resultados</div>'; return; }
  results.innerHTML = matches.map(m=>`
    <div class="sr-item" onclick="fmAddIngredient('${escHtml(m.codigo)}')"><b>${escHtml(m.codigo)}</b>${escHtml(m.nombre)}</div>
  `).join('');
}
function fmAddIngredient(codigo){
  const item = (cacheItems||[]).find(i=>i.codigo===codigo);
  if(!item) return;
  formIngredientes.push({ codigo:item.codigo, nombre:item.nombre, medida:item.medida, cantidad:0 });
  document.getElementById('fmIngSearch').value = '';
  document.getElementById('fmIngResults').innerHTML = '';
  fmRenderIngList();
}
function fmRemoveIngredient(codigo){
  formIngredientes = formIngredientes.filter(i=>i.codigo!==codigo);
  fmRenderIngList();
}
function fmSetIngQty(codigo, val){
  const n = parseFloat((val||'0').replace(',','.'));
  const ing = formIngredientes.find(i=>i.codigo===codigo);
  if(ing) ing.cantidad = isNaN(n) ? 0 : n;
  fmRecalcPct();
}
function fmSetIngMedida(codigo, newMedida){
  const ing = formIngredientes.find(i=>i.codigo===codigo);
  if(!ing) return;
  ing.cantidad = Math.round(convertQty(ing.cantidad, ing.medida, newMedida)*10000)/10000;
  ing.medida = newMedida;
  fmRenderIngList();
}
function fmRenderIngList(){
  const wrap = document.getElementById('fmIngList');
  if(!wrap) return;
  const totalPres = parseFloat((document.getElementById('fmPresCant')?.value||'1').replace(',','.')) || 1;
  const medidas = cacheMedidas||[];
  const medidaSelectFor = (ing)=> `<select class="ing-medida-select" style="width:100%;font-size:9.5px;padding:3px 2px;border:1px solid var(--line);border-radius:5px;background:#fff;margin-bottom:3px;" onchange="fmSetIngMedida('${escHtml(ing.codigo)}', this.value)">
      ${medidas.map(m=>`<option value="${escHtml(m.nombre)}" ${ing.medida===m.nombre?'selected':''}>${escHtml(m.nombre)}</option>`).join('')}
    </select>`;
  if(!formIngredientes.length){ wrap.innerHTML = '<div class="empty-state" style="padding:16px;">Sin ingredientes añadidos</div>'; }
  else{
    wrap.innerHTML = formIngredientes.map(ing=>{
      const pct = totalPres ? (ing.cantidad/totalPres*100) : 0;
      return `<div class="ing-row">
        <div class="ing-name"><span class="sup">${escHtml(ing.codigo)}</span><span class="nm">${escHtml(ing.nombre)}</span></div>
        <div class="ing-qty">
          ${medidaSelectFor(ing)}
          <input type="text" inputmode="decimal" value="${fmtRaw(ing.cantidad)}" oninput="fmSetIngQty('${escHtml(ing.codigo)}', this.value)">
        </div>
        <div class="ing-pct" id="pct_${escHtml(ing.codigo)}">${pct.toFixed(1)}%</div>
        <button class="ing-rm" onclick="fmRemoveIngredient('${escHtml(ing.codigo)}')">✕</button>
      </div>`;
    }).join('');
  }
  fmRecalcPct();
}
function fmRecalcPct(){
  const totalPres = parseFloat((document.getElementById('fmPresCant')?.value||'1').replace(',','.')) || 1;
  const totalIng = formIngredientes.reduce((s,i)=>s+Number(i.cantidad||0), 0);
  formIngredientes.forEach(ing=>{
    const el = document.getElementById('pct_'+ing.codigo);
    if(el) el.textContent = (totalPres ? (ing.cantidad/totalPres*100) : 0).toFixed(1) + '%';
  });
  const totEl = document.getElementById('fmPctTotal');
  if(totEl){
    const ok = Math.abs(totalIng-totalPres) < 0.001;
    totEl.className = 'pct-total ' + (ok?'ok':'');
    totEl.textContent = `Total: ${fmtNum(totalIng)} / ${fmtNum(totalPres)} (${totalPres?fmtNum(totalIng/totalPres*100):'0,00'}%)`;
  }
}
async function saveFormulacion(){
  if(!formProducto){ toast('Selecciona un producto'); return; }
  if(!formIngredientes.length){ toast('Añade al menos un ingrediente'); return; }
  const presCantInput = parseFloat((document.getElementById('fmPresCant').value||'1').replace(',','.')) || 1;
  const presMedidaInput = document.getElementById('fmPresMedida').value;

  // IMPORTANTE: la presentación de Formulación es independiente de Items.
  // Nunca se escribe en items.presentacion_cantidad / items.presentacion_medida
  // (Monitoreo sigue usando siempre la presentación guardada en Items).
  // Aquí solo convertimos (si el usuario tecleó en otra unidad) al valor que
  // corresponde en la unidad de referencia de Items, para guardar la formulación
  // de forma consistente con el % que se ve en pantalla.
  const itemRow = (cacheItems||[]).find(i=>i.codigo===formProducto.codigo);
  const medidaReferencia = itemRow ? (itemRow.presentacion_medida || presMedidaInput) : presMedidaInput;
  const presCantCanonica = Math.round(convertQty(presCantInput, presMedidaInput, medidaReferencia)*10000)/10000;

  await sb.from('formulacion').delete().eq('cod_producto_principal', formProducto.codigo);
  const rows = formIngredientes.map(ing=>({
    cod_producto_principal: formProducto.codigo,
    cod_componente: ing.codigo,
    cantidad: ing.cantidad,
    medida: ing.medida,
    pres_cantidad: presCantCanonica,
    pres_medida: medidaReferencia
  }));
  const { error } = await sb.from('formulacion').insert(rows);
  if(error){ toast('Error al guardar: ' + error.message); return; }
  closeModal();
  await invLoad(true);
  toast('Formulación guardada');
  renderFormulacionTab();
}

   PLANIFICACIÓN — estado y cachés
   ============================================================ */
const PlanState = { tab:'cronograma', searchCrono:'' };
let cacheCronograma = null;   // filas de la fecha seleccionada en Cronograma (por defecto, hoy)
let planFechaActual = todayISO();   // fecha que se está viendo/editando en Cronograma
let cacheCatalogosPlan = null; // catalogos (motivo_parada, motivo_merma)

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ddMMyy(fechaISO){
  const parts = (fechaISO||todayISO()).split('-'); // yyyy-mm-dd
  if(parts.length<3) return '';
  return parts[2]+parts[1]+parts[0].slice(2);
}
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function hmToISOToday(hm){
  if(!hm) return null;
  const parts = hm.split(':').map(Number);
  const d = new Date();
  d.setHours(parts[0]||0, parts[1]||0, 0, 0);
  return d.toISOString();
}
let currentPersonalCronoId = null;
let currentPersonalOrigen = null;
let personalCatalogoCache = null;
let cachePersonalPlanificacion = null;
let pmMostrarTodos = false;

async function planLoad(force){
  if(!sb) return;
  const tasks = [];
  if(force || !cacheItems)   tasks.push(sb.from('items').select('*').order('codigo').then(r=>cacheItems=r.data||[]));
  if(force || !cacheFormulacion) tasks.push(sb.from('formulacion').select('*').then(r=>cacheFormulacion=r.data||[]));
  if(force || !cacheMedidas) tasks.push(sb.from('medidas').select('*').eq('activo',true).order('nombre').then(r=>cacheMedidas=r.data||[]));
  if(force || !cacheCatalogosPlan) tasks.push(sb.from('catalogos').select('*').eq('activo',true).then(r=>cacheCatalogosPlan=r.data||[]));
  if(force || !cachePersonalPlanificacion) tasks.push(sb.from('personal_planificacion').select('*').eq('activo',true).order('nombre').then(r=>cachePersonalPlanificacion=r.data||[]));
  tasks.push(
    (async ()=>{
      // El cronograma de la fecha seleccionada, más el arrastre de órdenes de días
      // anteriores que quedaron sin finalizar (para que no se pierdan de vista).
      // Si el área actual tiene un área de Planificación restringida (ej. Masa,
      // Acondicionamiento 1/2/3), solo se traen las órdenes de esa área.
      const permiso = permisoActual();
      let hoyQuery = sb.from('cronograma').select('*, cronograma_ingredientes(*), cronograma_personal(*)').eq('fecha', planFechaActual).order('created_at');
      let arrastreQuery = sb.from('cronograma').select('*, cronograma_ingredientes(*), cronograma_personal(*)').eq('finalizado', false).lt('fecha', planFechaActual);
      if(permiso && permiso.planArea){
        hoyQuery = hoyQuery.eq('area', permiso.planArea);
        arrastreQuery = arrastreQuery.eq('area', permiso.planArea);
      }
      const [hoyRes, arrastreRes] = await Promise.all([hoyQuery, arrastreQuery]);
      const hoy = hoyRes.data || [];
      const arrastre = (arrastreRes.data || []).map(r=>({ ...r, _arrastrado:true }));
      cacheCronograma = arrastre.concat(hoy);
    })()
  );
  await Promise.all(tasks);
}

const PRODUCCION_AREAS = ['MASA','ACONDICIONAMIENTO 1','ACONDICIONAMIENTO 2','ACONDICIONAMIENTO 3','SELLADO','BODEGA'];
// La secuencia de órdenes de producción es GLOBAL (no se reinicia por día).
// Se consulta el máximo histórico en toda la tabla cronograma (no solo el cronograma de hoy en caché).
async function nextOP(){
  let maxN = 0;
  try{
    const { data, error } = await sb.from('cronograma').select('orden_produccion').ilike('orden_produccion','OP-%').order('orden_produccion',{ascending:false}).limit(1);
    if(!error && data && data.length){
      const m = /OP-(\d+)/.exec(data[0].orden_produccion||'');
      if(m) maxN = parseInt(m[1],10);
    }
  }catch(e){ console.error('No se pudo consultar la secuencia de OP', e); }
  return 'OP-' + String(maxN+1).padStart(5,'0');
}

// Discos de pizza: se usan durante todo el día apenas se crea la orden, así
// que se ingresan al Kardex de inmediato con la cantidad teórica (programada),
// y se corrigen solas a la cantidad real cuando Monitoreo aprueba la orden —
// porque usan el mismo comprobante ('PRODUCCION N° <orden>'), kardexEscribirProduccion
// reemplaza esa misma entrada en vez de duplicarla.
const DISCOS_NOMBRES = [
  'DISCO DE PIZZA MEDIANO 19.5',
  'DISCO DE PIZZA GRANDE 30.0',
  'DISCO PIZZA PEQUEÑO 16.5'
].map(normalizaNombre);
async function kardexEscribirDiscoTeorico(row){
  const item = (cacheItems||[]).find(i=>i.codigo===row.item_codigo);
  if(!item || !nombreEnLista(item, DISCOS_NOMBRES)) return;
  if(!(row.cantidad_programada>0)) return;
  const comprobante = 'PRODUCCION N° ' + (row.orden_produccion||'');
  const loteProducto = (item.requiere_lote===false) ? 'N/A' : (row.lote || ddMMyy(row.fecha));
  await sb.from('kardex_movimientos').insert({
    item_codigo: row.item_codigo, fecha: row.fecha, lote: loteProducto,
    comprobante, entra: row.cantidad_programada, sale: 0
  });
}
async function crConfirmAdd(codigo){
  const cant = parseFloat((document.getElementById('crCantProg').value||'0').replace(',','.')) || 0;
  const areaSel = document.getElementById('crAreaDesignada');

  const op = await nextOP();
  const { data, error } = await sb.from('cronograma').insert({
    fecha: planFechaActual, area, item_codigo: codigo, cantidad_programada: cant,
    orden_produccion: op, estado:'pendiente', lote: ddMMyy(planFechaActual)
  }).select().single();

  const ingredientes = (cacheFormulacion||[]).filter(f=>{
    if(f.cod_producto_principal!==codigo) return false;
    const compItem = (cacheItems||[]).find(i=>i.codigo===f.cod_componente);

  });
  if(ingredientes.length){
    const rows = ingredientes.map(f=>({ cronograma_id: data.id, item_codigo: f.cod_componente }));
    await sb.from('cronograma_ingredientes').insert(rows);

  await kardexEscribirDiscoTeorico(data);
  await invLoad(true);
  closeModal();
  await planLoad(true);

  renderCronogramaTab();

async function deleteCronogramaRow(id){

// Campos obligatorios para poder finalizar (todo excepto Observaciones,
// Paradas y Merma, que tienen valores por defecto y no bloquean).
function crValidarCompleto(row){
  const faltan = [];
  if(!row.lote) faltan.push('Lote');
  if(!row.hora_inicio) faltan.push('Hora de inicio');
  if(!row.hora_fin) faltan.push('Hora de fin');
  if(!row.responsable) faltan.push('Responsable de la producción');
  if(!((row.cronograma_personal||[]).length)) faltan.push('Personal presente');
  const ingSinConsumo = (row.cronograma_ingredientes||[]).filter(ci=>ci.cantidad_consumida==null);
  if(ingSinConsumo.length){
    const nombres = ingSinConsumo.map(ci=>ci.item_codigo).join(', ');
    faltan.push('Cantidad usada de: ' + nombres);
  }
  const ingSinLote = (row.cronograma_ingredientes||[]).filter(ci=>ci.cantidad_consumida!=null && !(ci.lotes_consumidos||[]).length);
  if(ingSinLote.length){
    const nombres = ingSinLote.map(ci=>ci.item_codigo).join(', ');
    faltan.push('Elegir el lote de: ' + nombres);
  }
  return faltan;
}
async function marcarFinalizadoCronograma(id){
  const row = (cacheCronograma||[]).find(c=>c.id===id);
  if(!row) return;
  await crFinalizarOrden(row);
}
async function crFinalizarOrden(row){
  const id = row.id;
  // La hora de fin solo se completa sola cuando es lo ÚNICO que falta (es decir,
  // ya se llenó todo lo demás y solo se olvidaron de presionar el botón "Fin").
  // Si todavía falta algo más, no se adivina la hora: se avisa igual que el resto.
  if(!row.hora_fin){
    const faltanSinHoraFin = crValidarCompleto({ ...row, hora_fin: '00:00' });
    if(!faltanSinHoraFin.length){
      const hf = nowHM();
      await planUpdateField(id, 'hora_fin', hf);
      row.hora_fin = hf;
      const el = document.getElementById('pfHoraFin');
      if(el) el.value = hf;
    }
  }
  // Defaults automáticos: no bloquean el finalizado.
  if(!row.motivo_merma){
    await planUpdateField(id, 'motivo_merma', 'Sin Merma');
    row.motivo_merma = 'Sin Merma';
  }
  // No se puede finalizar con una parada activa (sin hora de fin).
  const { data: paradasActivas } = await sb.from('paradas').select('id').eq('cronograma_id', id).not('inicio','is',null).is('fin', null);
  if(paradasActivas && paradasActivas.length){
    toast('Hay una parada activa en esta orden. Debes finalizarla (Detener) antes de completar la producción.');
    return;
  }
  const faltan = crValidarCompleto(row);
  if(faltan.length){
    toast('Faltan datos por completar: ' + faltan.join(' · '));
    return;
  }
  const { error } = await sb.from('cronograma').update({ finalizado: true, estado_verificacion:'pendiente' }).eq('id', id);
  if(error){ toast('Error: ' + error.message); return; }
  row.finalizado = true; row.estado_verificacion = 'pendiente';
  toast('Producción finalizada — queda lista para verificar en Monitoreo');
  closeModal();
  await planLoad(true);
  if(PlanState.tab==='cronograma') renderCronogramaTab();
}
async function resetCronogramaProceso(id){

  await sb.from('cronograma_ingredientes').update({

function renderPersonalList(){

  const q = (document.getElementById('pmSearch')?.value||'').trim().toUpperCase();
  const row = (cacheCronograma||[]).find(c=>c.id===currentPersonalCronoId);
  const activos = (row && row.cronograma_personal) || [];

  let personas = (cachePersonalPlanificacion||[]).slice();
  // Por defecto solo se muestra el personal de la misma área de esta orden;
  // al buscar por nombre, se busca en TODAS las áreas (por si alguien de otra

    personas = personas.filter(p=>p.area===areaOrden);

      ${registrosPersona.length ? `<button class="redit" title="Quitar" onclick="pmRemove('${escHtml(n)}')">✕</button>` : ''}

// Si se toma lista dentro de los primeros 20 minutos desde el inicio de la producción,
// se considera que la persona estuvo desde el inicio; pasado ese margen se registra la hora real.
const PM_MARGEN_INICIO_MIN = 20;
function pmHoraIngresoSugerida(row){
  const ahora = nowHM();
  const inicio = row && row.hora_inicio ? String(row.hora_inicio).slice(0,5) : null;
  if(!inicio) return ahora;
  const toMin = t => { const p = String(t).split(':'); return (Number(p[0])||0)*60 + (Number(p[1])||0); };
  const dif = toMin(ahora) - toMin(inicio);
  if(dif >= 0 && dif <= PM_MARGEN_INICIO_MIN) return inicio;
  return ahora;
}
async function pmToggle(nombre, checked){
  const row = (cacheCronograma||[]).find(c=>c.id===currentPersonalCronoId);
  if(!row) return;
  if(!row.cronograma_personal) row.cronograma_personal = [];
  const area = row.area || '';
  if(checked){
    const hm = pmHoraIngresoSugerida(row);
    const { data, error } = await sb.from('cronograma_personal').insert({ cronograma_id: currentPersonalCronoId, nombre, area, hora_ingreso: hm }).select().single();
    if(error){ toast('Error: '+error.message); return; }
    row.cronograma_personal.push(data);
  } else {
    const activo = row.cronograma_personal.find(p=>p.nombre===nombre && !p.hora_salida);
    if(activo){
      const hm = nowHM();
      await sb.from('cronograma_personal').update({hora_salida: hm}).eq('id', activo.id);
      activo.hora_salida = hm;
    }
  }
  renderPersonalList();
  const cnt = document.getElementById('pfPersonalCount');
  if(cnt) cnt.value = row.cronograma_personal.filter(p=>!p.hora_salida).length;
}

async function pmRemove(nombre){
  const row = (cacheCronograma||[]).find(c=>c.id===currentPersonalCronoId);

  const regs = (row.cronograma_personal||[]).filter(p=>p.nombre===nombre);

  if(!confirm('¿Quitar a ' + nombre + ' de esta producción?\n\nSolo se quita de esta orden (no estuvo presente). Sigue disponible en su área para las demás producciones.')) return;
  for(const r of regs){

  wrap.innerHTML = `
    <div class="parada-count">

      <div class="pc"><div class="n" id="pfParadaTiempoTotal">${fmtNum(tiempoTotal)}</div><div class="l">Min. totales</div></div>
    </div>

      <div class="timer-box">

        <div class="tlbl">Parada en curso — ${escHtml(activa.motivo||'sin motivo')}</div>
      </div>
      <button class="btn danger" style="width:100%;" onclick="pfDetenerParada('${activa.id}','${cronogramaId}')">Detener</button>
    ` : `
      <div class="field">
        <label>Motivo principal de parada</label>
        <select id="pfPdMotivo">
          <option value="">Selecciona o escribe uno nuevo…</option>
          ${motivoOptions}
        </select>
        <div class="inline-add" style="margin-top:8px;">
          <input type="text" id="pfPdMotivoNuevo" placeholder="Escribir nuevo motivo…">
          <button class="btn" onclick="pfAddMotivoParada('${cronogramaId}')">+ Añadir</button>
        </div>
      </div>
      <button class="btn primary" style="width:100%;--accent:var(--paradas)" onclick="pfIniciarParada('${cronogramaId}')">Iniciar</button>
    `}
    <div class="list-meta" style="margin-top:16px;">Historial de esta orden</div>
    <div class="reg-list">
      ${paradas.length ? paradas.map(p=>`
        <div class="reg-row">
          <div class="rmain"><span class="sup">${p.inicio?new Date(p.inicio).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):''}${p.fin?(' – '+new Date(p.fin).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})):''}</span><span class="big">${escHtml(p.motivo||'—')}</span></div>
          <div class="rval"><span class="big">${fmtNum(p.minutos)}</span><span class="sub">min</span></div>
        </div>
      `).join('') : '<div class="empty-state">Sin paradas registradas</div>'}
    </div>
  `;
  if(activa){
    pfParadaTimerStart = new Date(activa.inicio).getTime();
    if(pfParadaTimerHandle) clearInterval(pfParadaTimerHandle);
    pfParadaTimerHandle = setInterval(pfUpdateParadaTimer, 1000);
    pfUpdateParadaTimer();
  } else if(pfParadaTimerHandle){
    clearInterval(pfParadaTimerHandle); pfParadaTimerHandle = null;
  }
}
function pfUpdateParadaTimer(){
  const el = document.getElementById('pfParadaTimerVal');
  if(!el || !pfParadaTimerStart) return;
  const diff = Math.max(0, Date.now()-pfParadaTimerStart);
  const h = String(Math.floor(diff/3600000)).padStart(2,'0');
  const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  el.textContent = h+':'+m+':'+s;
}
async function pfAddMotivoParada(cronogramaId){
  const nombre = document.getElementById('pfPdMotivoNuevo').value.trim();

async function pfIniciarParada(cronogramaId){
  const sel = document.getElementById('pfPdMotivo').value;
  const nuevo = document.getElementById('pfPdMotivoNuevo').value.trim();
  const motivo = nuevo || sel || null;
  const horaInicioManual = document.getElementById('pfParadaHoraInicio').value;
  const horaFinManual = document.getElementById('pfParadaHoraFin').value;
  const inicioISO = horaInicioManual ? hmToISOToday(horaInicioManual) : new Date().toISOString();
  if(horaFinManual){
    const finISO = hmToISOToday(horaFinManual);
    const minutos = Math.max(0, Math.round(((new Date(finISO).getTime()-new Date(inicioISO).getTime())/60000)*100)/100);
    const { error } = await sb.from('paradas').insert({ cronograma_id: cronogramaId, inicio: inicioISO, fin: finISO, minutos, motivo });
    if(error){ toast('Error: '+error.message); return; }
  } else {
    const { error } = await sb.from('paradas').insert({ cronograma_id: cronogramaId, inicio: inicioISO, motivo });
    if(error){ toast('Error: '+error.message); return; }
  }
  pfLoadParadasSection(cronogramaId);
}
async function pfDetenerParada(id, cronogramaId){
  const horaFinManual = document.getElementById('pfParadaHoraFin') ? document.getElementById('pfParadaHoraFin').value : '';
  const finDate = horaFinManual ? new Date(hmToISOToday(horaFinManual)) : new Date();
  const inicioMs = pfParadaTimerStart || finDate.getTime();
  const minutos = Math.max(0, Math.round(((finDate.getTime()-inicioMs)/60000)*100)/100);
  const { error } = await sb.from('paradas').update({ fin: finDate.toISOString(), minutos }).eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  if(pfParadaTimerHandle){ clearInterval(pfParadaTimerHandle); pfParadaTimerHandle=null; }
  pfLoadParadasSection(cronogramaId);
}

// Cantidad teórica a consumir de un ingrediente = (cantidad de la formulación / presentación base) × cantidad a producir
function pfCantidadTeorica(row, itemCodigoComponente){
  if(!row) return null;
  const cantProducir = row.cantidad_real!=null ? Number(row.cantidad_real) : Number(row.cantidad_programada||0);
  if(!cantProducir) return null;
  const f = (cacheFormulacion||[]).find(x=>x.cod_producto_principal===row.item_codigo && x.cod_componente===itemCodigoComponente);
  if(!f) return null;
  const base = Number(f.pres_cantidad)||1;
  const porUnidad = Number(f.cantidad||0) / base;
  if(!porUnidad) return null;
  return Math.round(porUnidad * cantProducir * 10000)/10000;
}
const PF_RANGO_ACEPTABLE = 0.08; // ±8% entre lo real y lo teórico
function pfRenderIngredientes(cronogramaId){
  const wrap = document.getElementById('pfIngList');
  if(!wrap) return;
  const row = (cacheCronograma||[]).find(c=>c.id===cronogramaId);
  const ingredientes = (row.cronograma_ingredientes||[]);
  if(!ingredientes.length){ wrap.innerHTML = '<div class="empty-state" style="padding:14px;">Sin ingredientes en esta orden. Búscalos arriba para agregarlos.</div>'; return; }
  wrap.innerHTML = ingredientes.map(ci=>{
    const item = (cacheItems||[]).find(i=>i.codigo===ci.item_codigo);
    const medida = item ? item.medida : '';
    const teorica = pfCantidadTeorica(row, ci.item_codigo);
    let accion, valorHtml;
    if(ci.cantidad_consumida != null){
      let difHtml = '';
      if(teorica){
        const dif = Math.round((Number(ci.cantidad_consumida) - teorica)*10000)/10000;
        const pct = teorica ? (dif/teorica) : 0;
        const fuera = Math.abs(pct) > PF_RANGO_ACEPTABLE;
        const color = fuera ? 'var(--danger)' : 'var(--ok)';
        const signo = dif>0 ? '+' : (dif<0 ? '−' : '');
        difHtml = `<span class="med" style="color:${color};font-weight:700;">${signo}${fmtNum(Math.abs(dif))} ${escHtml(medida)} (${signo}${Math.abs(pct*100).toFixed(1)}%)</span>`;
      }
      valorHtml = `<div class="ci-val"><span class="cant">${fmtNum(ci.cantidad_consumida)}</span>${difHtml||`<span class="med">${escHtml(medida)}</span>`}</div>`;
      if(item && item.requiere_lote===false){
        accion = `<div class="ci-lote"><span class="set" style="cursor:default;">Lote: N/A</span></div>`;
      } else {
        const lotesN = (ci.lotes_consumidos||[]).length;
        accion = `<div class="ci-lote"><button class="${lotesN?'set':''}" onclick="openLotePicker('${ci.id}')">${lotesN?('Lote: '+ci.lotes_consumidos.map(l=>l.lote).join(', ')):'Elegir lote'}</button></div>`;
      }
    } else if(ci.cantidad_inicio != null){
      valorHtml = `<div class="ci-val"><span class="cant">Inicio: ${fmtNum(ci.cantidad_inicio)}</span></div>`;
      accion = `<div class="ci-lote"><button class="set" onclick="openInicioFin('${ci.id}','fin')">Fin</button></div>`;
    } else {
      valorHtml = teorica
        ? `<div class="ci-val"><span class="cant" style="color:var(--muted);">${fmtNum(teorica)}</span><span class="med" style="color:var(--muted);">${escHtml(medida)} teórico</span></div>`
        : `<div class="ci-val"></div>`;
      accion = `<div class="ci-lote" style="display:flex;gap:6px;">

/* ---------------- Calculadora genérica reutilizable ---------------- */
let calcExpr = '';
let calcReturnFn = null;
function openCalculator(startVal, returnFn){
  calcReturnFn = returnFn || null;
  calcExpr = (startVal!=null && /^-?\d+([.,]\d+)?$/.test(String(startVal).trim())) ? String(startVal).replace(',','.') : '';
  openModal(`
    <h3>Calculadora</h3>
    <div class="msub">Realiza la operación y presiona guardar</div>
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button class="clr" onclick="calcClear()">C</button>
      <button onclick="calcBackspace()">⌫</button>
      <button class="op" onclick="calcInput('/')">÷</button>
      <button class="op" onclick="calcInput('*')">×</button>
      <button onclick="calcInput('7')">7</button>
      <button onclick="calcInput('8')">8</button>
      <button onclick="calcInput('9')">9</button>
      <button class="op" onclick="calcInput('-')">−</button>
      <button onclick="calcInput('4')">4</button>
      <button onclick="calcInput('5')">5</button>
      <button onclick="calcInput('6')">6</button>
      <button class="op" onclick="calcInput('+')">+</button>
      <button onclick="calcInput('1')">1</button>
      <button onclick="calcInput('2')">2</button>
      <button onclick="calcInput('3')">3</button>
      <button class="eq" style="grid-row:span 2;" onclick="calcEquals()">=</button>
      <button onclick="calcInput('0')" style="grid-column:span 2;">0</button>
      <button onclick="calcInput('.')">.</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="calcCancel()">Cancelar</button>
      <button class="btn primary" style="--accent:var(--produccion)" onclick="calcSave()">Guardar</button>
    </div>
  `);
  calcUpdateDisplay();
}
function calcUpdateDisplay(){
  const d = document.getElementById('calcDisplay');
  if(d) d.textContent = calcExpr === '' ? '0' : calcExpr;
}
function calcInput(ch){ calcExpr += ch; calcUpdateDisplay(); }
function calcBackspace(){ calcExpr = calcExpr.slice(0,-1); calcUpdateDisplay(); }
function calcClear(){ calcExpr = ''; calcUpdateDisplay(); }
function calcEquals(){
  if(!calcExpr){ return; }
  if(!/^[0-9+\-*/.\s]+$/.test(calcExpr)){ toast('Expresión inválida'); return; }
  try{
    const val = Function('"use strict"; return (' + calcExpr + ')')();
    calcExpr = String(Math.round(val*10000)/10000);
    calcUpdateDisplay();
  }catch(e){ toast('Expresión inválida'); }
}
function calcCancel(){
  const fn = calcReturnFn;
  if(fn) fn(undefined); else closeModal();
}
function calcSave(){
  calcEquals();
  const result = calcExpr;
  const fn = calcReturnFn;
  if(fn) fn(result); else closeModal();
}
async function confirmInicioFin(cronogramaIngId, cual){
  const raw = document.getElementById('ifValor') ? document.getElementById('ifValor').value : '';
  const val = parseFloat(String(raw).replace(',','.'));
  if(isNaN(val)){ toast('Ingresa un valor numérico'); return; }
  const rowActual = (cacheCronograma||[]).find(c=>(c.cronograma_ingredientes||[]).some(ci=>ci.id===cronogramaIngId));
  const ciActual = rowActual ? rowActual.cronograma_ingredientes.find(x=>x.id===cronogramaIngId) : null;
  const itemActual = ciActual ? (cacheItems||[]).find(i=>i.codigo===ciActual.item_codigo) : null;
  const sinLote = itemActual && itemActual.requiere_lote===false;
  let patch;
  if(cual === 'inicio'){
    patch = { cantidad_inicio: val };
  } else if(cual === 'directo'){
    const consumida = Math.round(val*10000)/10000;
    patch = { cantidad_inicio: null, cantidad_fin: null, cantidad_consumida: consumida };
    if(sinLote) patch.lotes_consumidos = [{ lote:'N/A', cantidad: consumida }];
  } else {
    // buscar el registro actual para calcular consumida = inicio - fin
    const inicio = ciActual ? Number(ciActual.cantidad_inicio||0) : 0;
    const consumida = Math.round((inicio - val)*10000)/10000;
    patch = { cantidad_fin: val, cantidad_consumida: consumida };
    if(sinLote) patch.lotes_consumidos = [{ lote:'N/A', cantidad: consumida }];
  }
  const { error } = await sb.from('cronograma_ingredientes').update(patch).eq('id', cronogramaIngId);
  if(error){ toast('Error: ' + error.message); return; }
  await planLoad(true);
  closeModalAll(); // se va a reabrir el modal de producción con datos frescos; evita dejar una versión vieja en la pila
  const row = (cacheCronograma||[]).find(c=>(c.cronograma_ingredientes||[]).some(ci=>ci.id===cronogramaIngId));
  if(row) openCronogramaForm(row.id);
}

  `);
  const { data, error } = await sb.from('v_kardex_lotes_disponibles').select('*').eq('item_codigo', ci.item_codigo).order('fecha_ingreso');
  const listEl = document.getElementById('loteList');
  if(error){ listEl.innerHTML = '<div class="empty-state">No se pudo cargar</div>'; return; }
  const previamente = new Set((ci.lotes_consumidos||[]).map(l=>l.lote));
  loteConsumo = { total: Number(ci.cantidad_consumida||0), seleccion:{}, disponibles: data||[] };
  (ci.lotes_consumidos||[]).forEach(l=>{ loteConsumo.seleccion[l.lote] = l.cantidad; });
  if(!data || !data.length){ listEl.innerHTML = '<div class="empty-state">Sin lotes disponibles registrados en Kardex</div>'; }
  else{
    listEl.innerHTML = data.map(l=>`
      <div class="lote-row">
        <input type="checkbox" ${previamente.has(l.lote)?'checked':''} onchange="toggleLote('${escHtml(l.lote)}', ${l.cantidad_disponible}, this.checked)">
        <div class="lm"><b>Lote ${escHtml(l.lote)}</b><span>Ingreso ${l.fecha_ingreso?l.fecha_ingreso.split('-').reverse().join('/'):'—'}${l.fecha_caducidad?(' · Caduca '+l.fecha_caducidad.split('-').reverse().join('/')):''}</span></div>
        <div class="lq">${fmtNum(l.cantidad_disponible)} ${escHtml(item?item.medida:'')}</div>
      </div>
    `).join('');
  }
  loteRecalc();
}
let loteConsumo = { total:0, seleccion:{}, disponibles:[] };
function toggleLote(lote, disponible, checked){
  if(checked){
    const yaAsignado = Object.values(loteConsumo.seleccion).reduce((s,v)=>s+v,0);
    const falta = Math.max(0, loteConsumo.total - yaAsignado);
    loteConsumo.seleccion[lote] = Math.min(disponible, falta);
  } else {
    delete loteConsumo.seleccion[lote];
  }
  loteRecalc();
}
function loteRecalc(){
  const asignado = Object.values(loteConsumo.seleccion).reduce((s,v)=>s+v,0);
  const falta = Math.round((loteConsumo.total - asignado)*10000)/10000;
  const remainEl = document.getElementById('loteRemain');
  if(remainEl){
    remainEl.className = 'lote-remain ' + (falta<=0.001 ? 'ok' : 'warn');
    remainEl.innerHTML = `<span>A consumir: ${fmtNum(loteConsumo.total)}</span><span>${falta>0.001 ? ('Falta '+fmtNum(falta)) : 'Completo'}</span>`;
  }
}
async function confirmLotes(cronogramaIngId){
  const seleccionados = Object.entries(loteConsumo.seleccion).filter(([,v])=>v>0).map(([lote,cantidad])=>({lote, cantidad}));
  if(!seleccionados.length){ toast('Selecciona al menos un lote'); return; }
  const asignado = seleccionados.reduce((s,l)=>s+l.cantidad,0);
  const falta = Math.round((loteConsumo.total - asignado)*10000)/10000;
  if(falta > 0.001){
    toast('Los lotes elegidos no completan la cantidad a consumir. Falta ' + fmtNum(falta) + '. Elige otro lote o ajusta la cantidad.');
    return;
  }
  const { error } = await sb.from('cronograma_ingredientes').update({ lotes_consumidos: seleccionados }).eq('id', cronogramaIngId);
  if(error){ toast('Error: ' + error.message); return; }
  await planLoad(true);
  closeModalAll();
  const row = (cacheCronograma||[]).find(c=>(c.cronograma_ingredientes||[]).some(ci=>ci.id===cronogramaIngId));
  if(row) openCronogramaForm(row.id);
}

/* ---------------- Finalizar orden → ya NO escribe en Kardex (eso pasa al Verificar en Monitoreo) ---------------- */
// Escribe en Kardex la producción de una orden: descuenta los ingredientes
// consumidos y agrega el producto terminado. Se usa SOLO al verificar en
// Monitoreo (ya no se llama desde Cronograma). Reconciliable: se puede
// llamar varias veces sin duplicar, porque primero borra lo que esta
// orden haya generado antes.
async function kardexEscribirProduccion(row){
  const item = (cacheItems||[]).find(i=>i.codigo===row.item_codigo);
  const cantidad = row.cantidad_real!=null ? row.cantidad_real : row.cantidad_programada;
  const comprobante = 'PRODUCCION N° ' + (row.orden_produccion||'');
  const movimientos = [];
  if(cantidad>0){
    const loteProducto = (item && item.requiere_lote===false) ? 'N/A' : (row.lote || ddMMyy(row.fecha));
    movimientos.push({ item_codigo: row.item_codigo, fecha: row.fecha, lote: loteProducto, comprobante, entra: cantidad, sale: 0 });
  }
  (row.cronograma_ingredientes||[]).forEach(ci=>{
    (ci.lotes_consumidos||[]).forEach(l=>{
      if(Number(l.cantidad) > 0){
        movimientos.push({ item_codigo: ci.item_codigo, fecha: row.fecha, lote: l.lote, comprobante, entra: 0, sale: Number(l.cantidad) });
      }
    });
  });
  const { error: errDel } = await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  if(errDel) return { error: errDel };
  if(movimientos.length){
    const { error } = await sb.from('kardex_movimientos').insert(movimientos);
    if(error) return { error };
  }
  return { error: null };
}
// Revierte (borra) todo lo que esta orden haya escrito en Kardex: la producción
// en sí y el rechazo de calidad. Se usa al "Volver a verificar".
async function kardexRevertirProduccion(row){
  const comprobante = 'PRODUCCION N° ' + (row.orden_produccion||'');
  const comprobanteRechazo = 'RECHAZO PRODUCCION N°' + (row.orden_produccion||row.id);
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobante);
  await sb.from('kardex_movimientos').delete().eq('comprobante', comprobanteRechazo);
  // Para discos, no se debe dejar el Kardex en cero: ya se venían usando desde
  // que se creó la orden, así que se restaura la entrada teórica en vez de
  // borrarla del todo (si el llamador no trae los datos completos del
  // cronograma, kardexEscribirDiscoTeorico simplemente no hace nada).
  await kardexEscribirDiscoTeorico(row);
}
async function guardarProduccion(cronogramaId){
  const row = (cacheCronograma||[]).find(c=>c.id===cronogramaId);
  if(!row) return;
  await crFinalizarOrden(row);
}

function regExportExcel(){
  const rows = regFiltered(); // exactamente lo que se está mostrando en pantalla
  const FIELDS = ['Fecha','N° Orden','Área','Código Producto','Producto','Lote','Cant. Programada','Cant. Real','Merma de Proceso','Medida Merma','Motivo de Merma','Cant. Rechazada','Cant. Reprocesada','Hora Inicio','Hora Fin','Responsable','Observaciones','Ingrediente','Cant. Consumida','Lote(s) Consumido(s)'];
  const aoa = [FIELDS];
  rows.forEach(r=>{
    const item = (cacheItems||[]).find(i=>i.codigo===r.item_codigo);
    const base = [
      r.fecha||'', r.orden_produccion||'', r.area||'', r.item_codigo||'', item?item.nombre:'', r.lote||'',
      r.cantidad_programada!=null?r.cantidad_programada:'', r.cantidad_real!=null?r.cantidad_real:'',
      r.merma_proceso||0, r.merma_medida||'', r.motivo_merma||'',
      r.unid_rechazadas_calidad||0, r.unid_reprocesadas||0,
      r.hora_inicio||'', r.hora_fin||'', r.responsable||'', r.observaciones||''
    ];
    const ings = r.cronograma_ingredientes||[];
    if(!ings.length){ aoa.push(base.concat(['','',''])); return; }
    ings.forEach(ci=>{
      const itIng = (cacheItems||[]).find(i=>i.codigo===ci.item_codigo);
      aoa.push(base.concat([
        (ci.item_codigo||'') + (itIng?(' — '+itIng.nombre):''),

        (ci.lotes_consumidos||[]).map(l=>l.lote+' ('+l.cantidad+')').join(', ')

  ws['!cols'] = FIELDS.map(()=>({wch:18}));

  XLSX.utils.book_append_sheet(wb, ws, 'Registros_Produccion');
  XLSX.writeFile(wb, 'Registros_Planificacion_PROPIZZEC_' + todayISO() + '.xlsx');
  toast('Excel exportado');
}

let EtiqState = { tab:'actividad', fecha: todayISO(), selId:null, q:'', desde:'', hasta:'' };
let cacheEtiqCronograma = null;
let cacheEtiqRegistros = null;
let cacheEtiqConEtiquetado = new Set(); // ids de cronograma que YA tienen al menos un registro de etiquetado

async function renderEtiquetado(){

function etiqGoTab(tab){ EtiqState.tab = tab; setActiveTab(tab); etiqRenderBody(); }
function etiqRenderBody(){
  if(EtiqState.tab === 'registros') return renderEtiqRegistrosTab();
  return renderEtiqActividadTab();
}
async function etiqLoad(force){
  if(!sb) return;
  const tasks = [];
  if(force || !cacheItems) tasks.push(invLoad(true));
  if(force || !cacheFormulacion) tasks.push(sb.from('formulacion').select('*').then(r=>cacheFormulacion=r.data||[]));
  if(force || !cacheCatalogosPlan) tasks.push(sb.from('catalogos').select('*').eq('activo',true).then(r=>cacheCatalogosPlan=r.data||[]));
  tasks.push(
    (async ()=>{
      // Etiquetado funciona independiente de si Planificación ya marcó la orden
      // como finalizada: se muestran las órdenes de la fecha elegida, MÁS las de
      // días anteriores (hasta 14 días atrás) que todavía no tengan ningún
      // material de empaque registrado — sin importar si ya se finalizaron o no.
      const hace14 = new Date(); hace14.setDate(hace14.getDate()-14);
      const hace14ISO = hace14.toISOString().slice(0,10);
      const [hoyRes, arrastreRes, etiqRes] = await Promise.all([
        sb.from('cronograma').select('*, cronograma_ingredientes(*)').eq('fecha', EtiqState.fecha).order('created_at'),
        sb.from('cronograma').select('*, cronograma_ingredientes(*)').lt('fecha', EtiqState.fecha).gte('fecha', hace14ISO),
        sb.from('etiquetado_registros').select('cronograma_id').gte('fecha', hace14ISO)
      ]);
      cacheEtiqConEtiquetado = new Set((etiqRes.data||[]).map(e=>e.cronograma_id));
      const hoy = hoyRes.data || [];
      const arrastre = (arrastreRes.data || [])
        .filter(r=>!cacheEtiqConEtiquetado.has(r.id))
        .map(r=>({ ...r, _atrasado:true }));
      cacheEtiqCronograma = arrastre.concat(hoy);
    })()
  );
  await Promise.all(tasks);
}

function productoTieneFundas(itemCodigo){
  return (cacheFormulacion||[]).some(f=>{
    if(f.cod_producto_principal!==itemCodigo) return false;
    const compItem = (cacheItems||[]).find(i=>i.codigo===f.cod_componente);
    return compItem && compItem.tipo==='MATERIAL_EMPAQUE' && nombreEnLista(compItem, ETIQ_FUNDAS_NOMBRES);
  });
}
function etiqRenderOrdenList(){
  const list = document.getElementById('etiqOrdenList');
  if(!list) return;
  const q = (EtiqState.qLista||'').trim().toUpperCase();
  // Si el producto no tiene ninguna funda en su fórmula, no hay nada que registrar
  // aquí — no tiene sentido que aparezca en esta lista.
  let ordenes = (cacheEtiqCronograma||[]).filter(r=>productoTieneFundas(r.item_codigo));
  if(q){
    ordenes = ordenes.filter(r=>{
      const item = (cacheItems||[]).find(i=>i.codigo===r.item_codigo);
      return (r.item_codigo||'').toUpperCase().includes(q) || (r.orden_produccion||'').toUpperCase().includes(q) || (item && item.nombre.toUpperCase().includes(q));
    });
  }
  ordenes = ordenes.slice().sort((a,b)=>(a._atrasado?0:1)-(b._atrasado?0:1));
  if(!ordenes.length){ list.innerHTML = '<div class="empty-state">Sin órdenes para esta fecha.</div>'; return; }
  list.innerHTML = ordenes.map(r=>{
    const item = (cacheItems||[]).find(i=>i.codigo===r.item_codigo);
    const yaEtiquetado = cacheEtiqConEtiquetado && cacheEtiqConEtiquetado.has(r.id);
    const pendienteTag = !yaEtiquetado ? ' <b style="color:var(--danger);">Pendiente</b>' : '';
    const atrasadoTag = r._atrasado ? ` <span class="sub" style="color:var(--danger);">(${ddMMyy(r.fecha)})</span>` : '';
    return `<div class="reg-row" ${(!yaEtiquetado && r._atrasado)?'style="border:1px solid var(--danger);background:rgba(220,38,38,.05);"':''} onclick="etiqAbrirModal('${r.id}')">
      <div class="rmain"><span class="sup">${escHtml(r.item_codigo)} · ${escHtml(r.orden_produccion||'')} · Lote ${escHtml(r.lote||ddMMyy(r.fecha))}</span><span class="big">${escHtml(item?item.nombre:r.item_codigo)}${pendienteTag}${atrasadoTag}</span></div>

    </div>`;
  }).join('');
}

function etiqToggleLote(lote, disponible, checked){
  if(checked){
    const yaAsignado = Object.values(etiqLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
    const falta = Math.max(0, etiqLoteConsumo.total - yaAsignado);
    etiqLoteConsumo.seleccion[lote] = Math.min(disponible, falta);
  } else {
    delete etiqLoteConsumo.seleccion[lote];
  }
  etiqLoteRecalc();
}
function etiqLoteRecalc(){
  const asignado = Object.values(etiqLoteConsumo.seleccion).reduce((s,v)=>s+v,0);
  const falta = Math.round((etiqLoteConsumo.total - asignado)*10000)/10000;
  const remainEl = document.getElementById('etiqLoteRemain');
  if(remainEl){
    remainEl.className = 'lote-remain ' + (falta<=0.001 ? 'ok' : 'warn');
    remainEl.innerHTML = `<span>A consumir: ${fmtNum(etiqLoteConsumo.total)}</span><span>${falta>0.001 ? ('Falta '+fmtNum(falta)) : 'Completo'}</span>`;
  }
}
function etiqConfirmarLotes(idx){
  const r = EtiqModalState.rows[idx];
  if(!r) return;
  const seleccionados = Object.entries(etiqLoteConsumo.seleccion).filter(([,v])=>v>0).map(([lote,cantidad])=>({lote, cantidad}));
  if(!seleccionados.length){ toast('Selecciona al menos un lote'); return; }
  const asignado = seleccionados.reduce((s,l)=>s+l.cantidad,0);
  const falta = Math.round((etiqLoteConsumo.total - asignado)*10000)/10000;
  if(falta > 0.001){
    toast('Los lotes elegidos no completan la cantidad a consumir. Falta ' + fmtNum(falta) + '. Elige otro lote o ajusta la cantidad.');
    return;
  }
  r.lotes_consumidos = seleccionados;
  closeModal();
  etiqRenderMeListInner();
}
async function etiqGuardarModal(){
  const row = (cacheEtiqCronograma||[]).find(r=>r.id===EtiqModalState.cronogramaId);
  if(!row) return;
  const lote = document.getElementById('etiqModalLote').value.trim();
  if(!lote){ toast('El lote del producto no puede quedar vacío'); return; }
  const observaciones = document.getElementById('etiqModalObs').value;
  const responsable = document.getElementById('etiqModalResp').value;
  const rowsAUsar = EtiqModalState.rows.filter(r=>r.cantidad!=null && r.cantidad>0);
  if(!rowsAUsar.length){ toast('Ingresa la cantidad usada de al menos un material de empaque'); return; }
  const sinLote = rowsAUsar.filter(r=>!(r.lotes_consumidos||[]).length);
  if(sinLote.length){ toast('Falta elegir el lote de: ' + sinLote.map(r=>r.item_codigo).join(', ')); return; }

  if(lote !== row.lote){
    const { error: errLote } = await sb.from('cronograma').update({ lote }).eq('id', row.id);
    if(errLote){ toast('Error al actualizar el lote: ' + errLote.message); return; }
    row.lote = lote;
  }
  const item = (cacheItems||[]).find(i=>i.codigo===row.item_codigo);
  for(const r of rowsAUsar){
    for(const lc of r.lotes_consumidos){
      const payload = {
        cronograma_id: row.id, fecha: row.fecha, orden_produccion: row.orden_produccion,
        item_codigo: row.item_codigo, item_nombre: item?item.nombre:row.item_codigo, lote_producto: lote,
        item_me_codigo: r.item_codigo, item_me_nombre: r.item_nombre, cantidad: lc.cantidad, lote_me: lc.lote,
        observaciones, responsable
      };
      const { data, error } = await sb.from('etiquetado_registros').insert(payload).select().single();
      if(error){ toast('Error al guardar ' + r.item_codigo + ': ' + error.message); continue; }
      const comprobante = 'ETIQUETADO-' + data.id;
      const { error: errK } = await sb.from('kardex_movimientos').insert({
        item_codigo: r.item_codigo, fecha: row.fecha, lote: lc.lote, comprobante, entra:0, sale: lc.cantidad
      });
      if(errK){ toast('Se guardó ' + r.item_codigo + ', pero hubo un error al descontar del Kardex: ' + errK.message); }
    }
  }
  await invLoad(true);
  cacheEtiqConEtiquetado.add(row.id); // ya no queda "Pendiente" en la lista
  toast('Etiquetado registrado y descontado del Kardex');
  closeModal();
  etiqRenderOrdenList();
}
async function etiqActualizarLote(cronogramaId, lote){
  lote = (lote||'').trim();
  if(!lote){ toast('El lote no puede quedar vacío'); return; }
  const { error } = await sb.from('cronograma').update({ lote }).eq('id', cronogramaId);
  if(error){ toast('Error: '+error.message); return; }
  const row = (cacheEtiqCronograma||[]).find(r=>r.id===cronogramaId);
  if(row) row.lote = lote;
  toast('Lote actualizado — sincronizado con Planificación');
}
function etiqRenderMeListHtml(registros){
  if(!registros.length) return '<div class="empty-state">Sin material de empaque registrado todavía.</div>';
  return registros.map(r=>`
    <div class="reg-row">
      <div class="rmain"><span class="sup">${escHtml(r.item_me_codigo)} · Lote ${escHtml(r.lote_me||'')}</span><span class="big">${escHtml(r.item_me_nombre)}</span></div>
      <div class="rval"><span class="big">${fmtNum(r.cantidad)}</span>${r.responsable?`<span class="sub">${escHtml(r.responsable)}</span>`:''}</div>
      <button class="redit" title="Eliminar" onclick="etiqEliminarME('${r.id}')">✕</button>
    </div>
  `).join('');
}
async function etiqEliminarME(id){
  if(!confirm('¿Eliminar este registro? Se revertirá lo descontado del Kardex.')) return;
  await sb.from('kardex_movimientos').delete().eq('comprobante', 'ETIQUETADO-'+id);
  const { error } = await sb.from('etiquetado_registros').delete().eq('id', id);
  if(error){ toast('Error: '+error.message); return; }
  await invLoad(true);
  toast('Registro eliminado y Kardex revertido');
  etiqRenderDetalle();
}

      (r.item_codigo||'').toUpperCase().includes(q) || (r.item_nombre||'').toUpperCase().includes(q) ||

function etiqRegExportExcel(){
  const rows = etiqRegFiltered();
  const FIELDS = ['Fecha','N° Orden','Código Producto','Producto','Lote Producto','Código ME','Material de Empaque','Cantidad','Lote ME','Responsable','Observaciones'];
  const aoa = [FIELDS];
  rows.forEach(r=>{
    aoa.push([r.fecha, r.orden_produccion||'', r.item_codigo||'', r.item_nombre||'', r.lote_producto||'', r.item_me_codigo||'', r.item_me_nombre||'', r.cantidad||0, r.lote_me||'', r.responsable||'', r.observaciones||'']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = FIELDS.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Etiquetado');
  XLSX.writeFile(wb, 'Etiquetado_PROPIZZEC_' + todayISO() + '.xlsx');
  toast('Excel exportado');
}


const MonState = { tab:'produccion', selId:null };
let cacheRegistro = null;
let cacheOrdenesPendientesBacklog = null; // órdenes finalizadas de días anteriores aún sin verificar
let cacheConfigHorarios = null;
let monParadasInfo = {}; // { cronogramaId: {num, minutos} }

async function monLoad(force){
  if(!sb) return;
  await planLoad(force); // recarga el cronograma para la fecha actualmente seleccionada en Monitoreo (planFechaActual)
  const tasks = [];
  if(force || !cacheConfigHorarios) tasks.push(sb.from('config_horarios').select('*').then(r=>cacheConfigHorarios=r.data||[]));
  tasks.push(sb.from('registro_produccion').select('*').eq('fecha', planFechaActual).then(r=>cacheRegistro=r.data||[]));
  // Rezago: órdenes finalizadas en días anteriores que todavía no se han verificado
  // (o que se enviaron a "revisar"), para que no se pierdan de vista en Monitoreo.
  tasks.push(
    sb.from('cronograma').select('*, cronograma_ingredientes(*), cronograma_personal(*)')
      .eq('finalizado', true).neq('estado_verificacion','aprobado').lt('fecha', planFechaActual)
      .then(r=>cacheOrdenesPendientesBacklog = r.data||[])
  );
  await Promise.all(tasks);
}

async function renderMonitoreo(){
  const app = document.getElementById('app');
  planFechaActual = todayISO(); // al entrar fresco al módulo, siempre arranca en hoy
  app.innerHTML = `
    <div class="tabbar">
      <button class="tabbtn ${MonState.tab==='produccion'?'active':''}" data-tab="produccion" onclick="monGoTab('produccion')">Producción Operativa</button>
      <button class="tabbtn ${MonState.tab==='registros'?'active':''}" data-tab="registros" onclick="monGoTab('registros')">Registros</button>
    </div>
    <div id="monBody"><div class="empty-state">Cargando…</div></div>
  `;
  await monLoad(false);
  await monRenderBody();
}
async function monCambiarFecha(fecha){
  planFechaActual = fecha || todayISO();
  MonState.selId = null; // el producto seleccionado ya no aplica si se cambia de fecha
  await monLoad(true);
  monRenderBody();
}
function monGoTab(tab){ MonState.tab = tab; setActiveTab(tab); monRenderBody(); }
function monRenderBody(){
  if(MonState.tab === 'produccion') return renderMonProduccion();
  if(MonState.tab === 'registros') return renderMonRegistrosTab();
}

function monGetCronograma(id){ return (cacheCronograma||[]).find(c=>c.id===id); }
function monGetRegistro(id){ return (cacheRegistro||[]).find(r=>r.cronograma_id===id); }
function monHoraDefecto(area){
  const h = (cacheConfigHorarios||[]).find(c=>c.area===area);
  return h ? h.hora_inicio_defecto : '07:30';
}
function monEnsureRegistro(id){
  let reg = monGetRegistro(id);
  if(!reg){
    const cr = monGetCronograma(id);
    const item = cr ? (cacheItems||[]).find(i=>i.codigo===cr.item_codigo) : null;
    reg = {
      cronograma_id:id, fecha: cr ? cr.fecha : todayISO(), area: cr ? cr.area : null,
      codigo_producto: cr ? cr.item_codigo : null, producto: item ? item.nombre : null,
      presentacion: item ? (fmtRaw(item.presentacion_cantidad)+' '+(item.presentacion_medida||'')) : null,
      lote: cr ? cr.lote : null, orden_produccion: cr ? cr.orden_produccion : null,
      operarios:null, hora_inicio: cr ? cr.hora_inicio : null, hora_fin: cr ? cr.hora_fin : null, horas_extra:0,
      unid_planificadas: cr ? cr.cantidad_programada : null, unid_producidas: cr ? (cr.cantidad_real!=null ? cr.cantidad_real : cr.cantidad_programada) : null,
      unid_buen_estado:null,
      unid_no_conformes: cr ? (cr.unid_rechazadas_calidad||0) : 0, unid_reprocesadas: cr ? (cr.unid_reprocesadas||0) : 0,
      num_paradas:0, tiempo_paradas:0, motivo_parada:null,
      mp_entrante:null, merma_proceso: cr ? (cr.merma_proceso||0) : 0, motivo_merma: cr ? (cr.motivo_merma||null) : null,
      peso_teorico: item ? item.presentacion_cantidad : null,
      mp_teorica_kg:null, mp_real_kg:null,
      no_conformidades: cr ? (cr.unid_rechazadas_calidad||0) : 0,
      responsable_mp: cr ? (cr.responsable||null) : null, observaciones_mp:'',
      responsable_verificacion:null,
      locked:false, _isNew:true
    };
    if(!cacheRegistro) cacheRegistro = [];
    cacheRegistro.push(reg);
  }
  return reg;
}
async function monLoadParadasInfo(id, force){
  if(monParadasInfo[id] && !force) return monParadasInfo[id];
  const { data } = await sb.from('paradas').select('minutos, motivo').eq('cronograma_id', id);
  const rows = data||[];
  const minutos = rows.reduce((s,p)=>s+Number(p.minutos||0),0);
  const motivosUnicos = [];
  rows.forEach(p=>{ const m=(p.motivo||'').trim(); if(m && !motivosUnicos.includes(m)) motivosUnicos.push(m); });
  const motivo = motivosUnicos.join('; ');
  monParadasInfo[id] = { num: rows.length, minutos, motivo };
  return monParadasInfo[id];
}
let monParadasListCache = {};
async function monLoadParadasList(id, force){
  if(monParadasListCache[id] && !force) return monParadasListCache[id];
  const { data } = await sb.from('paradas').select('*').eq('cronograma_id', id).order('created_at');
  monParadasListCache[id] = data || [];
  return monParadasListCache[id];
}
function monCalc(reg){
  const c = {};
  const toMin = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
  const hi = toMin(reg.hora_inicio), hf = toMin(reg.hora_fin);
  c.horasBloque = (hi!==null && hf!==null && hf>=hi) ? (hf-hi)/60 : null;
  const extra = Number(reg.horas_extra||0);
  c.horasTotales = c.horasBloque!==null ? c.horasBloque + extra : null;
  const oper = reg.operarios!=null ? Number(reg.operarios) : null;
  c.hhTotales = (c.horasTotales!=null && oper!=null) ? c.horasTotales*oper : null;
  const plan = reg.unid_planificadas!=null ? Number(reg.unid_planificadas) : null;
  const prod = reg.unid_producidas!=null ? Number(reg.unid_producidas) : null;
  // El producto rechazado por calidad es el mismo dato que "Unid. No Conformes",
  // así que se usa un solo valor (capturado en Producción Operativa).
  c.mermaTotal = Number(reg.merma_proceso||0);
  c.noConformesTotal = Number(reg.unid_no_conformes||0);
  const buen = (prod!=null) ? Math.max(0, prod - c.noConformesTotal) : null;
  c.buenEstado = buen;
  c.pctCumplPlan = (plan) ? prod/plan : null;
  c.pctConforme = (prod) ? buen/prod : null;
  c.productividad = (c.hhTotales) ? prod/c.hhTotales : null;
  const tParada = Number(reg.tiempo_paradas||0);
  c.pctDisponibilidad = (c.horasTotales) ? (c.horasTotales*60 - tParada)/(c.horasTotales*60) : null;
  const mp = reg.mp_entrante!=null ? Number(reg.mp_entrante) : null;
  const merma = c.mermaTotal;
  c.pctMerma = (mp) ? merma/mp : null;
  // Rendimiento de MP = Σ teórico (según fórmula) / Σ real consumido, sumando SOLO
  // los ingredientes medidos en peso (kg/g) para no mezclar unidades distintas.
  // Ambos totales se calculan y guardan al momento de verificar en Monitoreo.
  c.rendimientoMP = (reg.mp_teorica_kg!=null && reg.mp_real_kg) ? reg.mp_teorica_kg/reg.mp_real_kg : null;
  c.oee = (c.pctDisponibilidad!=null && c.pctCumplPlan!=null && c.pctConforme!=null) ? c.pctDisponibilidad*c.pctCumplPlan*c.pctConforme : null;
  return c;
}

function monRenderListaRows(rows){
  if(!rows.length) return '<div class="empty-state">Sin órdenes pendientes por verificar.</div>';
  return rows.map(r=>{
    const item = (cacheItems||[]).find(i=>i.codigo===r.item_codigo);
    return `<div class="reg-row" onclick="monAbrirProducto('${r.id}')">
      <div class="rmain"><span class="sup">${escHtml(r.item_codigo)} · ${escHtml(r.orden_produccion||'')}${r._atrasado?(' · '+ddMMyy(r.fecha)):''}</span><span class="big">${escHtml(item?item.nombre:r.item_codigo)} <b style="color:var(--danger);">Pendiente</b></span></div>
      <div class="rval"><span class="sup">CANTIDAD</span><span class="big">${fmtNum(r.cantidad_real!=null?r.cantidad_real:r.cantidad_programada)}</span></div>
    </div>`;
  }).join('');
}
function monListaFiltrada(){
  const productos = (cacheCronograma||[]).filter(r=>{
    if(!r.finalizado) return false;
    const reg = (cacheRegistro||[]).find(x=>x.cronograma_id===r.id);
    return !(reg && reg.locked);
  });
  const backlog = (cacheOrdenesPendientesBacklog||[]).map(r=>({...r,_atrasado:true}));
  let todas = backlog.concat(productos);
  const q = (MonState.qLista||'').trim().toUpperCase();
  if(q){
    todas = todas.filter(r=>{
      const item = (cacheItems||[]).find(i=>i.codigo===r.item_codigo);
      return (r.item_codigo||'').toUpperCase().includes(q) || (r.orden_produccion||'').toUpperCase().includes(q) || (item && item.nombre.toUpperCase().includes(q));
    });
  }
  return todas;
}

  const esHoy = planFechaActual === todayISO();
  return `
    <div class="field" style="max-width:220px;">
      <label>Fecha a verificar</label>
      <input type="date" value="${escHtml(planFechaActual)}" onchange="monCambiarFecha(this.value)">
    </div>
    ${esHoy ? '' : '<div class="sub" style="margin-top:-8px;margin-bottom:10px;color:var(--paradas);font-weight:600;">Estás viendo una fecha distinta a hoy.</div>'}
    <div class="list-toolbar">
      <div class="search-wrap"><span class="sic">🔎</span>
        <input type="text" id="monListSearch" placeholder="Buscar producto por código o nombre…" value="${escHtml(MonState.qLista||'')}">
      </div>
    </div>
    <div class="list-meta">Órdenes por verificar</div>
    <div class="reg-list" id="monOrdenList">${monRenderListaRows(monListaFiltrada())}</div>
  `;
}
function monVolverBtnHtml(){
  return `<button class="btn ghost" type="button" style="margin-bottom:14px;" onclick="monVolverALista()">← Volver al listado</button>`;
}
function monVolverALista(){
  MonState.selId = null;
  monRenderBody();
}
async function monAbrirProducto(id){
  const row = (cacheOrdenesPendientesBacklog||[]).find(r=>r.id===id);
  if(row){ if(!cacheCronograma) cacheCronograma=[]; cacheCronograma = cacheCronograma.filter(c=>c.id!==id).concat([row]); }
  await monSelectProducto(id);
}
async function monSelectProducto(id){
  MonState.selId = id || null;
  if(id){ await monLoadParadasInfo(id); await monLoadParadasList(id); }
  monRenderBody();
}

async function renderMonProduccion(){
  const body = document.getElementById('monBody');
  const id = MonState.selId;
  if(!id){
    body.innerHTML = monRenderListaProductos();
    const input = document.getElementById('monListSearch');
    if(input) input.addEventListener('input', e=>{
      MonState.qLista = e.target.value;
      document.getElementById('monOrdenList').innerHTML = monRenderListaRows(monListaFiltrada());
    });
    return;
  }
  const cr = monGetCronograma(id);
  if(!cr){
